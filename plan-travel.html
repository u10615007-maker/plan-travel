  <script>
    if (typeof lucide === 'undefined') { window.lucide = { createIcons() {} }; }

    let globalCloudData = { activeTripId: 'matsu', trips: [] };
    let activeTrip = null;
    let activeDayIndex = 0;
    let mapDayIndex = 0;
    let weatherDayIndex = 0;
    let draggedDayIndex = null;
    let draggedSpotIndex = null;

    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const ICONS = ['⛩️', '✈️', '🗼', '🌸', '🗻', '🍵', '🚄', '🍣', '🍱', '🧋', '🏮', '🏖️', '🗽', '🏰', '🎡'];

    let map = null;
    let mapMarkers = [];
    let mapPolyline = null;
    let searchDebounceTimers = {};

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const apiParam = urlParams.get('api');
      if (apiParam) SINGLE_CLOUD_API_URL = apiParam;
      await loadGlobalCloudData();
    });

    async function loadGlobalCloudData() {
      if (SINGLE_CLOUD_API_URL && !SINGLE_CLOUD_API_URL.includes('您的')) {
        try {
          const nocacheUrl = SINGLE_CLOUD_API_URL + (SINGLE_CLOUD_API_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
          const res = await fetch(nocacheUrl, { cache: 'no-store' });
          if (res.ok) {
            const data = await res.json();
            if (data && data.trips && data.trips.length > 0) { globalCloudData = data; lastSyncedTrips = cloneJson(data.trips); }
          }
        } catch (e) { console.error("雲端讀取失敗", e); }
      }

      if (!globalCloudData.trips || globalCloudData.trips.length === 0) {
        globalCloudData.trips = [{
          id: 'matsu',
          tripTitle: '馬祖 5 天 4 夜跳島行',
          tripIcon: '🏝️',
          startDate: '2026-10-24',
          days: [{
            spots: [
              { id: '1', name: '基隆港新臺馬輪', lat: 25.132, lng: 121.741, arriveTime: '20:00', stayMins: 120, city: '基隆市', openHours: '24小時營業', note: '' },
              { id: '2', name: '東引島燈塔', lat: 26.371, lng: 120.501, arriveTime: '06:00', stayMins: 90, city: '連江縣', openHours: '09:00 - 17:00 (週一公休)', note: '' }
            ],
            transits: [{ mode: 'ship', mins: 600, distKm: 180.0, notes: '', manualMins: null }]
          }],
          members: ['我'],
          expenses: []
        }];
        globalCloudData.activeTripId = 'matsu';
      }
      setActiveTrip(globalCloudData.activeTripId || globalCloudData.trips[0].id);
      startCloudPolling();
    }

    function setActiveTrip(tripId) {
      const found = globalCloudData.trips.find(t => t.id === tripId);
      activeTrip = found || globalCloudData.trips[0];
      globalCloudData.activeTripId = activeTrip.id;
      activeDayIndex = 0;
      recalculateTimes(0);
      renderAll();
      lucide.createIcons();
    }

    // ============================================================
    // ☁️ 雲端同步：自動抓取朋友的修改，並在儲存時合併（不會整份覆蓋）
    // ============================================================
    let lastSyncedTrips = null;      // 上次與雲端同步完成時的旅程內容（用來判斷「誰改了什麼」）
    let saveTimer = null, saving = false, dirty = false, needsRefresh = false;
    let pollTimer = null;
    let currentTab = 'itinerary';
    const POLL_MS = 8000;

    const jkey = (v) => JSON.stringify(v === undefined ? null : v);
    const cloneJson = (v) => JSON.parse(JSON.stringify(v));
    function cloudEnabled() { return !!SINGLE_CLOUD_API_URL && !SINGLE_CLOUD_API_URL.includes('您的'); }

    async function fetchRemote() {
      try {
        const url = SINGLE_CLOUD_API_URL + (SINGLE_CLOUD_API_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) return null;
        const d = await res.json();
        return d && Array.isArray(d.trips) ? d : null;
      } catch (e) { return null; }
    }

    // 同一趟旅程，雙方都有改時：逐項合併，同一個地方才以我這邊為準
    function mergeTrip(bt, lt, rt) {
      const out = Object.assign({}, lt);
      ['tripTitle', 'tripIcon', 'startDate'].forEach(k => { if (jkey(lt[k]) === jkey(bt[k])) out[k] = rt[k]; });

      // 成員：聯集
      const mem = (lt.members || []).slice();
      (rt.members || []).forEach(m => { if (!mem.includes(m) && !(bt.members || []).includes(m)) mem.push(m); });
      out.members = mem;

      // 記帳：依 id 聯集（朋友同時新增的帳不會被蓋掉）
      const exp = (lt.expenses || []).slice();
      const baseIds = new Set((bt.expenses || []).map(e => e.id));
      const localIds = new Set(exp.map(e => e.id));
      (rt.expenses || []).forEach(e => { if (!localIds.has(e.id) && !baseIds.has(e.id)) exp.push(e); });
      const remoteIds = new Set((rt.expenses || []).map(e => e.id));
      out.expenses = exp.filter(e => !(baseIds.has(e.id) && !remoteIds.has(e.id)) || localIds.has(e.id) && jkey(e) !== jkey((bt.expenses || []).find(x => x.id === e.id)));

      // 行程天數：沒動過的天用朋友的版本；兩邊天數結構不同時以我這邊為準
      const bd = bt.days || [], ld = lt.days || [], rd = rt.days || [];
      if (jkey(ld) === jkey(bd)) out.days = rd;
      else if (ld.length === bd.length && rd.length === bd.length) out.days = ld.map((d, i) => jkey(d) === jkey(bd[i]) ? rd[i] : d);
      else out.days = ld;
      return out;
    }

    function mergeTrips(base, local, remote) {
      const bm = new Map((base || []).map(t => [t.id, t]));
      const rm = new Map((remote || []).map(t => [t.id, t]));
      const result = [], seen = new Set();
      (local || []).forEach(lt => {
        seen.add(lt.id);
        const bt = bm.get(lt.id), rt = rm.get(lt.id);
        if (!rt) { if (bt && jkey(bt) === jkey(lt)) return; result.push(lt); }   // 朋友刪除了、我沒動過 → 一起刪除
        else if (!bt) result.push(lt);
        else if (jkey(lt) === jkey(bt)) result.push(rt);                             // 我沒改 → 用朋友的
        else if (jkey(rt) === jkey(bt)) result.push(lt);                             // 朋友沒改 → 用我的
        else result.push(mergeTrip(bt, lt, rt));
      });
      (remote || []).forEach(rt => { if (!seen.has(rt.id) && !bm.has(rt.id)) result.push(rt); }); // 朋友新增的旅程
      return result;
    }

    // 用新的旅程內容取代目前資料，並保留你目前選的旅程 / 天數
    function adoptTrips(trips) {
      if (!trips || !trips.length) return;
      const curId = activeTrip && activeTrip.id;
      globalCloudData.trips = trips;
      activeTrip = trips.find(t => t.id === curId) || trips[0];
      globalCloudData.activeTripId = activeTrip.id;
      const n = activeTrip.days.length;
      if (activeDayIndex >= n) activeDayIndex = n - 1;
      if (mapDayIndex >= n) mapDayIndex = n - 1;
      if (weatherDayIndex >= n) weatherDayIndex = n - 1;
    }

      needsRefresh = false;

    function saveGlobalCloudData() {
      if (!cloudEnabled()) return;
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flushSave, 700);
    }

    async function flushSave() {
      if (!cloudEnabled()) { dirty = false; return; }
      if (saving) { saveTimer = setTimeout(flushSave, 500); return; }
      saving = true;
      dirty = false;
      try {
        // 先抓雲端最新內容，把朋友剛改的合併進來，再存回去
        const remote = await fetchRemote();
        if (remote) {
          const before = jkey(globalCloudData.trips);
          const merged = mergeTrips(lastSyncedTrips || [], globalCloudData.trips, remote.trips);
          adoptTrips(merged);
          if (jkey(globalCloudData.trips) !== before) {
            if (userIsEditing()) needsRefresh = true; else refreshView();
          }
        }
        const postedTrips = cloneJson(globalCloudData.trips);
        const res = await fetch(SINGLE_CLOUD_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(globalCloudData)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        lastSyncedTrips = postedTrips;
      } catch (e) {
        console.error('雲端同步失敗', e);
        dirty = true;
        clearTimeout(saveTimer);
        saveTimer = setTimeout(flushSave, 5000);
      }
      saving = false;
    }

    // 定時檢查雲端有沒有新內容（朋友改了就自動更新畫面）
    async function pollCloud() {
      if (!cloudEnabled() || saving || dirty || document.hidden || userIsEditing()) return;
      const remote = await fetchRemote();
      if (!remote || saving || dirty || userIsEditing()) return;
      if (lastSyncedTrips && jkey(remote.trips) === jkey(lastSyncedTrips)) return; // 沒有變動
      lastSyncedTrips = cloneJson(remote.trips);
      if (jkey(remote.trips) === jkey(globalCloudData.trips)) return;
      adoptTrips(remote.trips);
      refreshView();
      showToast('已同步朋友的最新修改');
    }

    function startCloudPolling() {
      if (pollTimer || !cloudEnabled()) return;
      pollTimer = setInterval(pollCloud, POLL_MS);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) pollCloud(); });
      window.addEventListener('focus', pollCloud);
      document.addEventListener('focusout', () => {
        if (needsRefresh) setTimeout(() => { if (needsRefresh && !userIsEditing()) refreshView(); }, 250);

    function formatDuration(mins) {
      if (!mins || mins <= 0) return '0 分鐘';
      const hours = Math.floor(mins / 60), rem = mins % 60;
      if (hours === 0) return `${rem} 分鐘`;
      if (rem === 0) return `${hours} 小時`;
      return `${hours} 小時 ${rem} 分鐘`;
    }

    // ============================================================
    // 🧭 Google 路線 / 轉乘建議（使用 Routes API）
    // 需要在 Google Cloud Console 啟用「Routes API」，且 API Key 的限制要包含它
    // ============================================================
    const ROUTE_TRANSIT_MODES = ['bus', 'coach', 'mrt', 'train', 'hsr'];
    const ROUTE_SUPPORTED_MODES = ['bus', 'coach', 'mrt', 'train', 'hsr', 'drive', 'walk'];
    const ROUTES_FIELD_MASK = 'routes.duration,routes.distanceMeters,routes.description,routes.travelAdvisory,routes.legs.steps.travelMode,routes.legs.steps.staticDuration,routes.legs.steps.distanceMeters,routes.legs.steps.navigationInstruction,routes.legs.steps.transitDetails';
    const routeGuideLoading = {};
    const routeGuideErrors = {};
    const routeGuideCollapsed = {};

    function escHtml(t) {
      return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function gmapsTravelMode(mode) {
      return { drive: 'driving', walk: 'walking', bike: 'bicycling', scooter: 'two-wheeler' }[mode] || 'transit';
    }

    function routeGuideKey(a, b, mode) { return [a.lat, a.lng, b.lat, b.lng, mode].join('|'); }
    function routeLoadingKey(i) { return `${activeTrip.id}-${activeDayIndex}-${i}`; }

    function parseSecs(v) { return parseFloat(String(v == null ? '0' : v).replace('s', '')) || 0; }

    function clockText(lv, iso) {
      const t = lv && lv.time && lv.time.text;
      if (t) return t;
      if (iso) {
        const d = new Date(iso);
        if (!isNaN(d.getTime())) return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }
      return '';
    }

    // 台鐵常見車種英文 → 中文
    function localizeLineName(n) {
      const map = [[/Local\s*Train/i, '區間車'], [/Fast\s*Local/i, '區間快'], [/Tze-?\s*Chiang/i, '自強號'], [/Chu-?\s*Kuang/i, '莒光號'], [/Fu-?\s*Hsing/i, '復興號'], [/Puyuma/i, '普悠瑪號'], [/Taroko/i, '太魯閣號'], [/Emu3000/i, '新自強號'], [/Rapid/i, '快速'], [/Express/i, '快車']];
      for (const [re, zh] of map) if (re.test(n)) return zh;
      return n;
    }

    function vehicleEmoji(type) {
      switch (type) {
        case 'SUBWAY': case 'METRO_RAIL': case 'MONORAIL': case 'LIGHT_RAIL': case 'TRAM': return '🚇';
        case 'BUS': case 'INTERCITY_BUS': case 'TROLLEYBUS': case 'SHARE_TAXI': return '🚌';
        case 'HIGH_SPEED_TRAIN': return '🚅';
        case 'HEAVY_RAIL': case 'COMMUTER_TRAIN': case 'RAIL': case 'LONG_DISTANCE_TRAIN': return '🚆';
        case 'FERRY': return '⛴️';
        case 'CABLE_CAR': case 'GONDOLA_LIFT': case 'FUNICULAR': return '🚡';
        default: return '🚍';
      }
    }

    // 以「上一站停留結束的時間」當出發時間；超出時刻表範圍（過去或 10 天以後）就改用最近的同星期幾
    function getDepartureForRoute(dayIdx, i) {
      const day = activeTrip.days[dayIdx];
      const spotA = day.spots[i];
      const info = getComputedDayDate(dayIdx);
      const [h, m] = (spotA.arriveTime || '09:00').split(':').map(Number);
      const leaveMins = (h || 0) * 60 + (m || 0) + (parseInt(spotA.stayMins) || 0);
      const planned = new Date(`${info.dateStr}T00:00:00`);
      const now = Date.now();
      if (isNaN(planned.getTime())) {
        const t = new Date(now + 10 * 60000);
        return { iso: t.toISOString(), shifted: true, label: '現在' };
      }
      planned.setMinutes(leaveMins);
      const minT = now + 5 * 60000, maxT = now + 10 * 86400000;
      const target = new Date(planned.getTime());
      while (target.getTime() < minT) target.setDate(target.getDate() + 7);
      while (target.getTime() > maxT) target.setDate(target.getDate() - 7);
      const shifted = target.getTime() !== planned.getTime();
      const label = `${target.getMonth() + 1}/${target.getDate()}（${WEEKDAYS[target.getDay()]}）${String(target.getHours()).padStart(2, '0')}:${String(target.getMinutes()).padStart(2, '0')}`;
      return { iso: target.toISOString(), shifted, label };
    }

    async function callRoutesApi(body) {
      const res = await fetch('https://routes.googleapis.com/directions/v2:computeRoutes', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Goog-Api-Key': GOOGLE_MAPS_API_KEY,
          'X-Goog-FieldMask': ROUTES_FIELD_MASK
        },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const e = new Error((data.error && data.error.message) || ('HTTP ' + res.status));
        e.status = (data.error && data.error.status) || '';
        throw e;
      }
      return data;
    }

    // 把 Routes API 的回應整理成精簡資料（會存進行程，所以只留需要的欄位）
    function buildGuideFromRoute(route) {
      const leg = (route.legs && route.legs[0]) || {};
      const g = {
        totalMins: Math.max(1, Math.round(parseSecs(route.duration) / 60)),
        distKm: parseFloat(((route.distanceMeters || 0) / 1000).toFixed(1)),
        description: route.description || '',
        fare: '',
        steps: []
      };
      const fare = route.travelAdvisory && route.travelAdvisory.transitFare;
      if (fare && fare.currencyCode) {
        const amt = parseFloat(fare.units || 0) + (fare.nanos || 0) / 1e9;
        g.fare = `${fare.currencyCode} ${Math.round(amt * 100) / 100}`;
      }
      (leg.steps || []).forEach(st => {
        const td = st.transitDetails;
        const mins = Math.round(parseSecs(st.staticDuration) / 60);
        if (td) {
          const line = td.transitLine || {};
          const veh = line.vehicle || {};
          const sd = td.stopDetails || {};
          const lv = td.localizedValues || {};
          g.steps.push({
            t: 'transit',
            vehicle: veh.type || '',
            vehicleName: (veh.name && veh.name.text) || '',
            line: line.nameShort || line.name || '',
            headsign: td.headsign || '',
            agency: (line.agencies && line.agencies[0] && line.agencies[0].name) || '',
            from: (sd.departureStop && sd.departureStop.name) || '',
            to: (sd.arrivalStop && sd.arrivalStop.name) || '',
            dep: clockText(lv.departureTime, sd.departureTime),
            arr: clockText(lv.arrivalTime, sd.arrivalTime),
            stops: td.stopCount || 0,
            mins
          });
        } else {
          const meters = st.distanceMeters || 0;
          if (mins === 0 && meters < 50) return;
          g.steps.push({ t: 'walk', mins, meters, text: (st.navigationInstruction && st.navigationInstruction.instructions) || '' });
        }
      });
      return g;
    }

    // 你選的交通方式 → Google 路線中對應的交通類別
    const ROUTE_MODE_CATEGORY = { bus: 'bus', coach: 'bus', mrt: 'mrt', train: 'train', hsr: 'hsr' };
    const ROUTE_ALLOWED_MODES = { bus: ['BUS'], coach: ['BUS'], mrt: ['SUBWAY', 'LIGHT_RAIL'], train: ['TRAIN'], hsr: ['TRAIN'] };
    const CATEGORY_LABEL = { hsr: '高鐵 / 新幹線', train: '火車 / JR 鐵路', mrt: '捷運 / 地下鐵', bus: '公車 / 客運', ferry: '船運', other: '其他大眾運輸' };

    function stepCategory(s) {
      const txt = [s.line, s.vehicleName, s.agency].join(' ');
      if (s.vehicle === 'HIGH_SPEED_TRAIN' || /高鐵|高速鐵路|新幹線|High[\s-]?Speed|THSR|Shinkansen|bullet/i.test(txt)) return 'hsr';
      switch (s.vehicle) {
        case 'SUBWAY': case 'METRO_RAIL': case 'MONORAIL': case 'LIGHT_RAIL': case 'TRAM': return 'mrt';
        case 'BUS': case 'INTERCITY_BUS': case 'TROLLEYBUS': case 'SHARE_TAXI': return 'bus';
        case 'HEAVY_RAIL': case 'COMMUTER_TRAIN': case 'RAIL': case 'LONG_DISTANCE_TRAIN': return 'train';
        case 'FERRY': return 'ferry';
        default: return 'other';
      }
    }

    function routeFitsMode(steps, mode) {
      const want = ROUTE_MODE_CATEGORY[mode];
      if (!want) return true;
      const cats = (steps || []).filter(st => st.t === 'transit').map(stepCategory);
      if (!cats.includes(want)) return false;
      if (want !== 'hsr' && cats.includes('hsr')) return false;
      return true;
    }

    // 從 Google 回傳的多條路線中，挑出「有用到你所選交通方式」的路線；全程都是該交通的優先
    function pickGuideForMode(routes, mode) {
      const want = ROUTE_MODE_CATEGORY[mode];
      let best = null;
      for (const r of routes || []) {
        const gd = buildGuideFromRoute(r);
        if (!routeFitsMode(gd.steps, mode)) continue;
        const cats = gd.steps.filter(st => st.t === 'transit').map(stepCategory);
        gd.mixed = cats.some(c => c !== want);
        if (!best || (best.mixed && !gd.mixed)) best = gd;
        if (!gd.mixed) break;
      }
      return best;
    }

    async function fetchRouteGuide(i) {
      const day = activeTrip.days[activeDayIndex];
      const spotA = day.spots[i], spotB = day.spots[i + 1], transit = day.transits[i];
      if (!spotA || !spotB || !transit) return;
      const mode = transit.mode || 'drive';
      const lk = routeLoadingKey(i);
      routeGuideLoading[lk] = true;
      delete routeGuideErrors[lk];
      delete routeGuideCollapsed[lk];
      renderSpotsList();

      const guideBase = { key: routeGuideKey(spotA, spotB, mode), mode };
      try {
        const body = {
          origin: { location: { latLng: { latitude: spotA.lat, longitude: spotA.lng } } },
          destination: { location: { latLng: { latitude: spotB.lat, longitude: spotB.lng } } },
          languageCode: 'zh-TW',
          units: 'METRIC'
        };
        let data, picked = null;
        if (ROUTE_TRANSIT_MODES.includes(mode)) {
          const dep = getDepartureForRoute(activeDayIndex, i);
          body.travelMode = 'TRANSIT';
          body.departureTime = dep.iso;
          body.computeAlternativeRoutes = true;
          guideBase.depLabel = dep.label;
          guideBase.shifted = dep.shifted;
          // 先只查你選的交通方式；沒有的話再放寬（允許搭配其他交通當接駁），一樣必須用到你選的交通
          body.transitPreferences = { allowedTravelModes: ROUTE_ALLOWED_MODES[mode] };
          data = await callRoutesApi(body);
          picked = pickGuideForMode(data.routes, mode);
          if (!picked) {
            delete body.transitPreferences;
            data = await callRoutesApi(body);
            picked = pickGuideForMode(data.routes, mode);
          }
          if (!picked && data.routes && data.routes.length) {
            const cats = [];
            buildGuideFromRoute(data.routes[0]).steps.filter(st => st.t === 'transit').forEach(st => {
              const l = CATEGORY_LABEL[stepCategory(st)];
              if (!cats.includes(l)) cats.push(l);
            });
            routeGuideErrors[lk] = `找不到搭配【${CATEGORY_LABEL[ROUTE_MODE_CATEGORY[mode]]}】的路線。Google 建議改搭：${cats.join(' ＋ ') || '其他方式'}，可以改選那個交通方式再查詢。`;
          }
        } else {
          body.travelMode = mode === 'walk' ? 'WALK' : 'DRIVE';
          if (mode === 'drive') body.routingPreference = 'TRAFFIC_UNAWARE';
          data = await callRoutesApi(body);
          if (data.routes && data.routes.length) picked = buildGuideFromRoute(data.routes[0]);
        }
        if (picked) {
          transit.guide = Object.assign(guideBase, picked);
          saveGlobalCloudData();
        } else if (!routeGuideErrors[lk]) {
          routeGuideErrors[lk] = '找不到可行的路線（這個時段可能沒有班次，或 Google 沒有該區域的大眾運輸資料）。可以點「Google 導航」看看。';
        }
      } catch (err) {
        console.error('Routes API 失敗：', err);
        let msg = (err && err.message) ? err.message : '未知錯誤';
        if (err && (err.status === 'PERMISSION_DENIED' || /not been used|disabled|blocked|referer|API key/i.test(msg))) {
          msg += '｜請到 Google Cloud Console 啟用「Routes API」，並確認 API Key 的限制有包含 Routes API 與目前的網址。';
        }
        routeGuideErrors[lk] = msg;
      }
      delete routeGuideLoading[lk];
      renderSpotsList();
    }

    function renderRouteGuide(i, transit, g) {
      let html = '';
      const isTransit = ROUTE_TRANSIT_MODES.includes(g.mode);
      if (isTransit) {
        const transfers = Math.max(g.steps.filter(s => s.t === 'transit').length - 1, 0);
        html += `<div class="font-bold text-jp-dark">🧭 Google 建議路線：約 ${g.totalMins} 分鐘（${formatDuration(g.totalMins)}），${transfers === 0 ? '不需轉乘' : '轉乘 ' + transfers + ' 次'}${g.fare ? '，預估票價 ' + escHtml(g.fare) : ''}</div>`;
        let n = 0;
        html += `<ol class="list-decimal ml-4 mt-1 space-y-1">` + g.steps.map(s => {
          if (s.t === 'walk') {
            return `<li>🚶 步行約 ${s.mins} 分鐘${s.meters ? `（${s.meters} 公尺）` : ''}${s.text ? `：${escHtml(s.text)}` : ''}</li>`;
          }
          const first = n === 0; n++;
          const cat = stepCategory(s);
          const name = cat === 'hsr' ? '高鐵' : localizeLineName(s.line || s.vehicleName || '大眾運輸');
          return `<li>${first ? '' : '🔁 <b>轉乘：</b>'}${cat === 'hsr' ? '🚅' : vehicleEmoji(s.vehicle)} 搭 <b>${escHtml(name)}</b>${s.headsign ? `（往 ${escHtml(String(s.headsign).replace(/^(往|to)\s*/i, ''))}）` : ''}：${escHtml(s.from)} → ${escHtml(s.to)}${s.stops ? `，${s.stops} 站` : ''}${(s.dep || s.arr) ? `，${escHtml(s.dep)}～${escHtml(s.arr)}` : ''}</li>`;
        }).join('') + `</ol>`;
        html += `<div class="text-[10px] text-jp-dark/50 mt-1">以 ${escHtml(g.depLabel || '')} 出發查詢${g.shifted ? '（行程日期超出時刻表範圍，改以最近的同星期班次為參考，實際請以當天時刻為準）' : ''}${g.mixed ? '；以你選的交通方式為主，其餘為接駁（如捷運、公車）' : ''}</div>`;
      } else {
        html += `<div class="font-bold text-jp-dark">${g.mode === 'walk' ? '🚶' : '🚗'} Google 建議：${g.description ? '經 ' + escHtml(g.description) + '，' : ''}約 ${g.totalMins} 分鐘（${formatDuration(g.totalMins)}，${g.distKm} km）</div>`;
        if (g.mode === 'drive') html += `<div class="text-[10px] text-jp-dark/50 mt-1">未計入即時路況，出發前請再確認</div>`;
      }
      html += `<button onclick="updateManualTransitMins(${i}, ${g.totalMins})" class="mt-1.5 text-[11px] bg-jp-accentLight text-jp-accent hover:bg-jp-accent/20 px-2.5 py-1 rounded-lg border border-jp-accent/30 font-bold transition">⏱ 套用 Google 的 ${g.totalMins} 分鐘</button>`;
      return html;
    }

    function toggleRouteGuide(i) {
      const lk = routeLoadingKey(i);
      routeGuideCollapsed[lk] = !routeGuideCollapsed[lk];
      renderSpotsList();
    }

    function routeGuideSummary(g) {
      if (ROUTE_TRANSIT_MODES.includes(g.mode)) {
        const transfers = Math.max(g.steps.filter(s => s.t === 'transit').length - 1, 0);
        return `🧭 約 ${g.totalMins} 分鐘，${transfers === 0 ? '不需轉乘' : '轉乘 ' + transfers + ' 次'}${g.fare ? '，' + escHtml(g.fare) : ''}`;
      }
      return `${g.mode === 'walk' ? '🚶' : '🚗'} 約 ${g.totalMins} 分鐘（${g.distKm} km）`;
    }

    function buildGuideHtml(i, transit, spotA, spotB) {
      const mode = transit.mode || 'drive';
      if (transit.isInvalid || !ROUTE_SUPPORTED_MODES.includes(mode)) return '';
      const lk = routeLoadingKey(i);
      const valid = transit.guide && transit.guide.key === routeGuideKey(spotA, spotB, mode) && (!ROUTE_TRANSIT_MODES.includes(mode) || routeFitsMode(transit.guide.steps, mode)) ? transit.guide : null;
      let html = `<div class="text-[11px] bg-white p-2 rounded-lg border border-jp-sand space-y-1.5">`;
      if (routeGuideLoading[lk]) {
        html += `<div class="text-jp-dark/60">⏳ 正在向 Google 查詢路線...</div>`;
      } else {
        html += `<button onclick="fetchRouteGuide(${i})" class="text-[11px] bg-jp-accent text-white hover:bg-jp-accent/90 px-3 py-1 rounded-lg font-bold transition">🧭 ${valid ? '重新查詢' : '查詢'}${ROUTE_TRANSIT_MODES.includes(mode) ? '搭乘與轉乘建議' : '路線建議'}</button>`;
        if (valid) html += ` <button onclick="toggleRouteGuide(${i})" class="text-[11px] bg-jp-bg hover:bg-jp-border text-jp-dark px-3 py-1 rounded-lg border border-jp-border font-bold transition">${routeGuideCollapsed[lk] ? '▼ 展開' : '▲ 收起'}</button>`;
      }
      if (routeGuideErrors[lk]) html += `<div class="text-rose-600">⚠️ ${escHtml(routeGuideErrors[lk])}</div>`;
      if (valid && !routeGuideLoading[lk]) {
        html += routeGuideCollapsed[lk]
          ? `<div class="text-jp-dark/60">${routeGuideSummary(valid)}</div>`
          : renderRouteGuide(i, transit, valid);
      }
      html += `</div>`;
      return html;
    }

    // ---------- 營業時間：依「行程當天星期幾」帶入 Google 原文，並與到達時間比對 ----------
    function timeToMins(str) {
      const [h, m] = (str || '09:00').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    }

    // 沒有手動修改過時，自動帶入 Google 提供的「當天」營業時間原文
    function syncSpotHours(spot, dow) {
      if (spot.openHoursManual || !spot.weekdayDescriptions) return;
      const text = spot.weekdayDescriptions[(dow + 6) % 7] || ''; // Google 陣列第 0 筆是星期一
      spot.openHours = text.replace(/^[^\d:：]{1,10}[:：]\s*/, '').trim(); // 只拿掉「星期X:」標籤，時間文字維持原樣
    }

    // 從文字（Google 原文或手動輸入）判斷到達時間是否營業
    function evalOpenFromText(text, t, stay) {
      if (!text || !text.trim()) return { state: 'none' };
      if (/24\s*小時|24\s*H|24\s*hours/i.test(text)) return { state: 'open' };
      const hasTime = /\d{1,2}:\d{2}/.test(text);
      if (!hasTime && /休息|公休|不營業|未營業|Closed/i.test(text)) return { state: 'closed' };

      const re = /(上午|下午|AM|PM)?\s*(\d{1,2}):(\d{2})\s*(AM|PM|上午|下午)?/gi;
      const tokens = [];
      let m;
      while ((m = re.exec(text)) !== null) {
        let h = parseInt(m[2], 10);
        const mm = parseInt(m[3], 10);
        const mer = (m[1] || m[4] || '').toUpperCase();
        if ((mer === '下午' || mer === 'PM') && h < 12) h += 12;
        if ((mer === '上午' || mer === 'AM') && h === 12) h = 0;
        tokens.push(h * 60 + mm);
      }
      if (tokens.length < 2 || tokens.length % 2 !== 0) return { state: 'unknown' };

      for (let k = 0; k < tokens.length; k += 2) {
        const o = tokens[k];
        let c = tokens[k + 1];
        if (c <= o) c += 1440;
        for (const w of [t, t + 1440]) {
          if (w >= o && w < c) return { state: (w + stay > c) ? 'closing' : 'open' };
        }
      }
      return { state: 'closed' };
    }

    function checkBusinessStatus(spot, dow) {
      const t = timeToMins(spot.arriveTime);
      const stay = parseInt(spot.stayMins) || 0;
      let result = null;

      // 有 Google 結構化營業時段時，優先用它判斷（最準，含跨夜）
      const periods = spot.openPeriods;
      if (!spot.openHoursManual && periods && periods.length) {
        if (periods.length === 1 && !periods[0].close) {
          result = { state: 'open' };
        } else {
          const W = dow * 1440 + t;
          result = { state: 'closed' };
          for (const p of periods) {
            if (!p.open) continue;
            if (!p.close) { result = { state: 'open' }; break; }
            const o = p.open.day * 1440 + p.open.hour * 60 + p.open.minute;
            let c = p.close.day * 1440 + p.close.hour * 60 + p.close.minute;
            if (c <= o) c += 10080;
            let hit = false;
            for (const shift of [0, 10080]) {
              const w = W + shift;
              if (w >= o && w < c) { result = { state: (w + stay > c) ? 'closing' : 'open' }; hit = true; break; }
            }
            if (hit) break;
          }
        }
      } else {
        result = evalOpenFromText(spot.openHours, t, stay);
      }

      switch (result.state) {
        case 'open':    return { label: '🟢 營業中', colorClass: 'bg-emerald-50 text-emerald-700 border-emerald-200' };
        case 'closing': return { label: '🟡 營業中（停留期間會打烊）', colorClass: 'bg-amber-50 text-amber-700 border-amber-200' };
        case 'closed':  return { label: '🔴 未營業', colorClass: 'bg-rose-50 text-rose-700 border-rose-200' };
        case 'unknown': return { label: 'ℹ️ 無法判斷，依現場為準', colorClass: 'bg-blue-50 text-blue-700 border-blue-200' };
        default:        return { label: '未提供營業時間', colorClass: 'bg-gray-100 text-gray-500 border-gray-200' };
      }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');
      ['itinerary', 'map', 'weather', 'split', 'shortener'].forEach(t => {
        document.getElementById(`tab-${t}-btn`).className = t === tab ? "px-3 py-1.5 rounded-lg transition-all bg-jp-accent text-white shadow-sm font-bold" : "px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium";
      });
      if (tab === 'map') initOrUpdateMap();
      if (tab === 'weather') renderWeatherTab();
      if (tab === 'split') renderSplitTab();
    }

    function renderAll() {
      renderTripSelector();
      document.getElementById('trip-title-input').value = activeTrip.tripTitle;
      document.getElementById('trip-icon-display').textContent = activeTrip.tripIcon || '⛩️';
      document.getElementById('start-date-picker').value = activeTrip.startDate || '2026-10-24';
      renderDaySelector();
      renderSpotsList();
      preparePrintContent();
    }

    function renderDaySelector() {
      document.getElementById('day-selector-container').innerHTML = activeTrip.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        const isSelected = idx === activeDayIndex;
        return `
          <div class="flex items-center rounded-xl border transition ${isSelected ? 'bg-jp-accent text-white border-jp-accent shadow-sm font-bold' : 'bg-jp-bg text-jp-dark/70 border-jp-border'}">
            <span draggable="true" ondragstart="handleDayDragStart(event, ${idx})" ondragover="event.preventDefault()" ondrop="handleDayDrop(event, ${idx})" ondragend="handleDayDragEnd(event)" class="drag-handle-zone text-xs px-2 py-1.5 opacity-60 hover:opacity-100" title="拖曳排序">⋮⋮</span>
            <button onclick="selectDay(${idx})" class="pr-3 py-1.5 text-xs">第 ${idx + 1} 天 (${info.shortDateStr || ''})</button>
            ${activeTrip.days.length > 1 ? `<button onclick="event.stopPropagation(); removeDay(${idx})" class="pr-2 pl-1 py-1.5 text-xs opacity-70 hover:opacity-100 hover:text-rose-200 transition border-l border-jp-border/30 ml-0.5">×</button>` : ''}
          </div>
        `;
      }).join('');
      const activeInfo = getComputedDayDate(activeDayIndex);
      document.getElementById('current-day-title').textContent = `第 ${activeDayIndex + 1} 天`;
      document.getElementById('current-day-weekday').textContent = activeInfo.weekdayStr;
    }

    function selectDay(idx) { activeDayIndex = idx; recalculateTimes(idx); renderAll(); }
    function addDay() {
      activeTrip.days.push({ spots: [{ id: Date.now().toString(), name: '新景點', lat: 25.042, lng: 121.508, arriveTime: '09:00', stayMins: 60, city: '臺北市', openHours: '', note: '' }], transits: [] });
      activeDayIndex = activeTrip.days.length - 1;
      renderAll();
      saveGlobalCloudData();
    }
    function removeDay(idx) {
      if (activeTrip.days.length <= 1) return;
      activeTrip.days.splice(idx, 1);
      if (activeDayIndex >= activeTrip.days.length) activeDayIndex = activeTrip.days.length - 1;
      recalculateTimes(activeDayIndex);
      renderAll();
      saveGlobalCloudData();
    }

    function handleDayDragStart(e, idx) { draggedDayIndex = idx; e.dataTransfer.setData('text/plain', idx); }
    function handleDayDrop(e, targetIdx) {
      e.preventDefault();
      if (draggedDayIndex === null || draggedDayIndex === targetIdx) return;
      const movedDay = activeTrip.days.splice(draggedDayIndex, 1)[0];
      activeTrip.days.splice(targetIdx, 0, movedDay);
      activeDayIndex = targetIdx;
      draggedDayIndex = null;
      renderAll();
      saveGlobalCloudData();
    }
    function handleDayDragEnd(e) { draggedDayIndex = null; }
    function handleSpotDragStart(e, idx) {
      draggedSpotIndex = idx;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'spot-' + idx);
      const card = document.getElementById('spot-card-' + idx);
      if (card) {
        try { e.dataTransfer.setDragImage(card, 24, 24); } catch (_) {}
        setTimeout(() => card.classList.add('spot-dragging'), 0);
      }
    }
    function handleSpotDragOver(e, idx) {
      if (draggedSpotIndex === null) return; // 只有拖握把時才反應，選取文字不會觸發
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const card = document.getElementById('spot-card-' + idx);
      if (card && idx !== draggedSpotIndex) card.classList.add('spot-drop-target');
    }
    function handleSpotDragLeave(e, idx) {
      const card = document.getElementById('spot-card-' + idx);
      if (card && !card.contains(e.relatedTarget)) card.classList.remove('spot-drop-target');
    }
    function handleSpotDragEnd(e) {
      draggedSpotIndex = null;
      document.querySelectorAll('.spot-dragging, .spot-drop-target').forEach(el => el.classList.remove('spot-dragging', 'spot-drop-target'));
    }

    function handleSpotDrop(e, targetIdx) {
      if (draggedSpotIndex === null) return;
      e.preventDefault();
      document.querySelectorAll('.spot-dragging, .spot-drop-target').forEach(el => el.classList.remove('spot-dragging', 'spot-drop-target'));
      if (draggedSpotIndex === targetIdx) { draggedSpotIndex = null; return; }
      const day = activeTrip.days[activeDayIndex];
      const movedSpot = day.spots.splice(draggedSpotIndex, 1)[0];
      day.spots.splice(targetIdx, 0, movedSpot);
      if (day.transits && day.transits.length > 0) {
        const fromT = Math.min(draggedSpotIndex, day.spots.length - 2);
        const toT = Math.min(targetIdx, day.spots.length - 2);
        if (fromT >= 0 && toT >= 0 && fromT !== toT && day.transits[fromT]) {
          const movedTransit = day.transits.splice(fromT, 1)[0];
          day.transits.splice(toT, 0, movedTransit);
        }
      }
      draggedSpotIndex = null;
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    function detectCrossSeaType(spotA, spotB) {
      const dist = calcDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
      if (dist > 300) return 'international';
      if (dist > 25) {
        const nameA = (spotA.name || '') + (spotA.city || '');
        const nameB = (spotB.name || '') + (spotB.city || '');
        const offshoreKeywords = ['馬祖', '東引', '南竿', '北竿', '莒光', '澎湖', '金門', '綠島', '蘭嶼', '大坵'];
        const isAOff = offshoreKeywords.some(k => nameA.includes(k));
        const isBOff = offshoreKeywords.some(k => nameB.includes(k));
        if (isAOff !== isBOff || (isAOff && isBOff && dist > 30)) return 'offshore';
      }
      return null;
    }

    function checkIsWestTaiwanLand(spotA, spotB) {
      const westKeywords = ['台北', '臺北', '新北', '基隆', '桃園', '新竹', '苗栗', '台中', '臺中', '彰化', '雲林', '嘉義', '台南', '臺南', '高雄', '屏東'];
      const nameA = (spotA.name || '') + (spotA.city || '');
      const nameB = (spotB.name || '') + (spotB.city || '');
      return westKeywords.some(k => nameA.includes(k)) && westKeywords.some(k => nameB.includes(k));
    }

    async function recalculateTimes(dayIdx) {
      const day = activeTrip.days[dayIdx];
      if (!day || !day.spots.length) return;
      if (!day.transits) day.transits = [];

      for (let i = 0; i < day.spots.length - 1; i++) {
        const spotA = day.spots[i], spotB = day.spots[i + 1];
        if (!day.transits[i]) day.transits[i] = { mode: 'drive', mins: 30, distKm: 5.0, notes: '', manualMins: null, isInvalid: false };

        const transit = day.transits[i];
        const mode = transit.mode || 'drive';
        const crossSeaType = detectCrossSeaType(spotA, spotB);
        const isWestTaiwan = checkIsWestTaiwanLand(spotA, spotB);
        const straightDist = calcDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);

        if (crossSeaType && ['drive', 'scooter', 'bike', 'walk', 'bus', 'coach', 'mrt', 'train', 'hsr'].includes(mode)) {
          transit.isInvalid = true; transit.mins = 0; transit.distKm = parseFloat(straightDist.toFixed(1));
          transit.notes = `❌ 兩地隔海，無法以【${mode}】到達`;
          spotB.arriveTime = spotA.arriveTime || '09:00';
          continue;
        } else if (isWestTaiwan && ['plane', 'ship'].includes(mode)) {
          transit.isInvalid = true; transit.mins = 0; transit.distKm = parseFloat(straightDist.toFixed(1));
          transit.notes = `❌ 西部陸路無【${mode}】直達！`;
          spotB.arriveTime = spotA.arriveTime || '09:00';
          continue;
        } else {
          transit.isInvalid = false;
        }

        if (transit.manualMins === null || transit.manualMins === undefined) {
          if (mode === 'ship') {
            transit.distKm = parseFloat(straightDist.toFixed(1));
            transit.mins = straightDist > 100 ? 540 : Math.max(Math.round(straightDist * 3) + 15, 20);
          } else if (mode === 'plane') {
            transit.distKm = parseFloat(straightDist.toFixed(1));
            transit.mins = straightDist > 300 ? Math.round(straightDist / 8.5) : 50;
          } else if (mode === 'hsr') {
            transit.distKm = parseFloat((straightDist * 1.15).toFixed(1));
            transit.mins = Math.max(Math.round((transit.distKm / 210) * 60) + 10, 10);
          } else if (mode === 'train') {
            transit.distKm = parseFloat((straightDist * 1.25).toFixed(1));
            transit.mins = Math.max(Math.round((transit.distKm / 75) * 60) + 10, 10);
          } else if (mode === 'walk') {
            transit.distKm = parseFloat((straightDist * 1.2).toFixed(1));
            transit.mins = Math.max(Math.round((transit.distKm / 4.5) * 60), 2);
          } else {
            try {
              let osrmProfile = (mode === 'bike') ? 'bike' : 'car';
              const res = await fetch(`https://routing.openstreetmap.de/routed-${osrmProfile}/route/v1/driving/${spotA.lng},${spotA.lat};${spotB.lng},${spotB.lat}?overview=false`);
              const data = await res.json();
              if (data && data.routes && data.routes.length > 0) {
                const route = data.routes[0];
                transit.distKm = parseFloat((route.distance / 1000).toFixed(1));
                let baseMins = Math.round(route.duration / 60);
                transit.mins = Math.max(baseMins, 1);
              } else { throw new Error(); }
            } catch (err) {
              transit.distKm = parseFloat(straightDist.toFixed(1));
              transit.mins = Math.max(Math.round((transit.distKm / 40) * 60) + 5, 5);
            }
          }
        }

        const [h, m] = (spotA.arriveTime || '09:00').split(':').map(Number);
        const totalNextMins = (h * 60 + m) + parseInt(spotA.stayMins || 0) + transit.mins;
        spotB.arriveTime = `${String(Math.floor(totalNextMins / 60) % 24).padStart(2, '0')}:${String(totalNextMins % 60).padStart(2, '0')}`;
      }
      renderSpotsList();
      preparePrintContent();
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 5.0;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

        pendingFocusSpot = null;
        if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.focus(); el.select(); }

    const MODE_LABELS = { drive: '🚗 開車', walk: '🚶 步行', hsr: '🚅 高鐵 / 新幹線', train: '🚆 火車 / JR鐵路', scooter: '🛵 機車', bike: '🚲 單車', coach: '🚌 客運', bus: '🚍 公車', mrt: '🚇 捷運 / 地下鐵', plane: '✈️ 飛機', ship: '🚢 船運' };

    function printGuideLines(g, mode) {
      const lines = [];
      if (ROUTE_TRANSIT_MODES.includes(mode)) {
        const transfers = Math.max(g.steps.filter(x => x.t === 'transit').length - 1, 0);
        lines.push(`Google 建議路線：約 ${g.totalMins} 分鐘，${transfers === 0 ? '不需轉乘' : '轉乘 ' + transfers + ' 次'}${g.fare ? '，預估票價 ' + g.fare : ''}${g.depLabel ? '（以 ' + g.depLabel + ' 出發查詢）' : ''}`);
        let n = 0;
        g.steps.forEach(st => {
          if (st.t === 'walk') { lines.push(`步行約 ${st.mins} 分鐘${st.meters ? '（' + st.meters + ' 公尺）' : ''}${st.text ? '：' + st.text : ''}`); return; }
          const cat = stepCategory(st);
          const name = cat === 'hsr' ? '高鐵' : localizeLineName(st.line || st.vehicleName || '大眾運輸');
          const head = st.headsign ? `（往 ${String(st.headsign).replace(/^(往|to)\s*/i, '')}）` : '';
          lines.push(`${n++ === 0 ? '' : '轉乘：'}搭 ${name}${head}：${st.from} → ${st.to}${st.stops ? '，' + st.stops + ' 站' : ''}${(st.dep || st.arr) ? '，' + st.dep + '～' + st.arr : ''}`);
        });
      } else {
        lines.push(`Google 建議：${g.description ? '經 ' + g.description + '，' : ''}約 ${g.totalMins} 分鐘（${g.distKm} km）`);
      }
      return lines;
    }

    function printTransitHtml(spotA, spotB, transit) {
      if (!transit) return '';
      const mode = transit.mode || 'drive';
      let head;
      if (transit.isInvalid) {
        head = `<b>${MODE_LABELS[mode] || mode}</b>　<span style="color:#c0392b;">${escHtml(transit.notes || '此交通方式無法到達')}</span>`;
      } else {
        head = `<b>${MODE_LABELS[mode] || mode}</b>　約 ${formatDuration(transit.mins)}（${transit.distKm} km）`;
      }
      let lines = '';
      const g = transit.guide;
      if (!transit.isInvalid && g && g.key === routeGuideKey(spotA, spotB, mode) && (!ROUTE_TRANSIT_MODES.includes(mode) || routeFitsMode(g.steps, mode))) {
        lines = printGuideLines(g, mode).map(t => `<div style="font-size:9pt;color:#44525c;margin-top:2px;">• ${escHtml(t)}</div>`).join('');
      }
      return `<div style="margin:4px 0 4px 18px;padding:5px 10px;border-left:3px solid #7cb7d6;background:#eef5f9;font-size:10pt;page-break-inside:avoid;">🚦 ${head}${lines}</div>`;
    }

    function preparePrintContent() {
      const container = document.getElementById('print-all-container');
      if (!activeTrip || !activeTrip.days) return;
      let printHtml = `<h1 style="font-size: 20pt; font-weight: bold; margin-bottom: 15px; text-align: center;">${activeTrip.tripIcon || '⛩️'} ${escHtml(activeTrip.tripTitle)}</h1>`;

        day.spots.forEach((spot, sIdx) => {
          syncSpotHours(spot, info.dayOfWeek);
          printHtml += `<div style="padding: 8px 0; border-bottom: 1px dotted #ddd; page-break-inside: avoid;"><strong>${sIdx + 1}. ${escHtml(spot.name)}</strong> <span style="font-size: 10pt; color: #555; margin-left: 10px;">⏰ 到達: ${spot.arriveTime}　停留 ${formatDuration(parseInt(spot.stayMins) || 0)}</span><div style="font-size: 9pt; color: #777;">📍 ${escHtml(normalizeCityName(spot.city) || '城市')} ${spot.openHours ? ' | 🕒 ' + escHtml(spot.openHours) : ''}</div>${spot.note ? `<div style="font-size: 9pt; color: #555;">📝 ${escHtml(spot.note)}</div>` : ''}</div>`;

    function updateSpotNote(i, val) { activeTrip.days[activeDayIndex].spots[i].note = val; preparePrintContent(); saveGlobalCloudData(); }
    function updateManualTransitMins(i, val) {
      const mins = parseInt(val);

        activeTrip.days[activeDayIndex].transits[i].manualMins = mins;
        activeTrip.days[activeDayIndex].transits[i].mins = mins;

    function updateSpotOpenHours(i, val) { const sp = activeTrip.days[activeDayIndex].spots[i]; sp.openHours = val; sp.openHoursManual = !!val.trim(); renderSpotsList(); saveGlobalCloudData(); }

    // ============================================================
    // 🌟 Google Maps 地點搜尋（新版 Places API）
    // 需要在 Google Cloud Console 啟用「Places API (New)」並綁定帳單
    // ============================================================
    window._placeSuggestions = window._placeSuggestions || {};

    function showDropdownError(dropdown, msg) {
      dropdown.innerHTML = `
        <div class="p-2.5 text-[11px] text-rose-600 leading-relaxed">
          ⚠️ Google 地點搜尋失敗：${msg}<br>
          請按 F12 查看 Console，並確認 Google Cloud 已啟用 <b>Places API (New)</b>、已綁定帳單、API Key 沒有擋掉目前網址。
        </div>`;
      dropdown.classList.remove('hidden');
    }

    function onSpotNameInput(i, query) {
      activeTrip.days[activeDayIndex].spots[i].name = query;
      saveGlobalCloudData();
      const dropdown = document.getElementById(`autocomplete-dropdown-${i}`);
      if (!dropdown) return;
      if (!query || !query.trim()) { dropdown.classList.add('hidden'); return; }

      clearTimeout(searchDebounceTimers[i]);
      searchDebounceTimers[i] = setTimeout(async () => {
        try {
          if (!(window.google && google.maps && google.maps.importLibrary)) {
            throw new Error('Google Maps 腳本尚未載入（可能是 API Key 錯誤或被擋）');
          }
          const { AutocompleteSuggestion } = await google.maps.importLibrary('places');
          const spot = activeTrip.days[activeDayIndex].spots[i];
          const request = {
            input: query,
            language: 'zh-TW',
            locationBias: {
              center: { lat: spot.lat || 25.042, lng: spot.lng || 121.508 },
              radius: 50000
            }
          };
          const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions(request);

          if (!suggestions || !suggestions.length) { dropdown.classList.add('hidden'); return; }

          window._placeSuggestions[i] = suggestions;
          dropdown.innerHTML = suggestions.slice(0, 5).map((s, k) => {
            const p = s.placePrediction;
            const main = p.mainText ? p.mainText.text : (p.text ? p.text.text : '');
            const sub = p.secondaryText ? p.secondaryText.text : '';
            return `
              <div onclick="selectGoogleAutocompleteSDK(${k}, ${i})" class="p-2.5 hover:bg-jp-accentLight cursor-pointer transition">
                <div class="font-bold text-xs text-jp-dark">${main}</div>
                <div class="text-[10px] text-jp-dark/50">${sub}</div>
              </div>`;
          }).join('');
          dropdown.classList.remove('hidden');
        } catch (err) {
          console.error('Places 搜尋失敗：', err);
          showDropdownError(dropdown, (err && err.message) ? err.message : '未知錯誤');
        }
      }, 300);
    }

    // 統一縣市名稱寫法（臺→台、去掉「台灣」前綴與誤抓的「灣」），讓同縣市可以合併
    function normalizeCityName(c) {
      return (c || '').replace(/臺/g, '台').replace(/^台灣(?=.)/, '').replace(/^灣(?=.{2,})/, '').trim();
    }

    // 從 Google 地點資料取得縣市（台灣用縣市；其他國家用城市）
    function extractCity(place) {
      const comps = place.addressComponents || [];
      const find = (t) => comps.find(c => c.types && c.types.includes(t));
      const txt = (c) => c ? (c.longText || c.long_name || '') : '';
      const country = find('country');
      const isTW = country && (country.shortText === 'TW' || country.short_name === 'TW');
      let city = isTW
        ? (txt(find('administrative_area_level_1')) || txt(find('administrative_area_level_2')))
        : (txt(find('locality')) || txt(find('administrative_area_level_1')));
      if (!city) {
        const addr = (place.formattedAddress || '').replace(/^\d+\s*/, '').replace(/^[台臺]灣/, '');
        const m = addr.match(/^[^\d\s縣市]{2,3}[縣市]/);
        city = m ? m[0] : '';
      }
      return normalizeCityName(city) || txt(country) || '台灣';
    }

    async function selectGoogleAutocompleteSDK(k, spotIdx) {
      const dropdown = document.getElementById(`autocomplete-dropdown-${spotIdx}`);
      if (dropdown) dropdown.classList.add('hidden');
      const spot = activeTrip.days[activeDayIndex].spots[spotIdx];
      try {
        const place = window._placeSuggestions[spotIdx][k].placePrediction.toPlace();
        await place.fetchFields({ fields: ['displayName', 'formattedAddress', 'addressComponents', 'location', 'regularOpeningHours'] });

        if (place.displayName) spot.name = place.displayName;
        if (place.location) {
          spot.lat = place.location.lat();
          spot.lng = place.location.lng();
        }

        spot.city = extractCity(place);

        // 保存 Google 提供的完整營業時間（原文 + 結構化時段），顯示時再依行程當天挑出
        console.log('[Places] 營業時間原始資料：', place.displayName, place.regularOpeningHours);
        const roh = place.regularOpeningHours;
        spot.weekdayDescriptions = (roh && roh.weekdayDescriptions && roh.weekdayDescriptions.length === 7)
          ? roh.weekdayDescriptions.slice() : null;
        spot.openPeriods = (roh && roh.periods && roh.periods.length)
          ? roh.periods.map(p => ({
              open: p.open ? { day: p.open.day, hour: p.open.hour || 0, minute: p.open.minute || 0 } : null,
              close: p.close ? { day: p.close.day, hour: p.close.hour || 0, minute: p.close.minute || 0 } : null
            }))
          : null;
        spot.openHoursManual = false;
        spot.openHours = ''; // 由 renderSpotsList 依當天自動帶入 Google 原文

        recalculateTimes(activeDayIndex);
        saveGlobalCloudData();
      } catch (err) {
        console.error('取得地點詳情失敗：', err);
        alert('取得地點詳情失敗，請按 F12 查看 Console 錯誤訊息。');
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.relative')) document.querySelectorAll('[id^="autocomplete-dropdown-"]').forEach(el => el.classList.add('hidden'));
    });

    let copySpotIndex = null;
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
    }
    function openCopySpotModal(i) {
      copySpotIndex = i;
      const spot = activeTrip.days[activeDayIndex].spots[i];
      document.getElementById('copy-modal-spot').textContent = `📍 ${spot.name}`;
      let html = activeTrip.days.map((d, idx) => {
        const info = getComputedDayDate(idx);
        const cur = idx === activeDayIndex;
        return `<button onclick="copySpotToDay(${idx})" class="text-left text-xs bg-jp-bg hover:bg-jp-accentLight border border-jp-border rounded-xl px-3 py-2.5 font-bold transition">第 ${idx + 1} 天 ${info.shortDateStr ? '(' + info.shortDateStr + ' ' + info.weekdayStr + ')' : ''}${cur ? ' <span class="font-normal text-jp-dark/50">（目前這天）</span>' : ''}<span class="block font-normal text-jp-dark/50 mt-0.5">目前 ${d.spots.length} 個景點，會加在最前面</span></button>`;
      }).join('');
      html += `<button onclick="copySpotToDay(-1)" class="text-left text-xs bg-jp-accentLight hover:bg-jp-accent/20 text-jp-accent border border-dashed border-jp-accent/50 rounded-xl px-3 py-2.5 font-bold transition">＋ 新增一天，並複製到那天</button>`;
      document.getElementById('copy-modal-days').innerHTML = html;
      document.getElementById('copy-modal').classList.remove('hidden');
    }
    function closeCopyModal() { document.getElementById('copy-modal').classList.add('hidden'); copySpotIndex = null; }
    function copySpotToDay(targetIdx) {
      if (copySpotIndex === null) return;
      const src = activeTrip.days[activeDayIndex].spots[copySpotIndex];
      if (!src) { closeCopyModal(); return; }
      const clone = JSON.parse(JSON.stringify(src));
      clone.id = Date.now().toString() + Math.floor(Math.random() * 1000);
      if (targetIdx === -1) {
        activeTrip.days.push({ spots: [], transits: [] });
        targetIdx = activeTrip.days.length - 1;
      }
      const target = activeTrip.days[targetIdx];
      if (!target.transits) target.transits = [];
      if (target.spots.length) {
        clone.arriveTime = target.spots[0].arriveTime || clone.arriveTime; // 沿用當天原本的出發時間
        // 新的第 1 個景點與原本第 1 個景點之間補一段交通，原有的交通資料順延不變
        target.transits.unshift({ mode: 'drive', mins: 30, distKm: 5.0, notes: '', manualMins: null, isInvalid: false });
      }
      target.spots.unshift(clone);
      closeCopyModal();
      recalculateTimes(targetIdx);   // 補上與前一個景點之間的交通並重算時間（會重畫目前這天）
      renderAll();
      saveGlobalCloudData();
      showToast(`已複製到第 ${targetIdx + 1} 天`);
    }

    // 回到最上面按鈕：往下捲一點才出現
    window.addEventListener('scroll', () => {
      const b = document.getElementById('back-to-top');
      if (b) b.classList.toggle('show', window.scrollY > 300);
    }, { passive: true });

    let pendingFocusSpot = null;
    // 在第 i 個景點後面插入新景點（小按鈕）；最下面的大按鈕仍是加在最後
    function insertSpotAfter(i) {
      const day = activeTrip.days[activeDayIndex];
      const prev = day.spots[i];
      if (!prev) return;
      const mkTransit = (mode) => ({ mode: mode || 'drive', mins: 30, distKm: 5.0, notes: '', manualMins: null, isInvalid: false });
      const oldMode = day.transits && day.transits[i] ? day.transits[i].mode : 'drive';
      day.spots.splice(i + 1, 0, {
        id: Date.now().toString(), name: '新景點', lat: prev.lat || 25.042, lng: prev.lng || 121.508,
        arriveTime: prev.arriveTime || '12:00', stayMins: 60, city: prev.city || '', openHours: '', note: ''
      });
      if (!day.transits) day.transits = [];
      if (i < day.spots.length - 2) {
        // 插在兩個景點中間：原本那段交通拆成兩段（沿用交通方式，時間重新計算）
        day.transits[i] = mkTransit(oldMode);
        day.transits.splice(i + 1, 0, mkTransit(oldMode));
      }
      pendingFocusSpot = i + 1;
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    function addSpot() {
      activeTrip.days[activeDayIndex].spots.push({ id: Date.now().toString(), name: '新景點', lat: 25.042, lng: 121.508, arriveTime: '12:00', stayMins: 60, city: '臺北市', openHours: '', note: '' });
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    function removeSpot(i) {
      const day = activeTrip.days[activeDayIndex];
      day.spots.splice(i, 1);
      if (day.transits.length > i) day.transits.splice(i, 1);
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    function moveSpot(i, dir) {
      const target = i + dir, day = activeTrip.days[activeDayIndex];
      if (target >= 0 && target < day.spots.length) {
        const movedSpot = day.spots.splice(i, 1)[0];
        day.spots.splice(target, 0, movedSpot);
        if (day.transits && day.transits.length > 0) {
          const fromT = Math.min(i, day.spots.length - 2);
          const toT = Math.min(target, day.spots.length - 2);
          if (fromT >= 0 && toT >= 0 && fromT !== toT && day.transits[fromT]) {
            const movedTransit = day.transits.splice(fromT, 1)[0];
            day.transits.splice(toT, 0, movedTransit);
          }
        }
        recalculateTimes(activeDayIndex);
        saveGlobalCloudData();
      }
    }

    function updateSpotTime(i, val) { activeTrip.days[activeDayIndex].spots[i].arriveTime = val; recalculateTimes(activeDayIndex); saveGlobalCloudData(); }
    function updateSpotStay(i, val) { activeTrip.days[activeDayIndex].spots[i].stayMins = parseInt(val) || 0; recalculateTimes(activeDayIndex); saveGlobalCloudData(); }
    function updateTransitMode(i, mode) {
      activeTrip.days[activeDayIndex].transits[i].mode = mode;
      activeTrip.days[activeDayIndex].transits[i].manualMins = null;
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    function initOrUpdateMap() {
      const container = document.getElementById('map-day-selector');
      container.innerHTML = activeTrip.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        return `<button onclick="changeMapDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${idx === mapDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'}">第 ${idx + 1} 天 (${info.shortDateStr})</button>`;
      }).join('');

      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([25.042, 121.508], 12);
          L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
        }
        map.invalidateSize();
        renderMapRoutes();
      }, 100);
    }
    function changeMapDay(idx) { mapDayIndex = idx; initOrUpdateMap(); }
    function renderMapRoutes() {
      if (!map) return;
      mapMarkers.forEach(m => map.removeLayer(m));
      if (mapPolyline) map.removeLayer(mapPolyline);
      mapMarkers = [];
      const day = activeTrip.days[mapDayIndex];
      if (!day || !day.spots.length) return;
      const latLngs = [];
      day.spots.forEach((spot, idx) => {
        const ll = [spot.lat, spot.lng];
        latLngs.push(ll);
        const marker = L.marker(ll, { icon: L.divIcon({ className: 'jp-div-icon', html: `<div class="jp-map-marker">${idx + 1}</div>`, iconSize: [32, 32], iconAnchor: [16, 16] }) })
          .bindPopup(`<b>${idx + 1}. ${spot.name}</b>`).addTo(map);
        mapMarkers.push(marker);
      });
      if (latLngs.length > 1) {
        mapPolyline = L.polyline(latLngs, { color: '#e54d42', weight: 4, dashArray: '6, 8' }).addTo(map);
        map.fitBounds(mapPolyline.getBounds(), { padding: [50, 50] });
      } else if (latLngs.length === 1) map.setView(latLngs[0], 13);
    }

    async function renderWeatherTab() {
      const daySelector = document.getElementById('weather-day-selector');
      daySelector.innerHTML = activeTrip.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        return `<button onclick="changeWeatherDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${idx === weatherDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'}">第 ${idx + 1} 天 (${info.shortDateStr})</button>`;
      }).join('');

      const container = document.getElementById('weather-cards-container');
      container.innerHTML = `<p class="text-xs text-jp-dark/40 col-span-2 py-4">讀取天氣中...</p>`;
      const day = activeTrip.days[weatherDayIndex], dateInfo = getComputedDayDate(weatherDayIndex);
      const uniqueCities = {};
      day.spots.forEach(s => { const cn = normalizeCityName(s.city) || '台灣'; if (!uniqueCities[cn]) uniqueCities[cn] = { lat: s.lat, lng: s.lng }; });

      let html = '';
      for (const [cityName, coords] of Object.entries(uniqueCities)) {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
          const data = await res.json();
          let di = data.daily.time.indexOf(dateInfo.dateStr);
          if (di < 0) di = 0;
          html += `
            <div class="bg-jp-card p-5 rounded-2xl border border-jp-border shadow-sm flex flex-col justify-between space-y-4">
              <div>
                <span class="text-[10px] bg-jp-accentLight text-jp-accent font-bold px-2 py-0.5 rounded-md">${dateInfo.dateStr}</span>
                <h3 class="text-lg font-bold text-jp-dark mt-1">${cityName}</h3>
              </div>
              <div class="grid grid-cols-3 gap-2 bg-jp-bg p-3 rounded-xl text-center text-xs">
                <div><div class="text-[10px] text-jp-dark/40">最高溫</div><div class="text-sm font-bold text-jp-red">${data.daily.temperature_2m_max[di]}°C</div></div>
                <div><div class="text-[10px] text-jp-dark/40">最低溫</div><div class="text-sm font-bold text-blue-600">${data.daily.temperature_2m_min[di]}°C</div></div>
                <div><div class="text-[10px] text-jp-dark/40">降雨率</div><div class="text-sm font-bold text-jp-accent">${data.daily.precipitation_probability_max[di] ?? 0}%</div></div>
              </div>
            </div>
          `;
        } catch (e) { html += `<div class="bg-jp-card p-4 rounded-2xl border text-xs">無法獲取 ${cityName} 天氣。</div>`; }
      }
      container.innerHTML = html;
    }
    function changeWeatherDay(idx) { weatherDayIndex = idx; renderWeatherTab(); }

    async function onCurrencyChange() {
      const curr = document.getElementById('exp-currency').value;
      if (curr === 'TWD') { document.getElementById('exp-rate').value = "1.0"; return; }
      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${curr}`);
        const data = await res.json();
        if (data?.rates?.TWD) document.getElementById('exp-rate').value = data.rates.TWD.toFixed(4);
      } catch (e) {
        const fallbackRates = { JPY: 0.21, VND: 0.0013, USD: 32.0, EUR: 34.5, KRW: 0.024, THB: 0.92, SGD: 24.0, HKD: 4.1, GBP: 41.0, AUD: 21.0 };
        document.getElementById('exp-rate').value = fallbackRates[curr] || 1.0;
      }
    }

    function renderSplitTab() {
      document.getElementById('members-chip-container').innerHTML = (activeTrip.members || []).map(m => `
        <span class="bg-jp-accentLight text-jp-accent px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">${m} <button onclick="removeMember('${m}')" class="text-jp-accent/50">×</button></span>
      `).join('');
      document.getElementById('member-count-badge').textContent = `${(activeTrip.members || []).length} 人`;
      document.getElementById('exp-payer').innerHTML = (activeTrip.members || []).map(m => `<option value="${m}">${m}</option>`).join('');
      document.getElementById('exp-participants-checkboxes').innerHTML = (activeTrip.members || []).map(m => `
        <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="${m}" checked class="part-check rounded text-jp-accent"><span>${m}</span></label>
      `).join('');
      onCurrencyChange();
      renderExpensesList();
      calculatePairwiseSettlement();
    }

    function addMember() {
      const name = document.getElementById('new-member-name').value.trim();
      if (name && !activeTrip.members.includes(name)) {
        activeTrip.members.push(name);
        document.getElementById('new-member-name').value = '';
        renderSplitTab();
        saveGlobalCloudData();
      }
    }
    function removeMember(name) {
      activeTrip.members = activeTrip.members.filter(m => m !== name);
      renderSplitTab();
      saveGlobalCloudData();
    }

    function addExpense() {
      const title = document.getElementById('exp-title').value.trim(), payer = document.getElementById('exp-payer').value;
      const amount = parseFloat(document.getElementById('exp-amount').value), currency = document.getElementById('exp-currency').value;
      const rate = parseFloat(document.getElementById('exp-rate').value) || 1.0;
      const checkedParts = Array.from(document.querySelectorAll('.part-check:checked')).map(cb => cb.value);
      if (!title || isNaN(amount) || amount <= 0 || !checkedParts.length) { alert("請完整填寫"); return; }
      if (!activeTrip.expenses) activeTrip.expenses = [];
      activeTrip.expenses.push({ id: Date.now().toString(), title, payer, amount, currency, rate, amountTwd: Math.round(amount * rate), participants: checkedParts });
      document.getElementById('exp-title').value = ''; document.getElementById('exp-amount').value = '';
      renderSplitTab(); saveGlobalCloudData();
    }
    function removeExpense(id) {
      activeTrip.expenses = activeTrip.expenses.filter(e => e.id !== id);
      renderSplitTab(); saveGlobalCloudData();
    }
    function renderExpensesList() {
      document.getElementById('expenses-list').innerHTML = (activeTrip.expenses || []).length ? activeTrip.expenses.map(e => `
        <div class="bg-jp-bg p-2.5 rounded-xl border border-jp-border text-xs flex items-center justify-between">
          <div><div class="font-bold">${e.title}</div><div class="text-jp-dark/60">${e.payer} 付 ${e.amount} ${e.currency} (NT$ ${e.amountTwd})</div><div class="text-jp-dark/50 text-[11px]">${e.participants.length} 人分攤，每人約 NT$ ${Math.round(e.amountTwd / e.participants.length)}（${e.participants.join('、')}）</div></div>
          <button onclick="removeExpense('${e.id}')" class="text-jp-red font-bold">刪除</button>
        </div>
      `).join('') : `<p class="text-xs text-jp-dark/40 py-4 text-center">尚無記帳。</p>`;
    }
    function renderMemberSummary() {
      const members = activeTrip.members || [];
      const paid = {}, share = {};
      members.forEach(m => { paid[m] = 0; share[m] = 0; });
      let total = 0;
      (activeTrip.expenses || []).forEach(e => {
        total += e.amountTwd;
        if (paid[e.payer] !== undefined) paid[e.payer] += e.amountTwd;
        const each = e.amountTwd / (e.participants.length || 1);
        e.participants.forEach(p => { if (share[p] !== undefined) share[p] += each; });
      });
      const badge = document.getElementById('expense-total-badge');
      if (badge) badge.textContent = `總支出 NT$ ${Math.round(total).toLocaleString()}`;
      const box = document.getElementById('member-summary');
      if (!box) return;
      if (!members.length) { box.innerHTML = `<p class="text-xs text-jp-dark/40 py-2">尚無成員。</p>`; return; }
      box.innerHTML = members.map(m => {
        const net = Math.round(paid[m] - share[m]);
        const netHtml = net > 0 ? `<span class="text-emerald-600">應收回 NT$ ${net.toLocaleString()}</span>`
          : net < 0 ? `<span class="text-jp-red">應補 NT$ ${Math.abs(net).toLocaleString()}</span>`
          : `<span class="text-jp-dark/50">已結清</span>`;
        return `<div class="bg-jp-bg border border-jp-border rounded-xl p-3 text-xs space-y-1.5">
          <div class="font-bold text-jp-dark text-sm">${m}</div>
          <div class="flex justify-between"><span class="text-jp-dark/60">應分攤</span><span class="font-extrabold text-jp-accent">NT$ ${Math.round(share[m]).toLocaleString()}</span></div>
          <div class="flex justify-between"><span class="text-jp-dark/60">已先付</span><span class="font-bold">NT$ ${Math.round(paid[m]).toLocaleString()}</span></div>
          <div class="flex justify-between border-t border-jp-border pt-1.5 font-bold"><span class="text-jp-dark/60">差額</span>${netHtml}</div>
        </div>`;
      }).join('');
    }

    function calculatePairwiseSettlement() {
      renderMemberSummary();
      const matrix = {};
      (activeTrip.members || []).forEach(m1 => { matrix[m1] = {}; (activeTrip.members || []).forEach(m2 => matrix[m1][m2] = 0); });
      (activeTrip.expenses || []).forEach(exp => {
        const share = exp.amountTwd / exp.participants.length;
        exp.participants.forEach(p => { if (p !== exp.payer) matrix[p][exp.payer] += share; });
      });
      let html = '';
      (activeTrip.members || []).forEach((m1, i) => {
        (activeTrip.members || []).forEach((m2, j) => {
          if (i < j) {
            const net = matrix[m1][m2] - matrix[m2][m1];
            if (Math.abs(net) > 1) {
              html += `<div class="bg-jp-accentLight border p-3 rounded-xl text-xs flex justify-between items-center"><div><b>${net > 0 ? m1 : m2}</b> 轉帳給 <b>${net > 0 ? m2 : m1}</b></div><span class="font-extrabold text-jp-accent">NT$ ${Math.round(Math.abs(net))}</span></div>`;
            }
          }
        });
      });
      document.getElementById('settlement-results').innerHTML = html || `<p class="text-xs text-jp-dark/40 py-4 text-center">結算為 0。</p>`;
    }

    function exportPDF() { preparePrintContent(); window.print(); }
  </script>
