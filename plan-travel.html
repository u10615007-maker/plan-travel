<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅行小助手</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  
  <!-- Leaflet.js CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jp: {
              bg: '#fbf9f5',
              card: '#ffffff',
              border: '#efebe4',
              accent: '#6e8b74',
              accentLight: '#f0f4f1',
              red: '#e54d42',
              sand: '#d8cfc4',
              dark: '#2c3531'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #fbf9f5; color: #2c3531; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #fbf9f5; }
    ::-webkit-scrollbar-thumb { background: #d8cfc4; border-radius: 4px; }
    #map { height: calc(100vh - 200px); min-height: 420px; width: 100%; border-radius: 12px; }

    .jp-map-marker {
      background-color: #e54d42;
      color: white;
      border: 3px solid #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(229, 77, 66, 0.4), 0 2px 4px rgba(0,0,0,0.3);
      position: relative;
    }

    .drag-handle {
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .dragging {
      opacity: 0.5;
      border: 2px dashed #6e8b74 !important;
      transform: scale(0.98);
      transition: transform 0.1s ease;
    }

    @media print {
      header, button, nav, input[type="file"], .no-print { display: none !important; }
      body { background-color: white !important; font-size: 11pt; }
      .tab-content { display: block !important; opacity: 1 !important; visibility: visible !important; }
      #tab-map, #tab-weather, #tab-split, #tab-shortener { page-break-before: always; }
      .print-all-days { display: block !important; }
      .interactive-only { display: none !important; }
      .bg-jp-card { border: 1px solid #ddd !important; box-shadow: none !important; margin-bottom: 15px; }
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-jp-card border-b border-jp-border sticky top-0 z-50 shadow-sm no-print">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-2">
        <button onclick="openIconModal()" class="text-2xl p-1 hover:bg-jp-bg rounded-lg border border-transparent hover:border-jp-border transition" title="點擊更換圖示">
          <span id="trip-icon-display">⛩️</span>
        </button>
        <input type="text" id="trip-title-input" value="台灣環島與自由行輕旅行" onchange="updateTripTitle(this.value)" class="text-lg font-bold text-jp-dark bg-transparent border-b border-transparent hover:border-jp-sand focus:border-jp-accent focus:outline-none px-1 py-0.5 transition">
      </div>
      
      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="openCloudModal()" id="cloud-sync-btn" class="text-xs bg-jp-accent hover:bg-jp-accent/90 text-white font-bold px-3 py-1.5 rounded-lg border border-jp-accent shadow-sm flex items-center gap-1 transition">
          <i data-lucide="cloud" class="w-3.5 h-3.5"></i> ☁️ 雲端同步設定
        </button>
        <button onclick="exportPDF()" class="text-xs bg-jp-bg hover:bg-jp-border text-jp-dark font-bold px-2.5 py-1.5 rounded-lg border border-jp-border flex items-center gap-1 transition">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 匯出 PDF
        </button>

        <nav class="flex flex-wrap bg-jp-bg p-1 rounded-xl border border-jp-border text-xs font-medium ml-1 gap-1">
          <button id="tab-itinerary-btn" onclick="switchTab('itinerary')" class="px-3 py-1.5 rounded-lg transition-all bg-jp-accent text-white shadow-sm font-bold">
            📅 行程規劃
          </button>
          <button id="tab-map-btn" onclick="switchTab('map')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">
            🗺️ 路線地圖
          </button>
          <button id="tab-weather-btn" onclick="switchTab('weather')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">
            🌤️ 城市天氣
          </button>
          <button id="tab-split-btn" onclick="switchTab('split')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">
            💴 1對1分帳
          </button>
          <button id="tab-shortener-btn" onclick="switchTab('shortener')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">
            🔗 縮短網址
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- 1. ITINERARY TAB -->
    <section id="tab-itinerary" class="tab-content space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3 bg-jp-card p-3.5 rounded-2xl border border-jp-border shadow-sm no-print">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 max-w-full interactive-only" id="day-selector-container"></div>
        <button onclick="addDay()" class="flex items-center gap-1 text-xs bg-jp-accentLight text-jp-accent hover:bg-jp-accent/20 px-3 py-1.5 rounded-xl font-bold transition interactive-only">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增天數
        </button>
      </div>

      <!-- Active Day Banner (Interactive) -->
      <div class="bg-jp-card border border-jp-border p-4 rounded-2xl flex flex-wrap justify-between items-center gap-3 shadow-sm interactive-only">
        <div>
          <h2 class="text-base font-bold text-jp-dark flex items-center gap-2">
            <span id="current-day-title">第 1 天</span>
            <input type="date" id="start-date-picker" class="text-xs bg-jp-bg border border-jp-border rounded-lg px-2.5 py-1 text-jp-dark focus:outline-none" onchange="updateStartDate(this.value)">
            <span id="current-day-weekday" class="text-xs font-normal bg-jp-accentLight text-jp-accent px-2 py-0.5 rounded-md"></span>
          </h2>
          <p class="text-[10px] text-jp-dark/40 mt-1">提示：可拖曳上方天數標籤排序，資料會自動同步至雲端。</p>
        </div>
        <button onclick="addSpot()" class="bg-jp-accent hover:bg-jp-accent/90 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 新增景點
        </button>
      </div>

      <!-- Spots List (Interactive mode) -->
      <div id="spots-list" class="space-y-4 interactive-only"></div>

      <!-- PDF Print All Days Container -->
      <div id="print-all-container" class="hidden print-all-days space-y-6"></div>
    </section>

    <!-- 2. ROUTE MAP TAB -->
    <section id="tab-map" class="tab-content hidden space-y-4">
      <div class="bg-jp-card p-3.5 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm no-print">
        <div>
          <h2 class="text-sm font-bold text-jp-dark">🗺️ 每日路線視圖</h2>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto" id="map-day-selector"></div>
      </div>

      <div class="bg-jp-card p-2 rounded-2xl border border-jp-border shadow-sm overflow-hidden">
        <div id="map"></div>
      </div>
    </section>

    <!-- 3. CITY WEATHER TAB -->
    <section id="tab-weather" class="tab-content hidden space-y-5">
      <div class="bg-jp-card p-4 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm no-print">
        <div>
          <h2 class="text-sm font-bold text-jp-dark">🌤️ 全球官方測站天氣預報</h2>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto" id="weather-day-selector"></div>
      </div>

      <div id="weather-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- 4. 1-ON-1 SPLIT EXPENSE TAB -->
    <section id="tab-split" class="tab-content hidden space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-1 space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs flex items-center justify-between">
            <span>👥 出遊成員</span>
            <span class="text-xs font-normal text-jp-dark/50" id="member-count-badge">0 人</span>
          </h3>
          <div class="flex gap-2 no-print">
            <input type="text" id="new-member-name" placeholder="姓名..." class="flex-1 text-xs border border-jp-border rounded-xl px-3 py-2 bg-jp-bg focus:outline-none">
            <button onclick="addMember()" class="bg-jp-accent text-white px-3 py-2 rounded-xl text-xs hover:bg-jp-accent/90 transition font-bold">新增</button>
          </div>
          <div id="members-chip-container" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-2 space-y-3 shadow-sm no-print">
          <h3 class="font-bold text-jp-dark text-xs">➕ 新增記帳</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-jp-dark/70 mb-1">消費項目</label>
              <input type="text" id="exp-title" placeholder="例如：火車車票" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">先付代墊人</label>
              <select id="exp-payer" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg"></select>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">金額與幣種</label>
              <div class="flex gap-1">
                <input type="number" id="exp-amount" placeholder="0" class="w-1/2 border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
                <select id="exp-currency" onchange="updateExchangeRateField()" class="w-1/2 border border-jp-border rounded-xl px-1 py-2 bg-jp-bg text-xs">
                  <option value="TWD">TWD (新台幣)</option>
                  <option value="JPY">JPY (日圓)</option>
                  <option value="VND">VND (越南盾)</option>
                  <option value="USD">USD (美元)</option>
                  <option value="EUR">EUR (歐元)</option>
                  <option value="KRW">KRW (韓元)</option>
                  <option value="GBP">GBP (英鎊)</option>
                  <option value="THB">THB (泰銖)</option>
                  <option value="SGD">SGD (新加坡幣)</option>
                  <option value="HKD">HKD (港幣)</option>
                  <option value="AUD">AUD (澳幣)</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">換算匯率 (1 外幣 = ? TWD)</label>
              <div class="flex gap-1">
                <input type="number" step="0.0001" id="exp-rate" value="1.0" class="flex-1 border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
                <button onclick="fetchLiveRate()" class="text-xs bg-jp-accentLight text-jp-accent px-2.5 rounded-xl font-bold">⚡ 最新</button>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs text-jp-dark/70 mb-1">分攤成員</label>
            <div id="exp-participants-checkboxes" class="flex flex-wrap gap-3 pt-1 text-xs"></div>
          </div>

          <button onclick="addExpense()" class="w-full bg-jp-accent hover:bg-jp-accent/90 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">
            儲存該筆消費
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs">📜 明細記錄</h3>
          <div id="expenses-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
        </div>

        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-jp-dark text-xs">🤝 1 對 1 精準對拆結算結果</h3>
            <span class="text-[10px] bg-jp-accentLight text-jp-accent px-2 py-0.5 rounded-md font-bold">直觀 1 對 1 轉帳</span>
          </div>
          <div id="settlement-results" class="space-y-2 pt-1"></div>
        </div>
      </div>
    </section>

    <!-- 5. URL SHORTENER TAB -->
    <section id="tab-shortener" class="tab-content hidden space-y-4">
      <div class="bg-jp-card p-4 rounded-2xl border border-jp-border shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-jp-dark">🔗 Reurl 縮短網址工具</h2>
          <a href="https://reurl.cc/main/tw" target="_blank" class="text-xs text-jp-accent hover:underline font-bold flex items-center gap-1">
            在新視窗開啟官網 ↗
          </a>
        </div>
        <p class="text-xs text-jp-dark/60">您可以直接使用下方嵌入的 Reurl 縮短網址工具：</p>
        <div class="w-full h-[600px] border border-jp-border rounded-xl overflow-hidden bg-white">
          <iframe src="https://reurl.cc/main/tw" class="w-full h-full border-0" title="Reurl 縮短網址"></iframe>
        </div>
      </div>
    </section>

  </main>

  <!-- ICON PICKER MODAL -->
  <div id="icon-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-jp-card border border-jp-border rounded-2xl p-5 max-w-xs w-full shadow-xl space-y-4 text-center">
      <h3 class="font-bold text-jp-dark text-sm">選擇行程封面圖示</h3>
      <div class="grid grid-cols-4 gap-3 text-2xl" id="icon-options-grid"></div>
      <button onclick="closeIconModal()" class="w-full bg-jp-bg hover:bg-jp-border text-jp-dark text-xs font-bold py-2 rounded-xl border border-jp-border">取消</button>
    </div>
  </div>

  <!-- CLOUD SYNC MODAL -->
  <div id="cloud-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-jp-card border border-jp-border rounded-2xl p-5 max-w-md w-full shadow-xl space-y-4">
      <h3 class="font-bold text-jp-dark text-sm flex items-center gap-2"><span>☁️</span> 設定 npoint.io 雲端同步 API</h3>
      <p class="text-xs text-jp-dark/60 leading-relaxed">
        https://api.npoint.io/ddb2ca27ff3e50143642
      </p>
      <div>
        <label class="block text-xs text-jp-dark/70 mb-1">npoint.io API Endpoint URL</label>
        <input type="text" id="cloud-api-input" placeholder="https://api.npoint.io/xxxxxxxxxxxx" class="w-full border border-jp-border rounded-xl px-3 py-2 text-xs bg-jp-bg focus:outline-none focus:border-jp-accent">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="saveCloudConfig()" class="flex-1 bg-jp-accent text-white py-2 rounded-xl text-xs font-bold hover:bg-jp-accent/90 transition">儲存並立即同步</button>
        <button onclick="closeCloudModal()" class="px-4 bg-jp-bg hover:bg-jp-border text-jp-dark text-xs font-bold rounded-xl border border-jp-border">取消</button>
      </div>
    </div>
  </div>

  <script>
    if (typeof lucide === 'undefined') { window.lucide = { createIcons() {} }; }

    let appData = {
      tripTitle: '台灣環島與自由行輕旅行',
      tripIcon: '⛩️',
      activeTab: 'itinerary',
      activeDayIndex: 0,
      mapDayIndex: 0,
      weatherDayIndex: 0,
      days: [
        {
          spots: [
            { id: '1', name: '烏日車站', lat: 24.108, lng: 120.624, arriveTime: '09:00', stayMins: 60, city: '臺中市, 臺灣' },
            { id: '2', name: '西門町商圈', lat: 25.042, lng: 121.508, arriveTime: '11:15', stayMins: 120, city: '臺北市, 臺灣' }
          ],
          transits: [
            { mode: 'mrt', mins: 75, distKm: 160.0, notes: '從【烏日車站】前往【西門町商圈】', manualMins: null }
          ]
        }
      ],
      startDate: '2026-11-01',
      members: ['小明', '小華', '阿強'],
      expenses: [
        { id: 'e1', title: '高鐵車票', payer: '小明', amount: 700, currency: 'TWD', rate: 1.0, amountTwd: 700, participants: ['小明', '小華', '阿強'] }
      ]
    };

    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const ICONS = ['⛩️', '✈️', '🗼', '🌸', '🗻', '🍵', '🚄', '🍣', '🍱', '🧋', '🏮', '🏖️', '🗽', '🏰', '🎡'];
    const CURRENCY_LABELS = {
      TWD: 'TWD (新台幣)', JPY: 'JPY (日圓)', VND: 'VND (越南盾)', USD: 'USD (美元)',
      EUR: 'EUR (歐元)', KRW: 'KRW (韓元)', GBP: 'GBP (英鎊)', THB: 'THB (泰銖)',
      SGD: 'SGD (新加坡幣)', HKD: 'HKD (港幣)', AUD: 'AUD (澳幣)'
    };

    let map = null;
    let mapMarkers = [];
    let mapPolyline = null;
    let searchDebounceTimers = {};
    let draggedIndex = null;
    let draggedDayIndex = null;
    let cloudApiUrl = localStorage.getItem('npoint_api_url') || '';

    window.addEventListener('DOMContentLoaded', async () => {
      // 網址若帶有 ?api=... 參數可自動載入
      const urlParams = new URLSearchParams(window.location.search);
      const apiParam = urlParams.get('api');
      if (apiParam) {
        cloudApiUrl = apiParam;
        localStorage.setItem('npoint_api_url', apiParam);
      }

      // 嘗試從雲端載入資料
      if (cloudApiUrl) {
        try {
          const res = await fetch(cloudApiUrl);
          if (res.ok) {
            const remoteData = await res.json();
            if (remoteData && remoteData.days) {
              appData = remoteData;
              localStorage.setItem('global_travel_app_v34', JSON.stringify(appData));
            }
          }
        } catch (e) {
          console.error("雲端載入失敗，改用本機快取", e);
          loadLocalData();
        }
      } else {
        loadLocalData();
      }

      recalculateTimes(appData.activeDayIndex);
      renderAll();
      lucide.createIcons();
    });

    function loadLocalData() {
      const saved = localStorage.getItem('global_travel_app_v34');
      if (saved) {
        try { appData = JSON.parse(saved); } catch (e) { console.error(e); }
      }
    }

    async function saveData() {
      localStorage.setItem('global_travel_app_v34', JSON.stringify(appData));

      // 若有設定雲端 API，自動同步上傳至 npoint.io
      if (cloudApiUrl) {
        try {
          await fetch(cloudApiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(appData)
          });
        } catch (e) {
          console.error("雲端同步失敗", e);
        }
      }
    }

    function openCloudModal() {
      document.getElementById('cloud-api-input').value = cloudApiUrl;
      document.getElementById('cloud-modal').classList.remove('hidden');
    }
    function closeCloudModal() { document.getElementById('cloud-modal').classList.add('hidden'); }

    async function saveCloudConfig() {
      const val = document.getElementById('cloud-api-input').value.trim();
      cloudApiUrl = val;
      localStorage.setItem('npoint_api_url', val);
      closeCloudModal();
      
      // 立即上傳現有資料
      await saveData();
      
      const pageUrl = `${window.location.origin}${window.location.pathname}?api=${encodeURIComponent(cloudApiUrl)}`;
      await navigator.clipboard.writeText(pageUrl);
      alert(`雲端同步設定成功！\n\n您的專屬共用連結已複製到剪貼簿：\n${pageUrl}\n\n之後您在任何地方修改行程，其他人打開此連結都會同步更新！`);
    }

    function exportPDF() {
      preparePrintAllDays();
      window.print();
    }

    function preparePrintAllDays() {
      const container = document.getElementById('print-all-container');
      let html = `<div class="text-center mb-6 border-b pb-4"><h1 class="text-2xl font-bold">${appData.tripIcon} ${appData.tripTitle}</h1><p class="text-xs text-gray-500 mt-1">出發日期：${appData.startDate || '未設定'}</p></div>`;

      appData.days.forEach((day, idx) => {
        const info = getComputedDayDate(idx);
        html += `
          <div class="mb-6 p-4 border rounded-xl bg-white">
            <h3 class="font-bold text-base mb-3 text-jp-accent border-b pb-1">第 ${idx + 1} 天 (${info.dateStr} ${info.weekdayStr})</h3>
        `;
        if (!day.spots || day.spots.length === 0) {

      return {
        dateStr: `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${String(start.getDate()).padStart(2, '0')}`,
        shortDateStr: `${String(start.getMonth() + 1).padStart(2, '0')}/${String(start.getDate()).padStart(2, '0')}`,

    function formatDuration(mins) {
      if (!mins || mins <= 0) return '0 分鐘';
      const hours = Math.floor(mins / 60);
      const remainingMins = mins % 60;
      if (hours === 0) return `${remainingMins} 分鐘`;
      if (remainingMins === 0) return `${hours} 小時`;
      return `${hours} 小時 ${remainingMins} 分鐘`;
    }

    function generateSmartTransitNote(spotA, spotB, mode, distKm) {
      const nameA = spotA.name || '出發地';

      if (mode === 'mrt') return `從【${nameA}】搭乘捷運/地鐵前往【${nameB}】`;
      if (mode === 'bus') return `從【${nameA}】搭乘公車前往【${nameB}】`;
      if (mode === 'thsr') return `從【${nameA}】前往高鐵站搭乘高鐵至【${nameB}】`;
      if (mode === 'train') return `從【${nameA}】搭乘火車前往【${nameB}】`;
      if (mode === 'coach') return `從【${nameA}】搭乘客運前往【${nameB}】`;
      if (mode === 'scooter') return `從【${nameA}】騎乘機車前往【${nameB}】（約 ${distKm} km）`;
      if (mode === 'drive') return `從【${nameA}】開車直達【${nameB}】`;
      if (mode === 'walk') return `從【${nameA}】步行至【${nameB}】（約 ${distKm} km）`;
      if (mode === 'bike') return `從【${nameA}】騎單車至【${nameB}】`;

    async function recalculateTimes(dayIdx) {
      const day = appData.days[dayIdx];
      if (!day || !day.spots.length) return;
      if (!day.transits) day.transits = [];

      for (let i = 0; i < day.spots.length - 1; i++) {
        const spotA = day.spots[i];
        const spotB = day.spots[i + 1];
        if (!day.transits[i]) day.transits[i] = { mode: 'mrt', mins: 30, distKm: 5.0, notes: '', manualMins: null };

        const transit = day.transits[i];
        const mode = transit.mode || 'mrt';

        if (transit.manualMins === null || transit.manualMins === undefined) {
          try {
            let osrmProfile = 'car';
            if (mode === 'walk') osrmProfile = 'foot';
            else if (mode === 'bike') osrmProfile = 'bike';
            const url = `https://routing.openstreetmap.de/routed-${osrmProfile}/route/v1/driving/${spotA.lng},${spotA.lat};${spotB.lng},${spotB.lat}?overview=false`;
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.routes && data.routes.length > 0) {
              const route = data.routes[0];
              transit.distKm = parseFloat((route.distance / 1000).toFixed(1));
              let calculatedMins = Math.round(route.duration / 60);
              if (mode === 'scooter') calculatedMins = Math.round(calculatedMins * 0.9);
              else if (mode === 'thsr') calculatedMins = Math.round(35 + (transit.distKm / 170) * 60);
              else if (mode === 'train') calculatedMins = Math.round(20 + (transit.distKm / 60) * 60);
              transit.mins = Math.max(calculatedMins, 1);
            } else {
              throw new Error();
            }
          } catch (err) {
            const straightDist = calcDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
            transit.distKm = parseFloat(straightDist.toFixed(1));
            transit.mins = estimateTransitTimeFallback(transit.distKm, mode);
          }
        }

        if (!transit.notes) transit.notes = generateSmartTransitNote(spotA, spotB, mode, transit.distKm);

        const [h, m] = (spotA.arriveTime || '09:00').split(':').map(Number);
        const totalNextArriveMins = (h * 60 + m) + parseInt(spotA.stayMins || 0) + transit.mins;
        spotB.arriveTime = `${String(Math.floor(totalNextArriveMins / 60) % 24).padStart(2, '0')}:${String(totalNextArriveMins % 60).padStart(2, '0')}`;
      }
      renderSpotsList();
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 5.0;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function estimateTransitTimeFallback(distKm, mode) {
      let speed = mode === 'walk' ? 4.5 : (mode === 'scooter' ? 35 : (mode === 'drive' ? 40 : 28));
      return Math.max(Math.round((distKm / speed) * 60) + 5, 5);
    }

      const day = appData.days[appData.activeDayIndex];
      const moved = day.spots.splice(fromIndex, 1)[0];

    // --- MAP ---
    function initOrUpdateMap() {
      const container = document.getElementById('map-day-selector');
      container.innerHTML = appData.days.map((day, idx) => `
        <button onclick="changeMapDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${idx === appData.mapDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'}">第 ${idx + 1} 天</button>
      `).join('');

      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([25.042, 121.508], 12);
          L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
        }
        map.invalidateSize();
        renderMapRoutes();
      }, 100);
    }
    function changeMapDay(idx) { appData.mapDayIndex = idx; initOrUpdateMap(); }
    function renderMapRoutes() {
      if (!map) return;
      mapMarkers.forEach(m => map.removeLayer(m));
      if (mapPolyline) map.removeLayer(mapPolyline);
      mapMarkers = [];
      const day = appData.days[appData.mapDayIndex];
      if (!day || !day.spots.length) return;
      const latLngs = [];
      day.spots.forEach((spot, idx) => {
        const ll = [spot.lat, spot.lng];
        latLngs.push(ll);
        const marker = L.marker(ll, { icon: L.divIcon({ className: 'jp-div-icon', html: `<div class="jp-map-marker">${idx + 1}</div>`, iconSize: [32, 32], iconAnchor: [16, 16] }) })
          .bindPopup(`<b>${idx + 1}. ${spot.name}</b>`).addTo(map);
        mapMarkers.push(marker);
      });
      if (latLngs.length > 1) {
        mapPolyline = L.polyline(latLngs, { color: '#e54d42', weight: 4, dashArray: '6, 8' }).addTo(map);
        map.fitBounds(mapPolyline.getBounds(), { padding: [50, 50] });
      } else if (latLngs.length === 1) map.setView(latLngs[0], 13);
    }

    // --- WEATHER ---
    async function renderWeatherTab() {
      const daySelector = document.getElementById('weather-day-selector');
      daySelector.innerHTML = appData.days.map((day, idx) => `
        <button onclick="changeWeatherDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${idx === appData.weatherDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'}">第 ${idx + 1} 天</button>
      `).join('');

      const container = document.getElementById('weather-cards-container');
      container.innerHTML = `<p class="text-xs text-jp-dark/40 col-span-2 py-4">讀取天氣中...</p>`;
      const day = appData.days[appData.weatherDayIndex], dateInfo = getComputedDayDate(appData.weatherDayIndex);
      const uniqueCities = {};
      day.spots.forEach(s => { if (!uniqueCities[s.city || '台灣']) uniqueCities[s.city || '台灣'] = { lat: s.lat, lng: s.lng }; });

      let html = '';
      for (const [cityName, coords] of Object.entries(uniqueCities)) {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
          const data = await res.json();
          let di = data.daily.time.indexOf(dateInfo.dateStr);
          if (di < 0) di = 0;
          html += `
            <div class="bg-jp-card p-5 rounded-2xl border border-jp-border shadow-sm flex flex-col justify-between space-y-4">
              <div>
                <span class="text-[10px] bg-jp-accentLight text-jp-accent font-bold px-2 py-0.5 rounded-md">${dateInfo.dateStr}</span>
                <h3 class="text-lg font-bold text-jp-dark mt-1">${cityName}</h3>
              </div>
              <div class="grid grid-cols-3 gap-2 bg-jp-bg p-3 rounded-xl text-center text-xs">
                <div><div class="text-[10px] text-jp-dark/40">最高溫</div><div class="text-sm font-bold text-jp-red">${data.daily.temperature_2m_max[di]}°C</div></div>
                <div><div class="text-[10px] text-jp-dark/40">最低溫</div><div class="text-sm font-bold text-blue-600">${data.daily.temperature_2m_min[di]}°C</div></div>
                <div><div class="text-[10px] text-jp-dark/40">降雨率</div><div class="text-sm font-bold text-jp-accent">${data.daily.precipitation_probability_max[di] ?? 0}%</div></div>
              </div>
            </div>
          `;
        } catch (e) { html += `<div class="bg-jp-card p-4 rounded-2xl border text-xs">無法獲取 ${cityName} 天氣。</div>`; }
      }
      container.innerHTML = html;
    }
    function changeWeatherDay(idx) { appData.weatherDayIndex = idx; renderWeatherTab(); }

    // --- SPLIT ---
    function renderSplitTab() {
      document.getElementById('members-chip-container').innerHTML = appData.members.map(m => `
        <span class="bg-jp-accentLight text-jp-accent px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">${m} <button onclick="removeMember('${m}')" class="text-jp-accent/50">×</button></span>
      `).join('');
      document.getElementById('member-count-badge').textContent = `${appData.members.length} 人`;
      document.getElementById('exp-payer').innerHTML = appData.members.map(m => `<option value="${m}">${m}</option>`).join('');
      document.getElementById('exp-participants-checkboxes').innerHTML = appData.members.map(m => `
        <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="${m}" checked class="part-check rounded text-jp-accent"><span>${m}</span></label>
      `).join('');
      renderExpensesList();
      calculatePairwiseSettlement();
    }
    function addMember() {
      const name = document.getElementById('new-member-name').value.trim();
      if (name && !appData.members.includes(name)) { appData.members.push(name); document.getElementById('new-member-name').value = ''; renderSplitTab(); saveData(); }
    }
    function removeMember(name) { appData.members = appData.members.filter(m => m !== name); renderSplitTab(); saveData(); }
    function updateExchangeRateField() {
      const rates = { TWD: 1.0, JPY: 0.21, VND: 0.0013, USD: 32.0, EUR: 34.5 };
      document.getElementById('exp-rate').value = rates[document.getElementById('exp-currency').value] || 1.0;
    }
    async function fetchLiveRate() {
      const curr = document.getElementById('exp-currency').value;
      if (curr === 'TWD') return;
      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${curr}`);
        const data = await res.json();
        if (data?.rates?.TWD) document.getElementById('exp-rate').value = data.rates.TWD.toFixed(4);
      } catch (e) {}
    }
    function addExpense() {
      const title = document.getElementById('exp-title').value.trim(), payer = document.getElementById('exp-payer').value;
      const amount = parseFloat(document.getElementById('exp-amount').value), currency = document.getElementById('exp-currency').value;
      const rate = parseFloat(document.getElementById('exp-rate').value) || 1.0;
      const checkedParts = Array.from(document.querySelectorAll('.part-check:checked')).map(cb => cb.value);
      if (!title || isNaN(amount) || amount <= 0 || !checkedParts.length) { alert("請完整填寫"); return; }
      appData.expenses.push({ id: Date.now().toString(), title, payer, amount, currency, rate, amountTwd: Math.round(amount * rate), participants: checkedParts });
      document.getElementById('exp-title').value = ''; document.getElementById('exp-amount').value = '';
      renderSplitTab(); saveData();
    }
    function removeExpense(id) { appData.expenses = appData.expenses.filter(e => e.id !== id); renderSplitTab(); saveData(); }
    function renderExpensesList() {
      document.getElementById('expenses-list').innerHTML = appData.expenses.length ? appData.expenses.map(e => `
        <div class="bg-jp-bg p-2.5 rounded-xl border border-jp-border text-xs flex items-center justify-between">
          <div><div class="font-bold">${e.title}</div><div class="text-jp-dark/60">${e.payer} 付 ${e.amount} ${e.currency} (NT$ ${e.amountTwd})</div></div>
          <button onclick="removeExpense('${e.id}')" class="text-jp-red"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
        </div>
      `).join('') : `<p class="text-xs text-jp-dark/40 py-4 text-center">尚無記帳。</p>`;
      lucide.createIcons();
    }
    function calculatePairwiseSettlement() {
      const matrix = {};
      appData.members.forEach(m1 => { matrix[m1] = {}; appData.members.forEach(m2 => matrix[m1][m2] = 0); });
      appData.expenses.forEach(exp => {
        const share = exp.amountTwd / exp.participants.length;
        exp.participants.forEach(p => { if (p !== exp.payer) matrix[p][exp.payer] += share; });
      });
      let html = '';
      appData.members.forEach((m1, i) => {
        appData.members.forEach((m2, j) => {
          if (i < j) {
            const net = matrix[m1][m2] - matrix[m2][m1];
            if (Math.abs(net) > 1) {
              html += `<div class="bg-jp-accentLight border p-3 rounded-xl text-xs flex justify-between items-center"><div><b>${net > 0 ? m1 : m2}</b> 轉帳給 <b>${net > 0 ? m2 : m1}</b></div><span class="font-extrabold text-jp-accent">NT$ ${Math.round(Math.abs(net))}</span></div>`;
            }
          }
        });
      });
      document.getElementById('settlement-results').innerHTML = html || `<p class="text-xs text-jp-dark/40 py-4 text-center">結算為 0。</p>`;
    }
  </script>
</body>
</html>
