<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅行小助手</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  
  <!-- Leaflet.js CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jp: {
              bg: '#fbf9f5',
              card: '#ffffff',
              border: '#efebe4',
              accent: '#6e8b74',
              accentLight: '#f0f4f1',
              red: '#e54d42',
              sand: '#d8cfc4',
              dark: '#2c3531'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #fbf9f5; color: #2c3531; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #fbf9f5; }
    ::-webkit-scrollbar-thumb { background: #d8cfc4; border-radius: 4px; }
    #map { height: calc(100vh - 200px); min-height: 420px; width: 100%; border-radius: 12px; }

    .jp-map-marker {
      background-color: #e54d42;
      color: white;
      border: 3px solid #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(229, 77, 66, 0.4), 0 2px 4px rgba(0,0,0,0.3);
      position: relative;
    }

    .drag-handle { touch-action: none; user-select: none; -webkit-user-select: none; }
    .dragging { opacity: 0.5; border: 2px dashed #6e8b74 !important; transform: scale(0.98); transition: transform 0.1s ease; }

    /* 列印專用樣式 */
    @media print {
      header, nav, .interactive-only, button, input, select { display: none !important; }
      body { background-color: white !important; color: #000 !important; font-size: 12pt; }
      .tab-content { display: block !important; }
      #tab-map, #tab-weather, #tab-split, #tab-shortener { display: none !important; }
      #print-all-container { display: block !important; }
      .print-day-page { page-break-after: always; margin-bottom: 20px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

  <script>
    // =========================================================
    // 🌟 【唯一的雲端 API 網址】
    // 請將下方引號內的網址替換為您在 npoint.io 建立的 API 網址！
    // =========================================================
    let SINGLE_CLOUD_API_URL = "https://api.npoint.io/您的專屬亂碼";
  </script>

  <!-- Header -->
  <header class="bg-jp-card border-b border-jp-border sticky top-0 z-50 shadow-sm no-print">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      
      <!-- 旅程管理與切換區 -->
      <div class="flex items-center space-x-2 flex-wrap">
        <button onclick="openIconModal()" class="text-2xl p-1 hover:bg-jp-bg rounded-lg transition" title="點擊更換圖示">
          <span id="trip-icon-display">⛩️</span>
        </button>
        
        <select id="trip-selector" onchange="changeActiveTrip(this.value)" class="text-xs font-bold bg-jp-accentLight text-jp-accent border border-jp-border rounded-xl px-2.5 py-1.5 focus:outline-none">
        </select>

        <button onclick="createNewTripPrompt()" class="text-xs bg-jp-bg hover:bg-jp-border text-jp-dark font-bold px-2.5 py-1.5 rounded-xl border border-jp-border shadow-sm flex items-center gap-1 transition" title="新增一個全新的旅程">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增旅程
        </button>

        <button onclick="deleteCurrentTrip()" class="text-xs bg-rose-50 hover:bg-rose-100 text-jp-red font-bold px-2 py-1.5 rounded-xl border border-rose-200 transition" title="刪除當前旅程">
          🗑️
        </button>
      </div>
      
      <!-- 功能頁籤與分享按鈕 -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="copyShareUrl()" class="text-xs bg-jp-accent text-white font-bold px-3 py-1.5 rounded-lg shadow-sm flex items-center gap-1 hover:bg-jp-accent/90 transition">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i> 📋 複製共用連結
        </button>
        <button onclick="exportPDF()" class="text-xs bg-jp-bg hover:bg-jp-border text-jp-dark font-bold px-2.5 py-1.5 rounded-lg border border-jp-border flex items-center gap-1 transition">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 匯出 PDF
        </button>

        <nav class="flex flex-wrap bg-jp-bg p-1 rounded-xl border border-jp-border text-xs font-medium ml-1 gap-1">
          <button id="tab-itinerary-btn" onclick="switchTab('itinerary')" class="px-3 py-1.5 rounded-lg transition-all bg-jp-accent text-white shadow-sm font-bold">📅 行程規劃</button>
          <button id="tab-map-btn" onclick="switchTab('map')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">🗺️ 路線地圖</button>
          <button id="tab-weather-btn" onclick="switchTab('weather')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">🌤️ 城市天氣</button>
          <button id="tab-split-btn" onclick="switchTab('split')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">💴 1對1分帳</button>
          <button id="tab-shortener-btn" onclick="switchTab('shortener')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">🔗 縮短網址</button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- 1. ITINERARY TAB -->
    <section id="tab-itinerary" class="tab-content space-y-5">
      
      <!-- 行程標題 -->
      <div class="bg-jp-card border border-jp-border p-4 rounded-2xl flex flex-wrap justify-between items-center gap-3 shadow-sm interactive-only">
        <div class="flex-1 min-w-[240px]">
          <input type="text" id="trip-title-input" value="旅程標題" onchange="updateTripTitle(this.value)" class="text-lg font-bold text-jp-dark bg-transparent border-b border-transparent hover:border-jp-sand focus:border-jp-accent focus:outline-none px-1 py-0.5 transition w-full">
          <p class="text-[10px] text-jp-dark/40 mt-1">提示：修改後會自動即時同步至雲端 API。</p>
        </div>
      </div>

      <!-- 天數選擇頁籤 (支援拖曳排序) -->
      <div class="flex flex-wrap items-center justify-between gap-3 bg-jp-card p-3.5 rounded-2xl border border-jp-border shadow-sm no-print">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 max-w-full interactive-only" id="day-selector-container"></div>
        <button onclick="addDay()" class="flex items-center gap-1 text-xs bg-jp-accentLight text-jp-accent hover:bg-jp-accent/20 px-3 py-1.5 rounded-xl font-bold transition interactive-only">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增天數
        </button>
      </div>

      <!-- 當前天數 Banner -->
      <div class="bg-jp-card border border-jp-border p-3.5 rounded-2xl flex justify-between items-center shadow-sm interactive-only">
        <h2 class="text-sm font-bold text-jp-dark flex items-center gap-2">
          <span id="current-day-title">第 1 天</span>
          <input type="date" id="start-date-picker" class="text-xs bg-jp-bg border border-jp-border rounded-lg px-2.5 py-1 text-jp-dark focus:outline-none" onchange="updateStartDate(this.value)">
          <span id="current-day-weekday" class="text-xs font-normal bg-jp-accentLight text-jp-accent px-2 py-0.5 rounded-md"></span>
        </h2>
        <span class="text-[10px] text-jp-dark/40">提示：可拖曳上方天數標籤調整順序</span>
      </div>

      <!-- 景點與交通清單 -->
      <div id="spots-list" class="space-y-4 interactive-only"></div>
      <div id="print-all-container" class="hidden"></div>
    </section>

    <!-- 2. ROUTE MAP TAB -->
    <section id="tab-map" class="tab-content hidden space-y-4">
      <div class="bg-jp-card p-3.5 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm no-print">
        <h2 class="text-sm font-bold text-jp-dark">🗺️ 每日路線地圖</h2>
        <div class="flex items-center gap-2 overflow-x-auto" id="map-day-selector"></div>
      </div>
      <div class="bg-jp-card p-2 rounded-2xl border border-jp-border shadow-sm overflow-hidden">
        <div id="map"></div>
      </div>
    </section>

    <!-- 3. CITY WEATHER TAB -->
    <section id="tab-weather" class="tab-content hidden space-y-5">
      <div class="bg-jp-card p-4 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm no-print">
        <h2 class="text-sm font-bold text-jp-dark">🌤️ 全球官方測站天氣預報</h2>
        <div class="flex items-center gap-2 overflow-x-auto" id="weather-day-selector"></div>
      </div>
      <div id="weather-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- 4. 1-ON-1 SPLIT EXPENSE TAB -->
    <section id="tab-split" class="tab-content hidden space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-1 space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs flex items-center justify-between">
            <span>👥 出遊成員</span>
            <span class="text-xs font-normal text-jp-dark/50" id="member-count-badge">0 人</span>
          </h3>
          <div class="flex gap-2 no-print">
            <input type="text" id="new-member-name" placeholder="姓名..." class="flex-1 text-xs border border-jp-border rounded-xl px-3 py-2 bg-jp-bg focus:outline-none">
            <button onclick="addMember()" class="bg-jp-accent text-white px-3 py-2 rounded-xl text-xs hover:bg-jp-accent/90 transition font-bold">新增</button>
          </div>
          <div id="members-chip-container" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-2 space-y-3 shadow-sm no-print">
          <h3 class="font-bold text-jp-dark text-xs">➕ 新增記帳</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-jp-dark/70 mb-1">消費項目</label>
              <input type="text" id="exp-title" placeholder="例如：火車車票" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">先付代墊人</label>
              <select id="exp-payer" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg"></select>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">金額與幣種</label>
              <div class="flex gap-1">
                <input type="number" id="exp-amount" placeholder="0" class="w-1/2 border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
                <select id="exp-currency" onchange="onCurrencyChange()" class="w-1/2 border border-jp-border rounded-xl px-1 py-2 bg-jp-bg text-xs">
                  <option value="TWD">TWD (新台幣)</option>
                  <option value="JPY">JPY (日圓)</option>
                  <option value="VND">VND (越南盾)</option>
                  <option value="USD">USD (美元)</option>
                  <option value="EUR">EUR (歐元)</option>
                  <option value="KRW">KRW (韓元)</option>
                  <option value="GBP">GBP (英鎊)</option>
                  <option value="THB">THB (泰銖)</option>
                  <option value="SGD">SGD (新加坡幣)</option>
                  <option value="HKD">HKD (港幣)</option>
                  <option value="AUD">AUD (澳幣)</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">換算匯率 (1 外幣 = ? TWD)</label>
              <input type="number" step="0.0001" id="exp-rate" value="1.0" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg font-bold text-jp-accent">
            </div>
          </div>
          <div>
            <label class="block text-xs text-jp-dark/70 mb-1">分攤成員</label>
            <div id="exp-participants-checkboxes" class="flex flex-wrap gap-3 pt-1 text-xs"></div>
          </div>
          <button onclick="addExpense()" class="w-full bg-jp-accent hover:bg-jp-accent/90 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">儲存該筆消費</button>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs">📜 明細記錄</h3>
          <div id="expenses-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
        </div>
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs">🤝 1 對 1 精準對拆結算結果</h3>
          <div id="settlement-results" class="space-y-2 pt-1"></div>
        </div>
      </div>
    </section>

    <!-- 5. URL SHORTENER TAB -->
    <section id="tab-shortener" class="tab-content hidden space-y-4">
      <div class="bg-jp-card p-4 rounded-2xl border border-jp-border shadow-sm space-y-3">
        <div class="flex justify-between items-center">
          <h2 class="text-sm font-bold text-jp-dark">🔗 Reurl 縮短網址工具</h2>
          <a href="https://reurl.cc/main/tw" target="_blank" class="text-xs text-jp-accent hover:underline font-bold">在新視窗開啟官網 ↗</a>
        </div>
        <div class="w-full h-[600px] border border-jp-border rounded-xl overflow-hidden bg-white">
          <iframe src="https://reurl.cc/main/tw" class="w-full h-full border-0" title="Reurl 縮短網址"></iframe>
        </div>
      </div>
    </section>

  </main>

  <!-- ICON PICKER MODAL -->
  <div id="icon-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-jp-card border border-jp-border rounded-2xl p-5 max-w-xs w-full shadow-xl space-y-4 text-center">
      <h3 class="font-bold text-jp-dark text-sm">選擇行程封面圖示</h3>
      <div class="grid grid-cols-4 gap-3 text-2xl" id="icon-options-grid"></div>
      <button onclick="closeIconModal()" class="w-full bg-jp-bg hover:bg-jp-border text-jp-dark text-xs font-bold py-2 rounded-xl border border-jp-border">取消</button>
    </div>
  </div>

  <script>
    if (typeof lucide === 'undefined') { window.lucide = { createIcons() {} }; }

    let globalCloudData = {
      activeTripId: 'matsu',
      trips: []
    };

    let activeTrip = null;
    let activeDayIndex = 0;
    let mapDayIndex = 0;
    let weatherDayIndex = 0;
    let draggedDayIndex = null;
    let draggedSpotIndex = null;

    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const ICONS = ['⛩️', '✈️', '🗼', '🌸', '🗻', '🍵', '🚄', '🍣', '🍱', '🧋', '🏮', '🏖️', '🗽', '🏰', '🎡'];

    let map = null;
    let mapMarkers = [];
    let mapPolyline = null;
    let searchDebounceTimers = {};

    window.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const apiParam = urlParams.get('api');
      if (apiParam) SINGLE_CLOUD_API_URL = apiParam;

      await loadGlobalCloudData();
    });

    async function loadGlobalCloudData() {
      if (SINGLE_CLOUD_API_URL && !SINGLE_CLOUD_API_URL.includes('您的')) {
        try {
          const res = await fetch(SINGLE_CLOUD_API_URL);
          if (res.ok) {
            const data = await res.json();
            if (data && data.trips && data.trips.length > 0) {
              globalCloudData = data;
            }
          }
        } catch (e) {
          console.error("雲端讀取失敗", e);
        }
      }

      if (!globalCloudData.trips || globalCloudData.trips.length === 0) {
        globalCloudData.trips = [
          {
            id: 'matsu',
            tripTitle: '馬祖 5 天 4 夜跳島行',
            tripIcon: '🏝️',
            startDate: '2026-10-24',
            days: [
              {
                spots: [
                  { id: '1', name: '基隆港新臺馬輪', lat: 25.132, lng: 121.741, arriveTime: '20:00', stayMins: 120, city: '基隆市' },
                  { id: '2', name: '東引島燈塔', lat: 26.371, lng: 120.501, arriveTime: '06:00', stayMins: 90, city: '連江縣' }
                ],
                transits: [
                  { mode: 'ferry', mins: 480, distKm: 150.0, notes: '搭乘新臺馬輪前往東引', manualMins: null }
                ]
              }
            ],
            members: ['我'],
            expenses: []
          }
        ];
        globalCloudData.activeTripId = 'matsu';
      }

      setActiveTrip(globalCloudData.activeTripId || globalCloudData.trips[0].id);
    }

    function setActiveTrip(tripId) {
      const found = globalCloudData.trips.find(t => t.id === tripId);
      if (found) {
        activeTrip = found;
        globalCloudData.activeTripId = tripId;
      } else {
        activeTrip = globalCloudData.trips[0];
        globalCloudData.activeTripId = activeTrip.id;
      }

      activeDayIndex = 0;
      recalculateTimes(0);
      renderAll();
      lucide.createIcons();
    }

    async function saveGlobalCloudData() {
      if (SINGLE_CLOUD_API_URL && !SINGLE_CLOUD_API_URL.includes('您的')) {
        try {
          await fetch(SINGLE_CLOUD_API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(globalCloudData)
          });
        } catch (e) {
          console.error("雲端同步失敗", e);
        }
      }
    }

    function copyShareUrl() {
      const shareUrl = `${window.location.origin}${window.location.pathname}?api=${encodeURIComponent(SINGLE_CLOUD_API_URL)}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("已複製當前雲端行程的共用連結！您可以發送給朋友，對方點開即同步顯示最新內容。");
      });
    }

    function renderTripSelector() {
      const selector = document.getElementById('trip-selector');
      selector.innerHTML = globalCloudData.trips.map(t => `
        <option value="${t.id}" ${t.id === activeTrip.id ? 'selected' : ''}>${t.tripIcon} ${t.tripTitle}</option>
      `).join('');
    }

    function changeActiveTrip(tripId) {
      setActiveTrip(tripId);
      saveGlobalCloudData();
    }

    function createNewTripPrompt() {
      const title = prompt("請輸入新旅程的名稱（例如：2027 東京自由行）：");
      if (!title) return;

      const newId = 'trip_' + Date.now();
      const newTrip = {
        id: newId,
        tripTitle: title,
        tripIcon: '✈️',
        startDate: '2026-11-01',
        days: [
          { spots: [{ id: Date.now().toString(), name: '第一站景點', lat: 25.042, lng: 121.508, arriveTime: '09:00', stayMins: 60, city: '臺北市' }], transits: [] }
        ],
        members: ['我'],
        expenses: []
      };

      globalCloudData.trips.push(newTrip);
      setActiveTrip(newId);
      saveGlobalCloudData();
    }

    function deleteCurrentTrip() {
      if (globalCloudData.trips.length <= 1) {
        alert("必須保留至少一個旅程！");
        return;
      }
      if (confirm(`確定要刪除旅程「${activeTrip.tripTitle}」嗎？`)) {
        globalCloudData.trips = globalCloudData.trips.filter(t => t.id !== activeTrip.id);
        setActiveTrip(globalCloudData.trips[0].id);
        saveGlobalCloudData();
      }
    }

    function updateTripTitle(val) {
      activeTrip.tripTitle = val;
      renderTripSelector();
      saveGlobalCloudData();
    }

    function openIconModal() {
      const grid = document.getElementById('icon-options-grid');
      grid.innerHTML = ICONS.map(icon => `
        <button onclick="selectTripIcon('${icon}')" class="p-2 hover:bg-jp-accentLight rounded-xl border border-jp-border text-center transition">${icon}</button>
      `).join('');
      document.getElementById('icon-modal').classList.remove('hidden');
    }
    function closeIconModal() { document.getElementById('icon-modal').classList.add('hidden'); }
    function selectTripIcon(icon) {
      activeTrip.tripIcon = icon;
      document.getElementById('trip-icon-display').textContent = icon;
      renderTripSelector();
      closeIconModal();
      saveGlobalCloudData();
    }

    function getComputedDayDate(dayIdx) {
      if (!activeTrip.startDate) return { dateStr: '', weekdayStr: '', shortDateStr: '' };
      const start = new Date(activeTrip.startDate);
      start.setDate(start.getDate() + dayIdx);
      return {
        dateStr: `${start.getFullYear()}-${String(start.getMonth() + 1).padStart(2, '0')}-${String(start.getDate()).padStart(2, '0')}`,
        shortDateStr: `${String(start.getMonth() + 1).padStart(2, '0')}/${String(start.getDate()).padStart(2, '0')}`,
        weekdayStr: WEEKDAYS[start.getDay()]
      };
    }

    function updateStartDate(val) { activeTrip.startDate = val; renderDaySelector(); saveGlobalCloudData(); }

    function formatDuration(mins) {
      if (!mins || mins <= 0) return '0 分鐘';
      const hours = Math.floor(mins / 60), remainingMins = mins % 60;
      if (hours === 0) return `${remainingMins} 分鐘`;
      if (remainingMins === 0) return `${hours} 小時`;
      return `${hours} 小時 ${remainingMins} 分鐘`;
    }

    function generateSmartTransitNote(spotA, spotB, mode, distKm) {
      const nameA = spotA.name || '出發地', nameB = spotB.name || '目的地';
      if (mode === 'mrt') return `從【${nameA}】搭乘捷運/地鐵前往【${nameB}】`;
      if (mode === 'bus') return `從【${nameA}】搭乘公車前往【${nameB}】`;
      if (mode === 'thsr') return `從【${nameA}】前往高鐵站搭乘高鐵至【${nameB}】`;
      if (mode === 'train') return `從【${nameA}】搭乘火車前往【${nameB}】`;
      if (mode === 'scooter') return `從【${nameA}】騎乘機車前往【${nameB}】（約 ${distKm} km）`;
      if (mode === 'drive') return `從【${nameA}】開車直達【${nameB}】`;
      if (mode === 'walk') return `從【${nameA}】步行至【${nameB}】（約 ${distKm} km）`;
      return `從【${nameA}】前往【${nameB}】`;
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));

    function addDay() {
      activeTrip.days.push({ spots: [{ id: Date.now().toString(), name: '新景點', lat: 25.042, lng: 121.508, arriveTime: '09:00', stayMins: 60, city: '臺北市' }], transits: [] });

    function removeDay(idx) {
      if (activeTrip.days.length <= 1) return;

    function handleDayDragStart(e, idx) { draggedDayIndex = idx; e.dataTransfer.setData('text/plain', idx); }
    function handleDayDrop(e, targetIdx) {
      e.preventDefault();
      if (draggedDayIndex === null || draggedDayIndex === targetIdx) return;
      const movedDay = activeTrip.days.splice(draggedDayIndex, 1)[0];
      activeTrip.days.splice(targetIdx, 0, movedDay);
      activeDayIndex = targetIdx;
      draggedDayIndex = null;
      renderAll();
      saveGlobalCloudData();
    }
    function handleDayDragEnd(e) { draggedDayIndex = null; }

    function handleSpotDragStart(e, idx) { draggedSpotIndex = idx; e.dataTransfer.setData('text/plain', idx); }
    function handleSpotDrop(e, targetIdx) {
      e.preventDefault();
      if (draggedSpotIndex === null || draggedSpotIndex === targetIdx) return;
      const day = activeTrip.days[activeDayIndex];
      const movedSpot = day.spots.splice(draggedSpotIndex, 1)[0];
      day.spots.splice(targetIdx, 0, movedSpot);
      day.transits = [];
      draggedSpotIndex = null;
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    async function recalculateTimes(dayIdx) {
      const day = activeTrip.days[dayIdx];
      if (!day || !day.spots.length) return;
      if (!day.transits) day.transits = [];

      for (let i = 0; i < day.spots.length - 1; i++) {
        const spotA = day.spots[i], spotB = day.spots[i + 1];
        if (!day.transits[i]) day.transits[i] = { mode: 'mrt', mins: 30, distKm: 5.0, notes: '', manualMins: null };

        const transit = day.transits[i];
        const mode = transit.mode || 'mrt';

        if (transit.manualMins === null || transit.manualMins === undefined) {
          try {
            let osrmProfile = 'car';
            if (mode === 'walk') osrmProfile = 'foot';
            else if (mode === 'bike') osrmProfile = 'bike';
            const url = `https://routing.openstreetmap.de/routed-${osrmProfile}/route/v1/driving/${spotA.lng},${spotA.lat};${spotB.lng},${spotB.lat}?overview=false`;
            const res = await fetch(url);
            const data = await res.json();
            if (data && data.routes && data.routes.length > 0) {
              const route = data.routes[0];
              transit.distKm = parseFloat((route.distance / 1000).toFixed(1));
              let calculatedMins = Math.round(route.duration / 60);
              if (mode === 'scooter') calculatedMins = Math.round(calculatedMins * 0.9);
              else if (mode === 'thsr') calculatedMins = Math.round(35 + (transit.distKm / 170) * 60);
              else if (mode === 'train') calculatedMins = Math.round(20 + (transit.distKm / 60) * 60);
              transit.mins = Math.max(calculatedMins, 1);
            } else { throw new Error(); }
          } catch (err) {
            const straightDist = calcDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
            transit.distKm = parseFloat(straightDist.toFixed(1));
            transit.mins = Math.max(Math.round((transit.distKm / 40) * 60) + 5, 5);
          }
        }

        if (!transit.notes) transit.notes = generateSmartTransitNote(spotA, spotB, mode, transit.distKm);

        const [h, m] = (spotA.arriveTime || '09:00').split(':').map(Number);
        const totalNextMins = (h * 60 + m) + parseInt(spotA.stayMins || 0) + transit.mins;
        spotB.arriveTime = `${String(Math.floor(totalNextMins / 60) % 24).padStart(2, '0')}:${String(totalNextMins % 60).padStart(2, '0')}`;
      }
      renderSpotsList();
      preparePrintContent();
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 5.0;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

                <button onclick="removeSpot(${i})" class="text-xs text-jp-red font-bold px-2 py-1 hover:bg-rose-50 rounded-lg">刪除</button>

        if (i < day.spots.length - 1) {

          const gmapsRouteUrl = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(spot.name)}&destination=${encodeURIComponent(day.spots[i+1].name)}`;
          
          // 🌟 交通區塊：使用原本的卡片背景色，外框改為虛線 (border-dashed border-jp-sand)

    function preparePrintContent() {
      const container = document.getElementById('print-all-container');
      if (!activeTrip || !activeTrip.days) return;

      let printHtml = `<h1 style="font-size: 20pt; font-weight: bold; margin-bottom: 15px; text-align: center;">${activeTrip.tripIcon || '⛩️'} ${activeTrip.tripTitle}</h1>`;

              </div>
            `;

        });

        printHtml += `</div></div>`;
      });

      container.innerHTML = printHtml;

    function updateManualTransitMins(i, val) {
      const day = activeTrip.days[activeDayIndex];
      const mins = parseInt(val);
      if (!isNaN(mins) && mins > 0) {
        day.transits[i].manualMins = mins;
        day.transits[i].mins = mins;
        recalculateTimes(activeDayIndex);
        saveGlobalCloudData();
      }
    }

    function onSpotNameInput(i, query) {
      activeTrip.days[activeDayIndex].spots[i].name = query;
      saveGlobalCloudData();
      const dropdown = document.getElementById(`autocomplete-dropdown-${i}`);
      if (!query || query.trim().length < 1) { dropdown.classList.add('hidden'); return; }

      if (searchDebounceTimers[i]) clearTimeout(searchDebounceTimers[i]);
      searchDebounceTimers[i] = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&accept-language=zh-TW,en&q=${encodeURIComponent(query)}`);
          const data = await res.json();
          if (data && data.length > 0 && dropdown) {
            dropdown.innerHTML = data.slice(0, 5).map((item, idx) => `
              <div onclick="selectInlineAutocomplete(${i}, ${idx})" class="p-2.5 hover:bg-jp-accentLight cursor-pointer transition">
                <div class="font-bold text-xs">${item.display_name.split(',')[0]}</div>
                <div class="text-[10px] text-jp-dark/50">${item.display_name}</div>
              </div>
            `).join('');
            window[`inlineSearchResults_${i}`] = data.slice(0, 5);
            dropdown.classList.remove('hidden');
          }
        } catch (e) { dropdown.classList.add('hidden'); }
      }, 300);
    }

    function selectInlineAutocomplete(spotIdx, cacheIdx) {
      document.getElementById(`autocomplete-dropdown-${spotIdx}`).classList.add('hidden');
      const selected = window[`inlineSearchResults_${spotIdx}`][cacheIdx];
      const spot = activeTrip.days[activeDayIndex].spots[spotIdx];
      spot.name = selected.display_name.split(',')[0];
      spot.lat = parseFloat(selected.lat);
      spot.lng = parseFloat(selected.lon);
      const addr = selected.address || {};
      spot.city = addr.city || addr.town || addr.county || '精選城市';
      activeTrip.days[activeDayIndex].transits = [];
      recalculateTimes(activeDayIndex);
      renderSpotsList();
      saveGlobalCloudData();

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.relative')) document.querySelectorAll('[id^="autocomplete-dropdown-"]').forEach(el => el.classList.add('hidden'));
    });

    function addSpot() {
      activeTrip.days[activeDayIndex].spots.push({ id: Date.now().toString(), name: '新景點', lat: 25.042, lng: 121.508, arriveTime: '12:00', stayMins: 60, city: '臺北市' });
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    function removeSpot(i) {
      const day = activeTrip.days[activeDayIndex];
      day.spots.splice(i, 1);
      if (day.transits.length > i) day.transits.splice(i, 1);
      recalculateTimes(activeDayIndex);
      saveGlobalCloudData();
    }

    function moveSpot(i, dir) {
      const target = i + dir, day = activeTrip.days[activeDayIndex];
      if (target >= 0 && target < day.spots.length) {
        const moved = day.spots.splice(i, 1)[0];
        day.spots.splice(target, 0, moved);
        day.transits = [];
        recalculateTimes(activeDayIndex);
        saveGlobalCloudData();
      }
    }

    function updateSpotTime(i, val) { activeTrip.days[activeDayIndex].spots[i].arriveTime = val; recalculateTimes(activeDayIndex); saveGlobalCloudData(); }
    function updateSpotStay(i, val) { activeTrip.days[activeDayIndex].spots[i].stayMins = parseInt(val) || 0; recalculateTimes(activeDayIndex); saveGlobalCloudData(); }
    function updateTransitMode(i, mode) {
      const day = activeTrip.days[activeDayIndex];
      day.transits[i].mode = mode; day.transits[i].manualMins = null;
      day.transits[i].notes = generateSmartTransitNote(day.spots[i], day.spots[i+1], mode, day.transits[i].distKm);
      recalculateTimes(activeDayIndex); saveGlobalCloudData();
    }
    function updateTransitNotes(i, notes) { activeTrip.days[activeDayIndex].transits[i].notes = notes; saveGlobalCloudData(); }

    // --- MAP ---
    function initOrUpdateMap() {
      const container = document.getElementById('map-day-selector');
      container.innerHTML = activeTrip.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        return `
          <button onclick="changeMapDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${idx === mapDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'}">
            第 ${idx + 1} 天 (${info.shortDateStr})
          </button>
        `;
      }).join('');

      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([25.042, 121.508], 12);
          L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', { maxZoom: 20 }).addTo(map);
        }
        map.invalidateSize();
        renderMapRoutes();
      }, 100);
    }
    function changeMapDay(idx) { mapDayIndex = idx; initOrUpdateMap(); }
    function renderMapRoutes() {
      if (!map) return;
      mapMarkers.forEach(m => map.removeLayer(m));
      if (mapPolyline) map.removeLayer(mapPolyline);
      mapMarkers = [];
      const day = activeTrip.days[mapDayIndex];
      if (!day || !day.spots.length) return;
      const latLngs = [];
      day.spots.forEach((spot, idx) => {
        const ll = [spot.lat, spot.lng];
        latLngs.push(ll);
        const marker = L.marker(ll, { icon: L.divIcon({ className: 'jp-div-icon', html: `<div class="jp-map-marker">${idx + 1}</div>`, iconSize: [32, 32], iconAnchor: [16, 16] }) })
          .bindPopup(`<b>${idx + 1}. ${spot.name}</b>`).addTo(map);
        mapMarkers.push(marker);
      });
      if (latLngs.length > 1) {
        mapPolyline = L.polyline(latLngs, { color: '#e54d42', weight: 4, dashArray: '6, 8' }).addTo(map);
        map.fitBounds(mapPolyline.getBounds(), { padding: [50, 50] });
      } else if (latLngs.length === 1) map.setView(latLngs[0], 13);
    }

    // --- WEATHER ---
    async function renderWeatherTab() {
      const daySelector = document.getElementById('weather-day-selector');
      daySelector.innerHTML = activeTrip.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        return `
          <button onclick="changeWeatherDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${idx === weatherDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'}">
            第 ${idx + 1} 天 (${info.shortDateStr})
          </button>
        `;
      }).join('');

      const container = document.getElementById('weather-cards-container');
      container.innerHTML = `<p class="text-xs text-jp-dark/40 col-span-2 py-4">讀取天氣中...</p>`;
      const day = activeTrip.days[weatherDayIndex], dateInfo = getComputedDayDate(weatherDayIndex);
      const uniqueCities = {};
      day.spots.forEach(s => { if (!uniqueCities[s.city || '台灣']) uniqueCities[s.city || '台灣'] = { lat: s.lat, lng: s.lng }; });

      let html = '';
      for (const [cityName, coords] of Object.entries(uniqueCities)) {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
          const data = await res.json();
          let di = data.daily.time.indexOf(dateInfo.dateStr);
          if (di < 0) di = 0;
          html += `
            <div class="bg-jp-card p-5 rounded-2xl border border-jp-border shadow-sm flex flex-col justify-between space-y-4">
              <div>
                <span class="text-[10px] bg-jp-accentLight text-jp-accent font-bold px-2 py-0.5 rounded-md">${dateInfo.dateStr}</span>
                <h3 class="text-lg font-bold text-jp-dark mt-1">${cityName}</h3>
              </div>
              <div class="grid grid-cols-3 gap-2 bg-jp-bg p-3 rounded-xl text-center text-xs">
                <div><div class="text-[10px] text-jp-dark/40">最高溫</div><div class="text-sm font-bold text-jp-red">${data.daily.temperature_2m_max[di]}°C</div></div>
                <div><div class="text-[10px] text-jp-dark/40">最低溫</div><div class="text-sm font-bold text-blue-600">${data.daily.temperature_2m_min[di]}°C</div></div>
                <div><div class="text-[10px] text-jp-dark/40">降雨率</div><div class="text-sm font-bold text-jp-accent">${data.daily.precipitation_probability_max[di] ?? 0}%</div></div>
              </div>
            </div>
          `;
        } catch (e) { html += `<div class="bg-jp-card p-4 rounded-2xl border text-xs">無法獲取 ${cityName} 天氣。</div>`; }
      }
      container.innerHTML = html;
    }
    function changeWeatherDay(idx) { weatherDayIndex = idx; renderWeatherTab(); }

    // --- SPLIT ---
    async function onCurrencyChange() {
      const curr = document.getElementById('exp-currency').value;
      if (curr === 'TWD') {
        document.getElementById('exp-rate').value = "1.0";
        return;
      }
      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${curr}`);
        const data = await res.json();
        if (data?.rates?.TWD) {
          document.getElementById('exp-rate').value = data.rates.TWD.toFixed(4);
        }
      } catch (e) {
        const fallbackRates = { JPY: 0.21, VND: 0.0013, USD: 32.0, EUR: 34.5, KRW: 0.024, THB: 0.92, SGD: 24.0, HKD: 4.1, GBP: 41.0, AUD: 21.0 };
        document.getElementById('exp-rate').value = fallbackRates[curr] || 1.0;
      }
    }

    function renderSplitTab() {
      document.getElementById('members-chip-container').innerHTML = (activeTrip.members || []).map(m => `
        <span class="bg-jp-accentLight text-jp-accent px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">${m} <button onclick="removeMember('${m}')" class="text-jp-accent/50">×</button></span>
      `).join('');
      document.getElementById('member-count-badge').textContent = `${(activeTrip.members || []).length} 人`;
      document.getElementById('exp-payer').innerHTML = (activeTrip.members || []).map(m => `<option value="${m}">${m}</option>`).join('');
      document.getElementById('exp-participants-checkboxes').innerHTML = (activeTrip.members || []).map(m => `
        <label class="flex items-center gap-1 cursor-pointer"><input type="checkbox" value="${m}" checked class="part-check rounded text-jp-accent"><span>${m}</span></label>
      `).join('');
      onCurrencyChange();
      renderExpensesList();
      calculatePairwiseSettlement();
    }

    function addMember() {
      const name = document.getElementById('new-member-name').value.trim();
      if (name && !activeTrip.members.includes(name)) {
        activeTrip.members.push(name);
        document.getElementById('new-member-name').value = '';
        renderSplitTab();
        saveGlobalCloudData();
      }
    }
    function removeMember(name) {
      activeTrip.members = activeTrip.members.filter(m => m !== name);
      renderSplitTab();
      saveGlobalCloudData();
    }

    function addExpense() {
      const title = document.getElementById('exp-title').value.trim(), payer = document.getElementById('exp-payer').value;
      const amount = parseFloat(document.getElementById('exp-amount').value), currency = document.getElementById('exp-currency').value;
      const rate = parseFloat(document.getElementById('exp-rate').value) || 1.0;
      const checkedParts = Array.from(document.querySelectorAll('.part-check:checked')).map(cb => cb.value);
      if (!title || isNaN(amount) || amount <= 0 || !checkedParts.length) { alert("請完整填寫"); return; }
      if (!activeTrip.expenses) activeTrip.expenses = [];
      activeTrip.expenses.push({ id: Date.now().toString(), title, payer, amount, currency, rate, amountTwd: Math.round(amount * rate), participants: checkedParts });
      document.getElementById('exp-title').value = ''; document.getElementById('exp-amount').value = '';
      renderSplitTab(); saveGlobalCloudData();
    }
    function removeExpense(id) {
      activeTrip.expenses = activeTrip.expenses.filter(e => e.id !== id);
      renderSplitTab(); saveGlobalCloudData();
    }
    function renderExpensesList() {
      document.getElementById('expenses-list').innerHTML = (activeTrip.expenses || []).length ? activeTrip.expenses.map(e => `
        <div class="bg-jp-bg p-2.5 rounded-xl border border-jp-border text-xs flex items-center justify-between">
          <div><div class="font-bold">${e.title}</div><div class="text-jp-dark/60">${e.payer} 付 ${e.amount} ${e.currency} (NT$ ${e.amountTwd})</div></div>
          <button onclick="removeExpense('${e.id}')" class="text-jp-red font-bold">刪除</button>
        </div>
      `).join('') : `<p class="text-xs text-jp-dark/40 py-4 text-center">尚無記帳。</p>`;
    }
    function calculatePairwiseSettlement() {
      const matrix = {};
      (activeTrip.members || []).forEach(m1 => { matrix[m1] = {}; (activeTrip.members || []).forEach(m2 => matrix[m1][m2] = 0); });
      (activeTrip.expenses || []).forEach(exp => {
        const share = exp.amountTwd / exp.participants.length;
        exp.participants.forEach(p => { if (p !== exp.payer) matrix[p][exp.payer] += share; });
      });
      let html = '';
      (activeTrip.members || []).forEach((m1, i) => {
        (activeTrip.members || []).forEach((m2, j) => {
          if (i < j) {
            const net = matrix[m1][m2] - matrix[m2][m1];
            if (Math.abs(net) > 1) {
              html += `<div class="bg-jp-accentLight border p-3 rounded-xl text-xs flex justify-between items-center"><div><b>${net > 0 ? m1 : m2}</b> 轉帳給 <b>${net > 0 ? m2 : m1}</b></div><span class="font-extrabold text-jp-accent">NT$ ${Math.round(Math.abs(net))}</span></div>`;
            }
          }
        });
      });
      document.getElementById('settlement-results').innerHTML = html || `<p class="text-xs text-jp-dark/40 py-4 text-center">結算為 0。</p>`;
    }

    function exportPDF() {
      preparePrintContent();
      window.print();
    }
  </script>
</body>
</html>
