<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅遊行程與 1對1 分帳助手</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet.js CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Noto Sans JP Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jp: {
              bg: '#fbf9f5',
              card: '#ffffff',
              border: '#efebe4',
              accent: '#6e8b74', // Matcha Green
              accentLight: '#f0f4f1',
              red: '#e54d42',    // Aka Red
              sand: '#d8cfc4',
              dark: '#2c3531'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #fbf9f5; color: #2c3531; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #fbf9f5; }
    ::-webkit-scrollbar-thumb { background: #d8cfc4; border-radius: 4px; }
    #map { height: calc(100vh - 200px); min-height: 420px; width: 100%; border-radius: 12px; }

    /* High contrast custom marker for map */
    .jp-map-marker {
      background-color: #e54d42;
      color: white;
      border: 3px solid #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(229, 77, 66, 0.4), 0 2px 4px rgba(0,0,0,0.3);
      position: relative;
    }
    .jp-map-marker::after {
      content: '';
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(229, 77, 66, 0.2);
      z-index: -1;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      70% { transform: scale(1.3); opacity: 0; }
      100% { transform: scale(0.9); opacity: 0; }
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-jp-card border-b border-jp-border sticky top-0 z-50 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-2">
        <span class="text-2xl">⛩️</span>
        <input type="text" id="trip-title-input" value="東京京都 5 天 4 夜清新之旅" onchange="updateTripTitle(this.value)" class="text-lg font-bold text-jp-dark bg-transparent border-b border-transparent hover:border-jp-sand focus:border-jp-accent focus:outline-none px-1 py-0.5 transition">
      </div>
      
      <!-- Nav Tabs -->
      <nav class="flex bg-jp-bg p-1 rounded-xl border border-jp-border text-xs font-medium">
        <button id="tab-itinerary-btn" onclick="switchTab('itinerary')" class="px-3.5 py-1.5 rounded-lg transition-all bg-jp-accent text-white shadow-sm">
          📅 行程規劃
        </button>
        <button id="tab-map-btn" onclick="switchTab('map')" class="px-3.5 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark">
          🗺️ 路線地圖
        </button>
        <button id="tab-weather-btn" onclick="switchTab('weather')" class="px-3.5 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark">
          🌤️ 城市天氣
        </button>
        <button id="tab-split-btn" onclick="switchTab('split')" class="px-3.5 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark">
          💴 1對1分帳
        </button>
      </nav>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- 1. ITINERARY TAB -->
    <section id="tab-itinerary" class="tab-content space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3 bg-jp-card p-3.5 rounded-2xl border border-jp-border shadow-sm">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 max-w-full" id="day-selector-container">
          <!-- Days populated dynamically -->
        </div>
        <button onclick="addDay()" class="flex items-center gap-1 text-xs bg-jp-accentLight text-jp-accent hover:bg-jp-accent/20 px-3 py-1.5 rounded-xl font-bold transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增天數
        </button>
      </div>

      <!-- Active Day Banner -->
      <div class="bg-jp-card border border-jp-border p-4 rounded-2xl flex flex-wrap justify-between items-center gap-3 shadow-sm">
        <div>
          <h2 class="text-base font-bold text-jp-dark flex items-center gap-2">
            <span id="current-day-title">第 1 天</span>
            <input type="date" id="start-date-picker" class="text-xs bg-jp-bg border border-jp-border rounded-lg px-2.5 py-1 text-jp-dark focus:outline-none" onchange="updateStartDate(this.value)">
            <span id="current-day-weekday" class="text-xs font-normal bg-jp-accentLight text-jp-accent px-2 py-0.5 rounded-md"></span>
          </h2>
          <p class="text-xs text-jp-dark/50 mt-1">💡 修改第一天出發日期後，後續天數日期與星期將自動推算遞延。</p>
        </div>
        <button onclick="addSpot()" class="bg-jp-accent hover:bg-jp-accent/90 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 新增景點
        </button>
      </div>

      <!-- Spots List -->
      <div id="spots-list" class="space-y-4">
        <!-- Rendered dynamically -->
      </div>
    </section>

    <!-- 2. ROUTE MAP TAB -->
    <section id="tab-map" class="tab-content hidden space-y-4">
      <div class="bg-jp-card p-3.5 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm">
        <div>
          <h2 class="text-sm font-bold text-jp-dark">🗺️ 每日路線視圖</h2>
          <p class="text-xs text-jp-dark/50">已套用高對比鮮明標記與 Google Maps 標準地圖底圖。</p>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto" id="map-day-selector">
          <!-- Populated dynamically -->
        </div>
      </div>

      <div class="bg-jp-card p-2 rounded-2xl border border-jp-border shadow-sm overflow-hidden">
        <div id="map"></div>
      </div>
    </section>

    <!-- 3. CITY WEATHER TAB -->
    <section id="tab-weather" class="tab-content hidden space-y-5">
      <div class="bg-jp-card p-4 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm">
        <div>
          <h2 class="text-sm font-bold text-jp-dark">🌤️ 城市天氣預報</h2>
          <p class="text-xs text-jp-dark/50">選擇指定天數，查看該當天的城市天氣與穿搭建議。</p>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto" id="weather-day-selector">
          <!-- Weather day buttons -->
        </div>
      </div>

      <div id="weather-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Weather cards rendered dynamically -->
      </div>
    </section>

    <!-- 4. 1-ON-1 SPLIT EXPENSE TAB -->
    <section id="tab-split" class="tab-content hidden space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Members -->
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-1 space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs flex items-center justify-between">
            <span>👥 出遊成員</span>
            <span class="text-xs font-normal text-jp-dark/50" id="member-count-badge">0 人</span>
          </h3>
          <div class="flex gap-2">
            <input type="text" id="new-member-name" placeholder="姓名..." class="flex-1 text-xs border border-jp-border rounded-xl px-3 py-2 bg-jp-bg focus:outline-none">
            <button onclick="addMember()" class="bg-jp-accent text-white px-3 py-2 rounded-xl text-xs hover:bg-jp-accent/90 transition font-bold">新增</button>
          </div>
          <div id="members-chip-container" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <!-- Add Expense -->
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-2 space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs">➕ 新增記帳</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-jp-dark/70 mb-1">消費項目</label>
              <input type="text" id="exp-title" placeholder="例如：居酒屋晚餐" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">先付代墊人</label>
              <select id="exp-payer" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg"></select>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">金額與幣種</label>
              <div class="flex gap-1">
                <input type="number" id="exp-amount" placeholder="0" class="w-2/3 border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
                <select id="exp-currency" onchange="updateExchangeRateField()" class="w-1/3 border border-jp-border rounded-xl px-1 py-2 bg-jp-bg">
                  <option value="TWD">TWD</option>
                  <option value="JPY">JPY</option>
                  <option value="USD">USD</option>
                  <option value="EUR">EUR</option>
                  <option value="KRW">KRW</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">換算匯率 (1 外幣 = ? TWD)</label>
              <div class="flex gap-1">
                <input type="number" step="0.0001" id="exp-rate" value="1.0" class="flex-1 border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
                <button onclick="fetchLiveRate()" class="text-xs bg-jp-accentLight text-jp-accent px-2.5 rounded-xl font-bold">⚡ 最新</button>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs text-jp-dark/70 mb-1">分攤成員</label>
            <div id="exp-participants-checkboxes" class="flex flex-wrap gap-3 pt-1 text-xs"></div>
          </div>

          <button onclick="addExpense()" class="w-full bg-jp-accent hover:bg-jp-accent/90 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">
            儲存該筆消費
          </button>
        </div>
      </div>

      <!-- Log & Pairwise Result -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs">📜 明細記錄</h3>
          <div id="expenses-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
        </div>

        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-jp-dark text-xs">🤝 1 對 1 精準對拆結算結果</h3>
            <span class="text-[10px] bg-jp-accentLight text-jp-accent px-2 py-0.5 rounded-md font-bold">直觀 1 對 1 轉帳</span>
          </div>
          <div id="settlement-results" class="space-y-2 pt-1"></div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // --- APP STATE ---
    let appData = {
      tripTitle: '東京京都 5 天 4 夜輕鬆遊',
      activeTab: 'itinerary',
      activeDayIndex: 0,
      mapDayIndex: 0,
      weatherDayIndex: 0,
      days: [
        {
          spots: [
            { id: '1', name: '成田國際機場 (NRT)', lat: 35.771, lng: 140.392, arriveTime: '10:00', stayMins: 60, city: '東京' },
            { id: '2', name: '淺草寺雷門', lat: 35.711, lng: 139.796, arriveTime: '12:00', stayMins: 90, city: '東京' },
            { id: '3', name: '東京晴空塔', lat: 35.710, lng: 139.810, arriveTime: '14:30', stayMins: 120, city: '東京' }
          ],
          transits: [
            { mode: 'transit', mins: 65, distKm: 60.0 },
            { mode: 'walk', mins: 15, distKm: 1.2 }
          ]
        },
        {
          spots: [
            { id: '4', name: '伏見稻荷大社', lat: 34.967, lng: 135.772, arriveTime: '09:30', stayMins: 120, city: '京都' },
            { id: '5', name: '清水寺', lat: 34.994, lng: 135.785, arriveTime: '13:00', stayMins: 90, city: '京都' }
          ],
          transits: [
            { mode: 'transit', mins: 25, distKm: 4.5 }
          ]
        }
      ],
      startDate: '2026-11-01',
      members: ['小明', '小華', '阿強'],
      expenses: [
        { id: 'e1', title: 'Suica 卡加值', payer: '小明', amount: 5000, currency: 'JPY', rate: 0.21, amountTwd: 1050, participants: ['小明', '小華', '阿強'] }
      ]
    };

    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    let map = null;
    let mapMarkers = [];
    let mapPolyline = null;

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      recalculateTimes(appData.activeDayIndex);
      renderAll();
      lucide.createIcons();
    });

    function saveData() {
      localStorage.setItem('jp_travel_app_v4', JSON.stringify(appData));
    }

    function loadData() {
      const saved = localStorage.getItem('jp_travel_app_v4');
      if (saved) {
        try { appData = JSON.parse(saved); } catch (e) { console.error(e); }
      }
    }

    function updateTripTitle(val) {
      appData.tripTitle = val;
      saveData();
    }

    // --- DATE CALCULATIONS ---
    function getComputedDayDate(dayIdx) {
      if (!appData.startDate) return { dateStr: '', weekdayStr: '' };
      const start = new Date(appData.startDate);
      start.setDate(start.getDate() + dayIdx);
      
      const year = start.getFullYear();
      const month = String(start.getMonth() + 1).padStart(2, '0');
      const date = String(start.getDate()).padStart(2, '0');
      const weekday = WEEKDAYS[start.getDay()];

      return {
        dateStr: `${year}-${month}-${date}`,
        shortDateStr: `${month}/${date}`,
        weekdayStr: weekday
      };
    }

    function updateStartDate(val) {
      appData.startDate = val;
      renderDaySelector();
      saveData();
    }

    // --- DURATION FORMATTING ---
    function formatDuration(mins) {
      if (!mins || mins <= 0) return '0 分鐘';
      if (mins < 60) return `${mins} 分鐘`;
      const hours = Math.floor(mins / 60);
      const remainingMins = mins % 60;
      return remainingMins > 0 ? `${hours} 小時 ${remainingMins} 分鐘` : `${hours} 小時`;
    }

    // --- TAB SWITCHING ---
    function switchTab(tab) {
      appData.activeTab = tab;
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`tab-${tab}`).classList.remove('hidden');

      ['itinerary', 'map', 'weather', 'split'].forEach(t => {
        const btn = document.getElementById(`tab-${t}-btn`);
        if (t === tab) {
          btn.className = "px-3.5 py-1.5 rounded-lg transition-all bg-jp-accent text-white shadow-sm font-bold";
        } else {
          btn.className = "px-3.5 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium";
        }
      });

      if (tab === 'map') initOrUpdateMap();
      if (tab === 'weather') renderWeatherTab();
      if (tab === 'split') renderSplitTab();
    }

    function renderAll() {
      document.getElementById('trip-title-input').value = appData.tripTitle || '東京京都 5 天 4 夜輕鬆遊';
      document.getElementById('start-date-picker').value = appData.startDate;
      renderDaySelector();
      renderSpotsList();
    }

    // --- ITINERARY ---
    function renderDaySelector() {
      const container = document.getElementById('day-selector-container');
      container.innerHTML = appData.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        return `
          <button onclick="selectDay(${idx})" class="px-3 py-1.5 text-xs rounded-xl border font-bold whitespace-nowrap transition ${
            idx === appData.activeDayIndex 
              ? 'bg-jp-accent text-white border-jp-accent shadow-sm' 
              : 'bg-jp-bg text-jp-dark/70 border-jp-border hover:bg-jp-border/50'
          }">
            第 ${idx + 1} 天 (${info.shortDateStr || ''} ${info.weekdayStr || ''})
          </button>
        `;
      }).join('');

      const activeInfo = getComputedDayDate(appData.activeDayIndex);
      document.getElementById('current-day-title').textContent = `第 ${appData.activeDayIndex + 1} 天`;
      document.getElementById('current-day-weekday').textContent = activeInfo.weekdayStr;
    }

    function selectDay(idx) {
      appData.activeDayIndex = idx;
      recalculateTimes(idx);
      renderAll();
      saveData();
    }

    function addDay() {
      appData.days.push({
        spots: [{ id: Date.now().toString(), name: '新景點', lat: 35.681, lng: 139.767, arriveTime: '09:00', stayMins: 60, city: '東京' }],
        transits: []
      });
      appData.activeDayIndex = appData.days.length - 1;
      renderAll();
      saveData();
    }

    function recalculateTimes(dayIdx) {
      const day = appData.days[dayIdx];
      if (!day || !day.spots.length) return;

      for (let i = 0; i < day.spots.length - 1; i++) {
        const spotA = day.spots[i];
        const spotB = day.spots[i + 1];

        if (!day.transits[i]) {
          day.transits[i] = { mode: 'transit', mins: 30, distKm: 5.0 };
        }

        const dist = calcDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
        day.transits[i].distKm = parseFloat(dist.toFixed(1));
        day.transits[i].mins = estimateTransitTime(dist, day.transits[i].mode);

        const [h, m] = spotA.arriveTime.split(':').map(Number);
        const totalStartMins = h * 60 + m;
        const totalNextArriveMins = totalStartMins + parseInt(spotA.stayMins || 0) + day.transits[i].mins;

        const nextH = Math.floor(totalNextArriveMins / 60) % 24;
        const nextM = totalNextArriveMins % 60;
        spotB.arriveTime = `${String(nextH).padStart(2, '0')}:${String(nextM).padStart(2, '0')}`;
      }
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 5.0;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function estimateTransitTime(distKm, mode) {
      let speed = 28;
      if (mode === 'walk') speed = 4.5;
      if (mode === 'drive') speed = 40;
      if (mode === 'bike') speed = 15;
      const mins = Math.round((distKm / speed) * 60) + 5;
      return Math.max(mins, 5);
    }

    function renderSpotsList() {
      const day = appData.days[appData.activeDayIndex];
      const container = document.getElementById('spots-list');
      if (!day.spots.length) {
        container.innerHTML = `<p class="text-center py-8 text-jp-dark/40 text-xs">目前無景點，請點擊上方按鈕新增。</p>`;
        return;
      }

      let html = '';
      day.spots.forEach((spot, i) => {
        html += `
          <div class="bg-jp-card p-4 rounded-2xl border border-jp-border shadow-sm flex flex-col md:flex-row gap-3 items-start md:items-center justify-between">
            <div class="flex items-center gap-3 w-full md:w-auto">
              <span class="bg-jp-accent text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center shrink-0">${i + 1}</span>
              <div class="flex-1">
                <div class="flex items-center gap-2">
                  <input type="text" value="${spot.name}" onchange="updateSpotName(${i}, this.value)" class="font-bold text-jp-dark text-sm bg-transparent border-b border-dashed border-jp-sand focus:outline-none focus:border-jp-accent px-1 py-0.5">
                  <button onclick="searchSpotLocation(${i})" class="text-[10px] bg-jp-accentLight text-jp-accent font-bold px-2 py-0.5 rounded-md">🔍 搜尋定位</button>
                </div>
                <div class="text-[10px] text-jp-dark/40 mt-1">📍 ${spot.city || '區域'} (${spot.lat ? spot.lat.toFixed(3) : 0}, ${spot.lng ? spot.lng.toFixed(3) : 0})</div>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto justify-between md:justify-end border-t md:border-t-0 pt-2 md:pt-0 border-jp-border">
              <div class="flex items-center gap-1 text-xs">
                <span class="text-jp-dark/50">到達:</span>
                <input type="time" value="${spot.arriveTime}" ${i !== 0 ? 'readonly class="bg-jp-bg cursor-not-allowed"' : ''} onchange="updateSpotTime(${i}, this.value)" class="font-bold border border-jp-border rounded-lg px-2 py-1 bg-jp-bg text-jp-dark">
              </div>

              <div class="flex items-center gap-1 text-xs">
                <span class="text-jp-dark/50">停留:</span>
                <input type="number" value="${spot.stayMins}" onchange="updateSpotStay(${i}, this.value)" class="w-14 border border-jp-border rounded-lg px-1.5 py-1 text-center bg-jp-bg">
                <span class="text-jp-dark/50">分</span>
              </div>

              <div class="flex items-center gap-1">
                <button onclick="moveSpot(${i}, -1)" ${i === 0 ? 'disabled class="opacity-30"' : ''} class="p-1 hover:bg-jp-bg rounded"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>
                <button onclick="moveSpot(${i}, 1)" ${i === day.spots.length - 1 ? 'disabled class="opacity-30"' : ''} class="p-1 hover:bg-jp-bg rounded"><i data-lucide="arrow-down" class="w-3.5 h-3.5"></i></button>
                <button onclick="removeSpot(${i})" class="text-jp-red p-1 hover:bg-rose-50 rounded"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
              </div>
            </div>
          </div>
        `;

        if (i < day.spots.length - 1) {
          const transit = day.transits[i] || { mode: 'transit', mins: 30, distKm: 5.0 };
          html += `
            <div class="flex items-center justify-center my-1">
              <div class="bg-jp-card border border-jp-border rounded-xl px-4 py-1.5 flex items-center gap-2.5 text-xs text-jp-dark/80 shadow-sm">
                <span class="font-bold text-jp-accent">➔ 交通段:</span>
                <select onchange="updateTransitMode(${i}, this.value)" class="bg-jp-bg border border-jp-border rounded-lg px-2 py-0.5 text-xs">
                  <option value="transit" ${transit.mode === 'transit' ? 'selected' : ''}>🚌 大眾運輸</option>
                  <option value="drive" ${transit.mode === 'drive' ? 'selected' : ''}>🚗 開車</option>
                  <option value="walk" ${transit.mode === 'walk' ? 'selected' : ''}>🚶 步行</option>
                  <option value="bike" ${transit.mode === 'bike' ? 'selected' : ''}>🚴 單車</option>
                </select>
                <span class="font-bold text-jp-dark">約 ${formatDuration(transit.mins)} (${transit.distKm} km)</span>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html;
      lucide.createIcons();
    }

    function addSpot() {
      const day = appData.days[appData.activeDayIndex];
      day.spots.push({
        id: Date.now().toString(),
        name: '新景點',
        lat: 35.681 + (Math.random() * 0.02 - 0.01),
        lng: 139.767 + (Math.random() * 0.02 - 0.01),
        arriveTime: '12:00',
        stayMins: 60,
        city: '東京'
      });
      recalculateTimes(appData.activeDayIndex);
      renderSpotsList();
      saveData();
    }

    function moveSpot(i, dir) {
      const spots = appData.days[appData.activeDayIndex].spots;
      if (i + dir < 0 || i + dir >= spots.length) return;
      const temp = spots[i];
      spots[i] = spots[i + dir];
      spots[i + dir] = temp;
      recalculateTimes(appData.activeDayIndex);
      renderSpotsList();
      saveData();
    }

    function removeSpot(i) {
      const day = appData.days[appData.activeDayIndex];
      day.spots.splice(i, 1);
      if (day.transits.length > i) day.transits.splice(i, 1);
      recalculateTimes(appData.activeDayIndex);
      renderSpotsList();
      saveData();
    }

    function updateSpotName(i, name) { appData.days[appData.activeDayIndex].spots[i].name = name; saveData(); }
    function updateSpotTime(i, val) { appData.days[appData.activeDayIndex].spots[i].arriveTime = val; recalculateTimes(appData.activeDayIndex); renderSpotsList(); saveData(); }
    function updateSpotStay(i, val) { appData.days[appData.activeDayIndex].spots[i].stayMins = parseInt(val) || 0; recalculateTimes(appData.activeDayIndex); renderSpotsList(); saveData(); }
    function updateTransitMode(i, mode) { appData.days[appData.activeDayIndex].transits[i].mode = mode; recalculateTimes(appData.activeDayIndex); renderSpotsList(); saveData(); }

    async function searchSpotLocation(i) {
      const spot = appData.days[appData.activeDayIndex].spots[i];
      const query = prompt("請輸入景點名稱定位:", spot.name);
      if (!query) return;

      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data && data.length > 0) {
          const result = data[0];
          spot.lat = parseFloat(result.lat);
          spot.lng = parseFloat(result.lon);
          spot.name = query;
          
          const addr = result.display_name || '';
          if (addr.includes('京都')) spot.city = '京都';
          else if (addr.includes('大阪')) spot.city = '大阪';
          else if (addr.includes('東京')) spot.city = '東京';

          recalculateTimes(appData.activeDayIndex);
          renderSpotsList();
          saveData();
          alert(`已成功定位: ${result.display_name}`);
        } else {
          alert("找不到該地點。");
        }
      } catch (e) {
        alert("搜尋失敗。");
      }
    }

    // --- ROUTE MAP (GOOGLE MAPS TILE LAYER) ---
    function initOrUpdateMap() {
      const container = document.getElementById('map-day-selector');
      container.innerHTML = appData.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        return `
          <button onclick="changeMapDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${
            idx === appData.mapDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'
          }">第 ${idx + 1} 天 (${info.shortDateStr || ''})</button>
        `;
      }).join('');

      setTimeout(() => {
        if (!map) {
          map = L.map('map').setView([35.681, 139.767], 11);
          // Reliable Google Maps Tile Layer
          L.tileLayer('https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            attribution: '© Google Maps'
          }).addTo(map);
        }
        map.invalidateSize();
        renderMapRoutes();
      }, 100);
    }

    function changeMapDay(idx) {
      appData.mapDayIndex = idx;
      initOrUpdateMap();
    }

    function renderMapRoutes() {
      if (!map) return;
      mapMarkers.forEach(m => map.removeLayer(m));
      if (mapPolyline) map.removeLayer(mapPolyline);
      mapMarkers = [];

      const day = appData.days[appData.mapDayIndex];
      if (!day || !day.spots.length) return;

      const latLngs = [];
      day.spots.forEach((spot, idx) => {
        const latLng = [spot.lat, spot.lng];
        latLngs.push(latLng);

        // High Contrast Red Pin Marker
        const customIcon = L.divIcon({
          className: 'jp-div-icon',
          html: `<div class="jp-map-marker">${idx + 1}</div>`,
          iconSize: [32, 32],
          iconAnchor: [16, 16]
        });

        const marker = L.marker(latLng, { icon: customIcon })
          .bindPopup(`<b>${idx + 1}. ${spot.name}</b><br>到達: ${spot.arriveTime} | 停留: ${spot.stayMins} 分`)
          .addTo(map);

        mapMarkers.push(marker);
      });

      if (latLngs.length > 1) {
        mapPolyline = L.polyline(latLngs, { color: '#e54d42', weight: 4, opacity: 0.9, dashArray: '6, 8' }).addTo(map);
        map.fitBounds(mapPolyline.getBounds(), { padding: [50, 50] });
      } else if (latLngs.length === 1) {
        map.setView(latLngs[0], 13);
      }
    }

    // --- CITY WEATHER TAB ---
    async function renderWeatherTab() {
      const daySelector = document.getElementById('weather-day-selector');
      daySelector.innerHTML = appData.days.map((day, idx) => {
        const info = getComputedDayDate(idx);
        return `
          <button onclick="changeWeatherDay(${idx})" class="px-2.5 py-1 text-xs rounded-lg border font-bold ${
            idx === appData.weatherDayIndex ? 'bg-jp-accent text-white border-jp-accent' : 'bg-jp-bg text-jp-dark/70 border-jp-border'
          }">第 ${idx + 1} 天 (${info.shortDateStr || ''})</button>
        `;
      }).join('');

      const container = document.getElementById('weather-cards-container');
      container.innerHTML = `<p class="text-jp-dark/40 text-xs col-span-2 py-4">載入最新氣象預報...</p>`;

      const day = appData.days[appData.weatherDayIndex];
      const dayDateInfo = getComputedDayDate(appData.weatherDayIndex);
      const citiesMap = {};

      day.spots.forEach(spot => {
        const city = spot.city || '東京';
        if (!citiesMap[city]) {
          citiesMap[city] = { lat: spot.lat, lng: spot.lng };
        }
      });

      let html = '';
      for (const [cityName, coords] of Object.entries(citiesMap)) {
        try {
          const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lng}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto`);
          const data = await res.json();
          
          const maxTemp = data.daily.temperature_2m_max[0];
          const minTemp = data.daily.temperature_2m_min[0];
          const rainProb = data.daily.precipitation_probability_max[0];

          html += `
            <div class="bg-jp-card p-5 rounded-2xl border border-jp-border shadow-sm flex flex-col justify-between space-y-4">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] bg-jp-accentLight text-jp-accent font-bold px-2 py-0.5 rounded-md">
                    ${dayDateInfo.dateStr || ''} (${dayDateInfo.weekdayStr || ''})
                  </span>
                  <h3 class="text-lg font-bold text-jp-dark mt-1">${cityName}</h3>
                </div>
                <span class="text-3xl">🌤️</span>
              </div>

              <div class="grid grid-cols-3 gap-2 bg-jp-bg p-3 rounded-xl text-center text-xs">
                <div>
                  <div class="text-[10px] text-jp-dark/40">最高溫</div>
                  <div class="text-sm font-bold text-jp-red">${maxTemp}°C</div>
                </div>
                <div>
                  <div class="text-[10px] text-jp-dark/40">最低溫</div>
                  <div class="text-sm font-bold text-blue-600">${minTemp}°C</div>
                </div>
                <div>
                  <div class="text-[10px] text-jp-dark/40">降雨率</div>
                  <div class="text-sm font-bold text-jp-accent">${rainProb}%</div>
                </div>
              </div>

              <div class="text-xs text-jp-dark/80 bg-amber-50/80 border border-amber-100 p-3 rounded-xl flex items-start gap-2">
                <span>💡</span>
                <span><strong>日系穿搭建議:</strong> ${minTemp < 15 ? '氣溫稍涼，建議採用多層次疊穿搭風衣。' : '天氣舒適，薄長袖搭外套即可。'} ${rainProb > 30 ? '雨氣偏高，出門請隨身攜帶折傘。' : ''}</span>
              </div>
            </div>
          `;
        } catch (e) {
          html += `<div class="bg-jp-card p-4 rounded-2xl border border-jp-border">無法載入 ${cityName} 天氣。</div>`;
        }
      }

      container.innerHTML = html;
    }

    function changeWeatherDay(idx) {
      appData.weatherDayIndex = idx;
      renderWeatherTab();
    }

    // --- 1-ON-1 PAIRWISE SPLIT ---
    function renderSplitTab() {
      const chipContainer = document.getElementById('members-chip-container');
      chipContainer.innerHTML = appData.members.map(m => `
        <span class="bg-jp-accentLight text-jp-accent px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
          ${m}
          <button onclick="removeMember('${m}')" class="text-jp-accent/50 hover:text-jp-accent">×</button>
        </span>
      `).join('');
      document.getElementById('member-count-badge').textContent = `${appData.members.length} 人`;

      const payerSelect = document.getElementById('exp-payer');
      payerSelect.innerHTML = appData.members.map(m => `<option value="${m}">${m}</option>`).join('');

      const partCheckboxes = document.getElementById('exp-participants-checkboxes');
      partCheckboxes.innerHTML = appData.members.map(m => `
        <label class="flex items-center gap-1 cursor-pointer">
          <input type="checkbox" value="${m}" checked class="part-check rounded text-jp-accent">
          <span>${m}</span>
        </label>
      `).join('');

      renderExpensesList();
      calculatePairwiseSettlement();
    }

    function addMember() {
      const input = document.getElementById('new-member-name');
      const name = input.value.trim();
      if (name && !appData.members.includes(name)) {
        appData.members.push(name);
        input.value = '';
        renderSplitTab();
        saveData();
      }
    }

    function removeMember(name) {
      appData.members = appData.members.filter(m => m !== name);
      renderSplitTab();
      saveData();
    }

    function updateExchangeRateField() {
      const curr = document.getElementById('exp-currency').value;
      const rates = { TWD: 1.0, JPY: 0.21, USD: 32.0, EUR: 34.5, KRW: 0.024 };
      document.getElementById('exp-rate').value = rates[curr] || 1.0;
    }

    async function fetchLiveRate() {
      const curr = document.getElementById('exp-currency').value;
      if (curr === 'TWD') { document.getElementById('exp-rate').value = 1.0; return; }
      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${curr}`);
        const data = await res.json();
        if (data && data.rates && data.rates.TWD) {
          document.getElementById('exp-rate').value = data.rates.TWD.toFixed(4);
          alert(`已獲取最新匯率: 1 ${curr} = ${data.rates.TWD.toFixed(4)} TWD`);
        }
      } catch (e) {
        alert("使用預設參考匯率。");
      }
    }

    function addExpense() {
      const title = document.getElementById('exp-title').value.trim();
      const payer = document.getElementById('exp-payer').value;
      const amount = parseFloat(document.getElementById('exp-amount').value);
      const currency = document.getElementById('exp-currency').value;
      const rate = parseFloat(document.getElementById('exp-rate').value) || 1.0;
      const checkedParts = Array.from(document.querySelectorAll('.part-check:checked')).map(cb => cb.value);

      if (!title || isNaN(amount) || amount <= 0 || checkedParts.length === 0) {
        alert("請完整輸入消費項目、金額與參與成員。");
        return;
      }

      const amountTwd = Math.round(amount * rate);
      appData.expenses.push({
        id: Date.now().toString(),
        title, payer, amount, currency, rate, amountTwd,
        participants: checkedParts
      });

      document.getElementById('exp-title').value = '';
      document.getElementById('exp-amount').value = '';
      renderSplitTab();
      saveData();
    }

    function removeExpense(id) {
      appData.expenses = appData.expenses.filter(e => e.id !== id);
      renderSplitTab();
      saveData();
    }

    function renderExpensesList() {
      const container = document.getElementById('expenses-list');
      if (!appData.expenses.length) {
        container.innerHTML = `<p class="text-xs text-jp-dark/40 py-4 text-center">尚無消費記錄。</p>`;
        return;
      }

      container.innerHTML = appData.expenses.map(e => `
        <div class="bg-jp-bg p-2.5 rounded-xl border border-jp-border text-xs flex items-center justify-between">
          <div>
            <div class="font-bold text-jp-dark">${e.title}</div>
            <div class="text-jp-dark/60 mt-0.5">
              ${e.payer} 付 <strong>${e.amount} ${e.currency}</strong> 
              ${e.currency !== 'TWD' ? `(折合 NT$ ${e.amountTwd})` : ''}
            </div>
            <div class="text-[10px] text-jp-dark/40">平分: ${e.participants.join(', ')}</div>
          </div>
          <button onclick="removeExpense('${e.id}')" class="text-jp-red p-1"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function calculatePairwiseSettlement() {
      const matrix = {};
      appData.members.forEach(m1 => {
        matrix[m1] = {};
        appData.members.forEach(m2 => { matrix[m1][m2] = 0; });
      });

      appData.expenses.forEach(exp => {
        const payer = exp.payer;
        const parts = exp.participants;
        if (!parts.length) return;
        
        const shareTwd = exp.amountTwd / parts.length;
        parts.forEach(p => {
          if (p !== payer) {
            matrix[p][payer] += shareTwd;
          }
        });
      });

      const container = document.getElementById('settlement-results');
      let html = '';

      appData.members.forEach((m1, i) => {
        appData.members.forEach((m2, j) => {
          if (i < j) {
            const m1OwesM2 = matrix[m1][m2];
            const m2OwesM1 = matrix[m2][m1];
            const net = m1OwesM2 - m2OwesM1;

            if (Math.abs(net) > 1) {
              if (net > 0) {
                html += `
                  <div class="bg-jp-accentLight border border-jp-accent/20 p-3 rounded-xl text-xs flex justify-between items-center">
                    <div><span class="font-bold text-jp-dark">${m1}</span> 應直接轉帳給 <span class="font-bold text-jp-accent">${m2}</span></div>
                    <span class="text-sm font-extrabold text-jp-accent">NT$ ${Math.round(net)}</span>
                  </div>
                `;
              } else {
                html += `
                  <div class="bg-jp-accentLight border border-jp-accent/20 p-3 rounded-xl text-xs flex justify-between items-center">
                    <div><span class="font-bold text-jp-dark">${m2}</span> 應直接轉帳給 <span class="font-bold text-jp-accent">${m1}</span></div>
                    <span class="text-sm font-extrabold text-jp-accent">NT$ ${Math.round(-net)}</span>
                  </div>
                `;
              }
            }
          }
        });
      });

      if (!html) {
        html = `<p class="text-xs text-jp-dark/40 py-4 text-center">目前結算為 0，無人需轉帳。</p>`;
      }

      container.innerHTML = html;
    }
  </script>
</body>
</html>
