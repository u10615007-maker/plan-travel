<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>旅行小助手</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Leaflet.js CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- SortableJS (電腦與手機拖曳支援) -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- LZ-String for data compression -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            jp: {
              bg: '#fbf9f5',
              card: '#ffffff',
              border: '#efebe4',
              accent: '#6e8b74',
              accentLight: '#f0f4f1',
              red: '#e54d42',
              sand: '#d8cfc4',
              dark: '#2c3531'
            }
          },
          fontFamily: {
            sans: ['"Noto Sans JP"', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body { background-color: #fbf9f5; color: #2c3531; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #fbf9f5; }
    ::-webkit-scrollbar-thumb { background: #d8cfc4; border-radius: 4px; }
    #map { height: calc(100vh - 200px); min-height: 420px; width: 100%; border-radius: 12px; }

    .jp-map-marker {
      background-color: #e54d42;
      color: white;
      border: 3px solid #ffffff;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(229, 77, 66, 0.4), 0 2px 4px rgba(0,0,0,0.3);
      position: relative;
    }

    .drag-handle {
      touch-action: none;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .sortable-ghost {
      opacity: 0.3 !important;
      background-color: #f0f4f1 !important;
      border: 2px dashed #6e8b74 !important;
    }
    .sortable-drag {
      opacity: 0.9 !important;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15) !important;
    }

    @media print {
      header, button, nav, input[type="file"], .no-print { display: none !important; }
      body { background-color: white !important; font-size: 12pt; }
      .tab-content { display: block !important; }
      #tab-map, #tab-weather, #tab-split { page-break-before: always; }
      .bg-jp-card { border: 1px solid #ccc !important; box-shadow: none !important; }
    }
  </style>
</head>
<body class="font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-jp-card border-b border-jp-border sticky top-0 z-50 shadow-sm no-print">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-2">
        <button onclick="openIconModal()" class="text-2xl p-1 hover:bg-jp-bg rounded-lg border border-transparent hover:border-jp-border transition" title="點擊更換圖示">
          <span id="trip-icon-display">⛩️</span>
        </button>
        <input type="text" id="trip-title-input" value="台灣環島與自由行輕旅行" onchange="updateTripTitle(this.value)" class="text-lg font-bold text-jp-dark bg-transparent border-b border-transparent hover:border-jp-sand focus:border-jp-accent focus:outline-none px-1 py-0.5 transition">
      </div>
      
      <!-- Action Buttons -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="copyShareableLink()" id="share-btn" class="text-xs bg-jp-accent hover:bg-jp-accent/90 text-white font-bold px-3 py-1.5 rounded-lg border border-jp-accent shadow-sm flex items-center gap-1 transition">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i> 產生並複製極短連結
        </button>
        <button onclick="exportPDF()" class="text-xs bg-jp-bg hover:bg-jp-border text-jp-dark font-bold px-2.5 py-1.5 rounded-lg border border-jp-border flex items-center gap-1 transition">
          <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 匯出 PDF
        </button>

        <nav class="flex bg-jp-bg p-1 rounded-xl border border-jp-border text-xs font-medium ml-1">
          <button id="tab-itinerary-btn" onclick="switchTab('itinerary')" class="px-3 py-1.5 rounded-lg transition-all bg-jp-accent text-white shadow-sm font-bold">
            📅 行程規劃
          </button>
          <button id="tab-map-btn" onclick="switchTab('map')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">
            🗺️ 路線地圖
          </button>
          <button id="tab-weather-btn" onclick="switchTab('weather')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">
            🌤️ 城市天氣
          </button>
          <button id="tab-split-btn" onclick="switchTab('split')" class="px-3 py-1.5 rounded-lg transition-all text-jp-dark/70 hover:text-jp-dark font-medium">
            💴 1對1分帳
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full">

    <!-- 1. ITINERARY TAB -->
    <section id="tab-itinerary" class="tab-content space-y-5">
      <div class="flex flex-wrap items-center justify-between gap-3 bg-jp-card p-3.5 rounded-2xl border border-jp-border shadow-sm no-print">
        <div class="flex items-center gap-2 overflow-x-auto pb-1 max-w-full" id="day-selector-container"></div>
        <button onclick="addDay()" class="flex items-center gap-1 text-xs bg-jp-accentLight text-jp-accent hover:bg-jp-accent/20 px-3 py-1.5 rounded-xl font-bold transition">
          <i data-lucide="plus" class="w-3.5 h-3.5"></i> 新增天數
        </button>
      </div>

      <!-- Active Day Banner -->
      <div class="bg-jp-card border border-jp-border p-4 rounded-2xl flex flex-wrap justify-between items-center gap-3 shadow-sm">
        <div>
          <h2 class="text-base font-bold text-jp-dark flex items-center gap-2">
            <span id="current-day-title">第 1 天</span>
            <input type="date" id="start-date-picker" class="text-xs bg-jp-bg border border-jp-border rounded-lg px-2.5 py-1 text-jp-dark focus:outline-none" onchange="updateStartDate(this.value)">
            <span id="current-day-weekday" class="text-xs font-normal bg-jp-accentLight text-jp-accent px-2 py-0.5 rounded-md"></span>
          </h2>
          <p class="text-[10px] text-jp-dark/40 mt-1">提示：可點擊左側「▲/▼」按鈕上下調整順序，或按住「⋮⋮」握把拖曳排序。</p>
        </div>
        <button onclick="addSpot()" class="bg-jp-accent hover:bg-jp-accent/90 text-white px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm transition no-print">
          <i data-lucide="plus-circle" class="w-4 h-4"></i> 新增景點
        </button>
      </div>

      <!-- Spots List -->
      <div id="spots-list" class="space-y-4"></div>
    </section>

    <!-- 2. ROUTE MAP TAB -->
    <section id="tab-map" class="tab-content hidden space-y-4">
      <div class="bg-jp-card p-3.5 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm no-print">
        <div>
          <h2 class="text-sm font-bold text-jp-dark">🗺️ 每日路線視圖</h2>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto" id="map-day-selector"></div>
      </div>

      <div class="bg-jp-card p-2 rounded-2xl border border-jp-border shadow-sm overflow-hidden">
        <div id="map"></div>
      </div>
    </section>

    <!-- 3. CITY WEATHER TAB -->
    <section id="tab-weather" class="tab-content hidden space-y-5">
      <div class="bg-jp-card p-4 rounded-2xl border border-jp-border flex flex-wrap justify-between items-center gap-3 shadow-sm no-print">
        <div>
          <h2 class="text-sm font-bold text-jp-dark">🌤️ 全球官方測站天氣預報</h2>
        </div>
        <div class="flex items-center gap-2 overflow-x-auto" id="weather-day-selector"></div>
      </div>

      <div id="weather-cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- 4. 1-ON-1 SPLIT EXPENSE TAB -->
    <section id="tab-split" class="tab-content hidden space-y-5">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <!-- Members -->
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-1 space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs flex items-center justify-between">
            <span>👥 出遊成員</span>
            <span class="text-xs font-normal text-jp-dark/50" id="member-count-badge">0 人</span>
          </h3>
          <div class="flex gap-2 no-print">
            <input type="text" id="new-member-name" placeholder="姓名..." class="flex-1 text-xs border border-jp-border rounded-xl px-3 py-2 bg-jp-bg focus:outline-none">
            <button onclick="addMember()" class="bg-jp-accent text-white px-3 py-2 rounded-xl text-xs hover:bg-jp-accent/90 transition font-bold">新增</button>
          </div>
          <div id="members-chip-container" class="flex flex-wrap gap-1.5 pt-1"></div>
        </div>

        <!-- Add Expense -->
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border md:col-span-2 space-y-3 shadow-sm no-print">
          <h3 class="font-bold text-jp-dark text-xs">➕ 新增記帳</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block text-jp-dark/70 mb-1">消費項目</label>
              <input type="text" id="exp-title" placeholder="例如：火車車票" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">先付代墊人</label>
              <select id="exp-payer" class="w-full border border-jp-border rounded-xl px-3 py-2 bg-jp-bg"></select>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">金額與幣種</label>
              <div class="flex gap-1">
                <input type="number" id="exp-amount" placeholder="0" class="w-1/2 border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
                <select id="exp-currency" onchange="updateExchangeRateField()" class="w-1/2 border border-jp-border rounded-xl px-1 py-2 bg-jp-bg text-xs">
                  <option value="TWD">TWD (新台幣)</option>
                  <option value="JPY">JPY (日圓)</option>
                  <option value="USD">USD (美元)</option>
                  <option value="EUR">EUR (歐元)</option>
                  <option value="KRW">KRW (韓元)</option>
                  <option value="GBP">GBP (英鎊)</option>
                  <option value="THB">THB (泰銖)</option>
                  <option value="SGD">SGD (新加坡幣)</option>
                  <option value="HKD">HKD (港幣)</option>
                  <option value="AUD">AUD (澳幣)</option>
                </select>
              </div>
            </div>
            <div>
              <label class="block text-jp-dark/70 mb-1">換算匯率 (1 外幣 = ? TWD)</label>
              <div class="flex gap-1">
                <input type="number" step="0.0001" id="exp-rate" value="1.0" class="flex-1 border border-jp-border rounded-xl px-3 py-2 bg-jp-bg">
                <button onclick="fetchLiveRate()" class="text-xs bg-jp-accentLight text-jp-accent px-2.5 rounded-xl font-bold">⚡ 最新</button>
              </div>
            </div>
          </div>

          <div>
            <label class="block text-xs text-jp-dark/70 mb-1">分攤成員</label>
            <div id="exp-participants-checkboxes" class="flex flex-wrap gap-3 pt-1 text-xs"></div>
          </div>

          <button onclick="addExpense()" class="w-full bg-jp-accent hover:bg-jp-accent/90 text-white font-bold py-2.5 rounded-xl text-xs transition shadow-sm">
            儲存該筆消費
          </button>
        </div>
      </div>

      <!-- Log & Pairwise Result -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <h3 class="font-bold text-jp-dark text-xs">📜 明細記錄</h3>
          <div id="expenses-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></div>
        </div>

        <div class="bg-jp-card p-4 rounded-2xl border border-jp-border space-y-3 shadow-sm">
          <div class="flex items-center justify-between">
            <h3 class="font-bold text-jp-dark text-xs">🤝 1 對 1 精準對拆結算結果</h3>
            <span class="text-[10px] bg-jp-accentLight text-jp-accent px-2 py-0.5 rounded-md font-bold">直觀 1 對 1 轉帳</span>
          </div>
          <div id="settlement-results" class="space-y-2 pt-1"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ICON PICKER MODAL -->
  <div id="icon-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4">
    <div class="bg-jp-card border border-jp-border rounded-2xl p-5 max-w-xs w-full shadow-xl space-y-4 text-center">
      <h3 class="font-bold text-jp-dark text-sm">選擇行程封面圖示</h3>
      <div class="grid grid-cols-4 gap-3 text-2xl" id="icon-options-grid"></div>
      <button onclick="closeIconModal()" class="w-full bg-jp-bg hover:bg-jp-border text-jp-dark text-xs font-bold py-2 rounded-xl border border-jp-border">取消</button>
    </div>
  </div>

  <script>
    const DEFAULT_APP_DATA = {
      tripTitle: '台灣環島與自由行輕旅行',
      tripIcon: '⛩️',
      activeTab: 'itinerary',
      activeDayIndex: 0,
      mapDayIndex: 0,
      weatherDayIndex: 0,
      days: [
        {
          spots: [
            { id: '1', name: '烏日車站', lat: 24.108, lng: 120.624, arriveTime: '09:00', stayMins: 60, city: '臺中市, 臺灣' },
            { id: '2', name: '西門町商圈', lat: 25.042, lng: 121.508, arriveTime: '11:15', stayMins: 120, city: '臺北市, 臺灣' }
          ],
          transits: [
            { mode: 'mrt', mins: 75, distKm: 160.0, notes: '從【烏日車站】前往【西門町商圈】' }
          ]
        }
      ],
      startDate: '2026-11-01',
      members: ['小明', '小華', '阿強'],
      expenses: [
        { id: 'e1', title: '高鐵車票', payer: '小明', amount: 700, currency: 'TWD', rate: 1.0, amountTwd: 700, participants: ['小明', '小華', '阿強'] }
      ]
    };

    let appData = JSON.parse(JSON.stringify(DEFAULT_APP_DATA));

    const WEEKDAYS = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
    const ICONS = ['⛩️', '✈️', '🗼', '🌸', '🗻', '🍵', '🚄', '🍣', '🍱', '🧋', '🏮', '🏖️', '🗽', '🏰', '🎡'];
    const CURRENCY_LABELS = {
      TWD: 'TWD (新台幣)',
      JPY: 'JPY (日圓)',
      USD: 'USD (美元)',
      EUR: 'EUR (歐元)',
      KRW: 'KRW (韓元)',
      GBP: 'GBP (英鎊)',
      THB: 'THB (泰銖)',
      SGD: 'SGD (新加坡幣)',
      HKD: 'HKD (港幣)',
      AUD: 'AUD (澳幣)'
    };

    let map = null;
    let mapMarkers = [];
    let mapPolyline = null;
    let searchDebounceTimers = {};
    let sortableInstance = null;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const sharedData = urlParams.get('data');
      if (sharedData) {
        try {
          const decompressed = LZString.decompressFromEncodedURIComponent(sharedData);
          if (decompressed) {
            const parsed = JSON.parse(decompressed);
            if (parsed && parsed.days && parsed.days.length > 0) {
              appData = parsed;
            }
          }
        } catch (e) {
          loadData();
        }
      } else {
        loadData();
      }

      if (!appData.days || !Array.isArray(appData.days) || appData.days.length === 0) {
        appData.days = DEFAULT_APP_DATA.days;
      }
      if (!appData.startDate) {
        appData.startDate = DEFAULT_APP_DATA.startDate;
      }

      recalculateTimes(appData.activeDayIndex);
      renderAll();
      lucide.createIcons();
    });

    function saveData() {
      localStorage.setItem('global_travel_app_v28', JSON.stringify(appData));
    }

    function loadData() {
      const saved = localStorage.getItem('global_travel_app_v28');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && parsed.days && parsed.days.length > 0) {
            appData = parsed;
            return;
          }
        } catch (e) { console.error(e); }
      }
      appData = JSON.parse(JSON.stringify(DEFAULT_APP_DATA));
    }

    function exportPDF() { window.print(); }

    // --- AUTOMATED SHORTENER (TINYURL API) ---
    async function copyShareableLink() {
      const btn = document.getElementById('share-btn');
      const originalText = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> 正在縮短網址...`;
      lucide.createIcons();
      btn.disabled = true;

      try {
        const jsonString = JSON.stringify(appData);
        const compressed = LZString.compressToEncodedURIComponent(jsonString);
        const baseUrl = window.location.origin + window.location.pathname;
        const longUrl = `${baseUrl}?data=${compressed}`;

        const apiResponse = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
        const shortUrl = await apiResponse.text();

        if (shortUrl && shortUrl.startsWith('http')) {
          await navigator.clipboard.writeText(shortUrl);
          alert(`極短網址已自動產生並複製成功！\n\n${shortUrl}`);
        } else {
          throw new Error('API 回應異常');
        }
      } catch (e) {
        const jsonString = JSON.stringify(appData);
        const compressed = LZString.compressToEncodedURIComponent(jsonString);
        const fallbackUrl = `${window.location.origin + window.location.pathname}?data=${compressed}`;
        await navigator.clipboard.writeText(fallbackUrl);
        alert("已成功複製壓縮分享連結！");
      } finally {
        btn.innerHTML = originalText;
        btn.disabled = false;
        lucide.createIcons();
      }
    }

    function updateTripTitle(val) { appData.tripTitle = val; saveData(); }

    function openIconModal() {
      const grid = document.getElementById('icon-options-grid');
      grid.innerHTML = ICONS.map(icon => `
        <button onclick="selectTripIcon('${icon}')" class="p-2 hover:bg-jp-accentLight rounded-xl border border-jp-border text-center transition">${icon}</button>
      `).join('');
      document.getElementById('icon-modal').classList.remove('hidden');
    }
    function closeIconModal() { document.getElementById('icon-modal').classList.add('hidden'); }
    function selectTripIcon(icon) {
      appData.tripIcon = icon;
      document.getElementById('trip-icon-display').textContent = icon;
      closeIconModal();
      saveData();
    }

    function getComputedDayDate(dayIdx) {
      if (!appData.startDate) return { dateStr: '', weekdayStr: '' };
      const start = new Date(appData.startDate);
      start.setDate(start.getDate() + dayIdx);
      
      const year = start.getFullYear();
      const month = String(start.getMonth() + 1).padStart(2, '0');
      const date = String(start.getDate()).padStart(2, '0');
      const weekday = WEEKDAYS[start.getDay()];

      return {
        dateStr: `${year}-${month}-${date}`,
        shortDateStr: `${month}/${date}`,
        weekdayStr: weekday || ''
      };
    }

    function updateStartDate(val) { appData.startDate = val; renderDaySelector(); saveData(); }

    function formatDuration(mins) {
      if (!mins || mins <= 0) return '0 分鐘';
      if (mins < 60) return `${mins} 分鐘`;
      const hours = Math.floor(mins / 60);
      const remainingMins = mins % 60;
      return remainingMins > 0 ? `${hours} 小時 ${remainingMins} 分鐘` : `${hours} 小時`;
    }

    function generateSmartTransitNote(spotA, spotB, mode, distKm) {
      const nameA = spotA.name || '出發地';
      const nameB = spotB.name || '目的地';

      if (mode === 'mrt') {
        return `從【${nameA}】搭乘捷運/地鐵前往【${nameB}】`;
      } else if (mode === 'bus') {
        return `從【${nameA}】搭乘公車前往【${nameB}】`;
      } else if (mode === 'thsr') {
        return `從【${nameA}】前往高鐵站搭乘高鐵至【${nameB}】`;
      } else if (mode === 'train') {
        return `從【${nameA}】搭乘火車前往【${nameB}】`;
      } else if (mode === 'coach') {
        return `從【${nameA}】搭乘客運前往【${nameB}】`;
      } else if (mode === 'scooter') {
        return `從【${nameA}】騎乘機車前往【${nameB}】（約 ${distKm} km）`;
      } else if (mode === 'drive') {
        return `從【${nameA}】開車直達【${nameB}】`;
      } else if (mode === 'walk') {
        return `從【${nameA}】步行至【${nameB}】（約 ${distKm} km）`;
      } else if (mode === 'bike') {

    function recalculateTimes(dayIdx) {
      const day = appData.days[dayIdx];
      if (!day || !day.spots || !day.spots.length) return;

      if (!day.transits) day.transits = [];

      for (let i = 0; i < day.spots.length - 1; i++) {
        const spotA = day.spots[i];
        const spotB = day.spots[i + 1];

        const dist = calcDistance(spotA.lat, spotA.lng, spotB.lat, spotB.lng);
        const distKm = parseFloat(dist.toFixed(1));

        if (!day.transits[i]) {
          day.transits[i] = { mode: 'mrt', mins: 30, distKm: distKm, notes: '' };
        } else {
          day.transits[i].distKm = distKm;
        }

        if (!day.transits[i].notes) {
          day.transits[i].notes = generateSmartTransitNote(spotA, spotB, day.transits[i].mode, distKm);
        }

        day.transits[i].mins = estimateTransitTime(distKm, day.transits[i].mode);

        const [h, m] = (spotA.arriveTime || '09:00').split(':').map(Number);
        const totalStartMins = h * 60 + m;
        const totalNextArriveMins = totalStartMins + parseInt(spotA.stayMins || 0) + day.transits[i].mins;

        const nextH = Math.floor(totalNextArriveMins / 60) % 24;
        const nextM = totalNextArriveMins % 60;
        spotB.arriveTime = `${String(nextH).padStart(2, '0')}:${String(nextM).padStart(2, '0')}`;
      }
    }

    function calcDistance(lat1, lon1, lat2, lon2) {
      if (!lat1 || !lon1 || !lat2 || !lon2) return 5.0;
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function estimateTransitTime(distKm, mode) {
      let speed = 28;
      if (mode === 'walk') speed = 4.5;
      if (mode === 'mrt') speed = 32;
      if (mode === 'bus') speed = 20;
      if (mode === 'thsr') speed = 220;
      if (mode === 'train') speed = 70;
      if (mode === 'coach') speed = 60;
      if (mode === 'scooter') speed = 35;
      if (mode === 'drive') speed = 40;
      if (mode === 'bike') speed = 15;
      
      const mins = Math.round((distKm / speed) * 60) + 5;
      return Math.max(mins, 5);
    }

    function initSortable() {
      const container = document.getElementById('spots-list');
      if (!container) return;

      if (sortableInstance) {
        sortableInstance.destroy();
      }

      sortableInstance = new Sortable(container, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'sortable-ghost',
        dragClass: 'sortable-drag',
        onEnd: function (evt) {
          const oldIndex = evt.oldIndex;
          const newIndex = evt.newIndex;

          if (oldIndex === newIndex) return;

          const day = appData.days[appData.activeDayIndex];
          const movedSpot = day.spots.splice(oldIndex, 1)[0];
          day.spots.splice(newIndex, 0, movedSpot);

          day.transits = [];
          recalculateTimes(appData.activeDayIndex);
          renderSpotsList();
          saveData();
        }
      });
    }

    function moveSpot(index, direction) {
      const day = appData.days[appData.activeDayIndex];
      const targetIndex = index + direction;

      if (targetIndex < 0 || targetIndex >= day.spots.length) return;

      const temp = day.spots[index];
      day.spots[index] = day.spots[targetIndex];
      day.spots[targetIndex] = temp;

      day.transits = [];
      recalculateTimes(appData.activeDayIndex);
      renderSpotsList();
      saveData();
    }

    function onSpotNameInput(i, query) {
      appData.days[appData.activeDayIndex].spots[i].name = query;

      const dropdown = document.getElementById(`autocomplete-dropdown-${i}`);
      if (!query || query.trim().length < 1) {
        if (dropdown) dropdown.classList.add('hidden');
        return;
      }

      if (searchDebounceTimers[i]) clearTimeout(searchDebounceTimers[i]);
      searchDebounceTimers[i] = setTimeout(async () => {
        try {
          const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&accept-language=zh-TW,ja,en&q=${encodeURIComponent(query)}`);
          let data = await res.json();

          if (!data || data.length === 0) {
            const photonRes = await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(query)}&limit=5`);
            const photonData = await photonRes.json();
            if (photonData && photonData.features) {
              data = photonData.features.map(f => ({
                display_name: `${f.properties.name || ''}, ${f.properties.city || f.properties.district || ''}, ${f.properties.country || ''}`,
                lat: f.geometry.coordinates[1],
                lon: f.geometry.coordinates[0],
                address: { city: f.properties.city || f.properties.district, country: f.properties.country }
              }));
            }
          }

          if (data && data.length > 0) {
            const cleanQuery = query.trim().toLowerCase();
            data.sort((a, b) => {
              const nameA = a.display_name.split(',')[0].trim().toLowerCase();
              const nameB = b.display_name.split(',')[0].trim().toLowerCase();
              if (nameA === cleanQuery) return -1;
              if (nameB === cleanQuery) return 1;
              return 0;
            });
          }
          
          if (data && data.length > 0 && dropdown) {
            dropdown.innerHTML = data.slice(0, 5).map((item, cacheIdx) => {
              const mainName = item.display_name.split(',')[0];
              const addrDetails = item.display_name;
              return `
                <div onclick="selectInlineAutocomplete(${i}, ${cacheIdx})" class="p-2.5 hover:bg-jp-accentLight cursor-pointer transition flex items-start gap-2">

                  </div>
                </div>
              `;
            }).join('');
            
            window[`inlineSearchResults_${i}`] = data.slice(0, 5);
            dropdown.classList.remove('hidden');
          } else if (dropdown) {
            dropdown.classList.add('hidden');
          }
        } catch (e) {
          if (dropdown) dropdown.classList.add('hidden');
        }
      }, 300);
    }

      spot.name = selected.display_name.split(',')[0];
      spot.lat = parseFloat(selected.lat);
      spot.lng = parseFloat(selected.lon);

      const addr = selected.address || {};
      const cityName = addr.city || addr.town || addr.village || addr.suburb || addr.city_district || addr.county || addr.state || '精選城市';
      const countryName = addr.country || '';

      spot.city = countryName ? `${cityName}, ${countryName}` : cityName;

      day.transits = [];
      recalculateTimes(appData.activeDayIndex);
      renderSpotsList();
      saveData();

        mapPolyline = L.polyline(latLngs, { color: '#e54d42', weight: 4, opacity: 0.9, dashArray: '6, 8' }).addTo(map);

                <div>
                  <div class="text-[10px] text-jp-dark/40">最低溫</div>
                  <div class="text-sm font-bold text-blue-600">${minTemp}°C</div>
                </div>
                <div>
                  <div class="text-[10px] text-jp-dark/40">降雨率</div>
                  <div class="text-sm font-bold text-jp-accent">${rainProb}%</div>
                </div>
              </div>

              <div class="text-xs text-jp-dark/80 bg-amber-50/80 border border-amber-100 p-3 rounded-xl flex items-start gap-2">
                <span>💡</span>
                <span><strong>穿搭建議:</strong> ${minTemp < 18 ? '氣溫稍涼，建議攜帶薄外套。' : '氣溫宜人，著輕便短袖即可。'} ${rainProb > 30 ? '降雨機率高，出門請攜帶隨身傘。' : ''}</span>
              </div>
            </div>
          `;
        } catch (e) {
          html += `<div class="bg-jp-card p-4 rounded-2xl border border-jp-border text-xs">無法獲取 ${cityName} 天氣。</div>`;
        }
      }

      container.innerHTML = html;
    }

    function changeWeatherDay(idx) {
      appData.weatherDayIndex = idx;
      renderWeatherTab();
    }

    // --- 1-ON-1 SPLIT ---
    function renderSplitTab() {
      const chipContainer = document.getElementById('members-chip-container');
      if (chipContainer) {
        chipContainer.innerHTML = appData.members.map(m => `
          <span class="bg-jp-accentLight text-jp-accent px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
            ${m}
            <button onclick="removeMember('${m}')" class="text-jp-accent/50 hover:text-jp-accent no-print">×</button>
          </span>
        `).join('');
      }
      
      const memberBadge = document.getElementById('member-count-badge');
      if (memberBadge) memberBadge.textContent = `${appData.members.length} 人`;

      const payerSelect = document.getElementById('exp-payer');
      if (payerSelect) payerSelect.innerHTML = appData.members.map(m => `<option value="${m}">${m}</option>`).join('');

      const partCheckboxes = document.getElementById('exp-participants-checkboxes');
      if (partCheckboxes) {
        partCheckboxes.innerHTML = appData.members.map(m => `
          <label class="flex items-center gap-1 cursor-pointer">
            <input type="checkbox" value="${m}" checked class="part-check rounded text-jp-accent">
            <span>${m}</span>
          </label>
        `).join('');
      }

      renderExpensesList();
      calculatePairwiseSettlement();
    }

    function addMember() {
      const input = document.getElementById('new-member-name');
      if (!input) return;
      const name = input.value.trim();
      if (name && !appData.members.includes(name)) {
        appData.members.push(name);
        input.value = '';
        renderSplitTab();
        saveData();
      }
    }

    function removeMember(name) {
      appData.members = appData.members.filter(m => m !== name);
      renderSplitTab();
      saveData();
    }

    function updateExchangeRateField() {
      const curr = document.getElementById('exp-currency').value;
      const rates = { TWD: 1.0, JPY: 0.21, USD: 32.0, EUR: 34.5, KRW: 0.024, GBP: 41.5, THB: 0.88, SGD: 24.0, HKD: 4.1, AUD: 21.5 };
      const rateInput = document.getElementById('exp-rate');
      if (rateInput) rateInput.value = rates[curr] || 1.0;
    }

    async function fetchLiveRate() {
      const curr = document.getElementById('exp-currency').value;
      if (curr === 'TWD') { 
        const rateInput = document.getElementById('exp-rate');
        if (rateInput) rateInput.value = 1.0; 
        return; 
      }
      try {
        const res = await fetch(`https://open.er-api.com/v6/latest/${curr}`);
        const data = await res.json();
        if (data && data.rates && data.rates.TWD) {
          const rateInput = document.getElementById('exp-rate');
          if (rateInput) rateInput.value = data.rates.TWD.toFixed(4);
          alert(`已獲取最新匯率: 1 ${curr} = ${data.rates.TWD.toFixed(4)} TWD`);
        }
      } catch (e) {
        alert("套用預設匯率。");
      }
    }

    function addExpense() {
      const titleInput = document.getElementById('exp-title');
      const payerSelect = document.getElementById('exp-payer');
      const amountInput = document.getElementById('exp-amount');
      const currencySelect = document.getElementById('exp-currency');
      const rateInput = document.getElementById('exp-rate');

      if (!titleInput || !amountInput) return;

      const title = titleInput.value.trim();
      const payer = payerSelect ? payerSelect.value : '';
      const amount = parseFloat(amountInput.value);
      const currency = currencySelect ? currencySelect.value : 'TWD';
      const rate = parseFloat(rateInput ? rateInput.value : 1.0) || 1.0;
      const checkedParts = Array.from(document.querySelectorAll('.part-check:checked')).map(cb => cb.value);

      if (!title || isNaN(amount) || amount <= 0 || checkedParts.length === 0) {
        alert("請完整輸入消費項目、金額與參與成員。");
        return;
      }

      const amountTwd = Math.round(amount * rate);
      appData.expenses.push({
        id: Date.now().toString(),
        title, payer, amount, currency, rate, amountTwd,
        participants: checkedParts
      });

      titleInput.value = '';
      amountInput.value = '';
      renderSplitTab();
      saveData();
    }

    function removeExpense(id) {
      appData.expenses = appData.expenses.filter(e => e.id !== id);
      renderSplitTab();
      saveData();
    }

    function renderExpensesList() {
      const container = document.getElementById('expenses-list');
      if (!container) return;

      if (!appData.expenses.length) {
        container.innerHTML = `<p class="text-xs text-jp-dark/40 py-4 text-center">尚無消費記錄。</p>`;
        return;
      }

      container.innerHTML = appData.expenses.map(e => `
        <div class="bg-jp-bg p-2.5 rounded-xl border border-jp-border text-xs flex items-center justify-between">
          <div>
            <div class="font-bold text-jp-dark">${e.title}</div>
            <div class="text-jp-dark/60 mt-0.5">
              ${e.payer} 付 <strong>${e.amount} ${CURRENCY_LABELS[e.currency] || e.currency}</strong> 
              ${e.currency !== 'TWD' ? `(折合 NT$ ${e.amountTwd})` : ''}
            </div>
            <div class="text-[10px] text-jp-dark/40">平分: ${e.participants.join(', ')}</div>
          </div>
          <button onclick="removeExpense('${e.id}')" class="text-jp-red p-1 no-print"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function calculatePairwiseSettlement() {
      const matrix = {};
      appData.members.forEach(m1 => {
        matrix[m1] = {};
        appData.members.forEach(m2 => { matrix[m1][m2] = 0; });
      });

      appData.expenses.forEach(exp => {
        const payer = exp.payer;
        const parts = exp.participants;
        if (!parts || !parts.length) return;
        
        const shareTwd = exp.amountTwd / parts.length;
        parts.forEach(p => {
          if (p !== payer) {
            matrix[p][payer] += shareTwd;
          }
        });
      });

      const container = document.getElementById('settlement-results');
      if (!container) return;
      let html = '';

      appData.members.forEach((m1, i) => {
        appData.members.forEach((m2, j) => {
          if (i < j) {
            const m1OwesM2 = matrix[m1][m2];
            const m2OwesM1 = matrix[m2][m1];
            const net = m1OwesM2 - m2OwesM1;

            if (Math.abs(net) > 1) {
              if (net > 0) {
                html += `
                  <div class="bg-jp-accentLight border border-jp-accent/20 p-3 rounded-xl text-xs flex justify-between items-center">
                    <div><span class="font-bold text-jp-dark">${m1}</span> 應直接轉帳給 <span class="font-bold text-jp-accent">${m2}</span></div>
                    <span class="text-sm font-extrabold text-jp-accent">NT$ ${Math.round(net)}</span>
                  </div>
                `;
              } else {
                html += `
                  <div class="bg-jp-accentLight border border-jp-accent/20 p-3 rounded-xl text-xs flex justify-between items-center">
                    <div><span class="font-bold text-jp-dark">${m2}</span> 應直接轉帳給 <span class="font-bold text-jp-accent">${m1}</span></div>
                    <span class="text-sm font-extrabold text-jp-accent">NT$ ${Math.round(-net)}</span>
                  </div>
                `;
              }
            }
          }
        });
      });

      if (!html) {
        html = `<p class="text-xs text-jp-dark/40 py-4 text-center">目前結算為 0，無人需轉帳。</p>`;
      }

      container.innerHTML = html;
    }
  </script>
</body>
</html>
